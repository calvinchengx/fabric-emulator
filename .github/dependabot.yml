version: 2

# The family's largest dependency surface, so the grouping matters more here
# than elsewhere: ungrouped, this repo would open a dozen PRs a week and the
# real signal would drown.
updates:
  # Go: the emulator itself. The Azure SDKs move together, so one grouped PR
  # keeps the witness suites upgrading as a compatible set.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      azure-sdk:
        patterns: ['github.com/Azure/azure-sdk-for-go/*', 'github.com/AzureAD/*']
      go:
        patterns: ['*']

  # pnpm workspace: root + portal + website share one root lockfile, so a
  # single entry at / covers all three package.json files.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Starlight peers a specific Astro major, so they must move as a pair —
      # majors included, or a fix landing only in the next Astro major is stuck.
      docs-site:
        patterns: ['astro', '@astrojs/*', 'sharp']
      portal:
        patterns: ['svelte', '@sveltejs/*', 'vite']
    ignore:
      # TypeScript 7 is held back by svelte-check, not by us. Its version gate
      # (bin/ts-version-check.js, still there in the current 4.7.5) throws on
      # any major above 6 and tells you to install BOTH majors side by side
      # under an npm alias and pass --tsgo, an experimental API. So the portal's
      # type gate does not merely fail to type-check under TypeScript 7, it
      # refuses to start, and every such bump arrives already red (#129).
      #
      # Held rather than worked around: the alternative is running the portal's
      # only type gate through an experimental code path, which buys nothing
      # here. Astro pulls TypeScript 7 transitively for the docs site and that
      # is fine, because nothing points svelte-check at it.
      #
      # LIFT THIS when svelte-check accepts TypeScript 7 on the default path.
      # The tell is its peerDependencies range, `^5.0.0 || ^6.0.0` today,
      # growing a 7. Minor and patch updates keep flowing meanwhile.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  # Python: uv-managed. TWO lockfiles, and the second is not optional.
  # e2e/fabric-cli is its own project because ms-fabric-cli pins
  # `pyyaml==6.0.2` exactly and that pin, held in a root dependency group, kept
  # the whole workspace from moving pyyaml. Moving it out must not also move it
  # out of Dependabot's view, so the directory is listed here: ms-fabric-cli
  # keeps getting updates, it just no longer constrains anything else.
  - package-ecosystem: uv
    directories:
      - /
      - /e2e/fabric-cli
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python:
        patterns: ['*']

  # The published imageS' base layers, plural. `directory: /` watched exactly
  # one file, ./Dockerfile, and this repository has twelve. The two that matter
  # most were among the eleven unwatched: docker/sail and docker/spark-agent are
  # PUBLISHED to GHCR by the release workflow and pulled by every platform in
  # the family, and both build `FROM python:3.12-slim` with nothing tracking it.
  # The runtimes beside them (spark-runtime on apache/spark:3.5.5,
  # python-runtime, jupyter) were unwatched for the same reason.
  #
  # E2E HARNESS IMAGES ARE DELIBERATELY OUT: e2e/*/Dockerfile and
  # examples/fab-driven exist only inside CI runs, are never published and never
  # reachable, so a base bump there is noise against the same PR budget the
  # shipped images compete for. Add `/e2e/*` here if that judgement changes.
  - package-ecosystem: docker
    directories:
      - /
      - /docker/*
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      # One PR for the four runtimes that share `python:3.12-slim`, rather than
      # four identical ones.
      docker:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ['*']
