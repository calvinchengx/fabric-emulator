version: 2

# The family's largest dependency surface, so the grouping matters more here
# than elsewhere: ungrouped, this repo would open a dozen PRs a week and the
# real signal would drown.
updates:
  # Go: the emulator itself. The Azure SDKs move together, so one grouped PR
  # keeps the witness suites upgrading as a compatible set.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      azure-sdk:
        patterns: ['github.com/Azure/azure-sdk-for-go/*', 'github.com/AzureAD/*']
      go:
        patterns: ['*']

  # pnpm workspace: root + portal + website share one root lockfile, so a
  # single entry at / covers all three package.json files.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Starlight peers a specific Astro major, so they must move as a pair —
      # majors included, or a fix landing only in the next Astro major is stuck.
      docs-site:
        patterns: ['astro', '@astrojs/*', 'sharp']
      portal:
        patterns: ['svelte', '@sveltejs/*', 'vite']
    ignore:
      # TypeScript 7 is held back by svelte-check, not by us. Its version gate
      # (bin/ts-version-check.js, still there in the current 4.7.5) throws on
      # any major above 6 and tells you to install BOTH majors side by side
      # under an npm alias and pass --tsgo, an experimental API. So the portal's
      # type gate does not merely fail to type-check under TypeScript 7, it
      # refuses to start, and every such bump arrives already red (#129).
      #
      # Held rather than worked around: the alternative is running the portal's
      # only type gate through an experimental code path, which buys nothing
      # here. Astro pulls TypeScript 7 transitively for the docs site and that
      # is fine, because nothing points svelte-check at it.
      #
      # LIFT THIS when svelte-check accepts TypeScript 7 on the default path.
      # The tell is its peerDependencies range, `^5.0.0 || ^6.0.0` today,
      # growing a 7. Minor and patch updates keep flowing meanwhile.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  # Python: uv-managed. TWO lockfiles, and the second is not optional.
  # e2e/fabric-cli is its own project because ms-fabric-cli pins
  # `pyyaml==6.0.2` exactly and that pin, held in a root dependency group, kept
  # the whole workspace from moving pyyaml. Moving it out must not also move it
  # out of Dependabot's view, so the directory is listed here: ms-fabric-cli
  # keeps getting updates, it just no longer constrains anything else.
  - package-ecosystem: uv
    directories:
      - /
      - /e2e/fabric-cli
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python:
        patterns: ['*']
    # THREE PACKAGES ARE CAPPED BY TOOLS WE PIN, NOT BY US. Each entry names
    # the constraint from the capping package's own published metadata, so the
    # claim can be rechecked rather than taken on trust, and each says what to
    # watch for before lifting it. Minor and patch updates keep flowing for all
    # three; only the majors that cannot resolve are held.
    #
    # These were the last three failures in this job. Verified by rewriting the
    # declared constraint the way Dependabot does and re-locking: pandas and
    # cryptography reproduce with the mlflow line below, and databricks-sdk
    # fails in Dependabot with the dbt-databricks line.
    ignore:
      # mlflow 3.15.1 `requires_dist`: `cryptography<50,>=43.0.0`.
      # Our own range is `>=42,<51`, so WE permit 50 and mlflow forbids it.
      # This is the one with a real cost: cryptography is security-relevant and
      # 49.x carries no open advisory today, but that could change while the
      # ceiling holds.
      #
      # LIFT THIS when mlflow's `requires_dist` admits cryptography 50.
      - dependency-name: cryptography
        update-types: ['version-update:semver-major']
      # mlflow 3.15.1 `requires_dist`: `pandas<3`.
      # Our main dependencies already say `pandas>=2,<3`; the `<4` in the
      # great-expectations group and the range in sail-delta are what let uv
      # consider pandas 3 at all, and neither can be satisfied while mlflow is
      # in the workspace. Tightening one of them is not enough, measured: the
      # other still pulls 3 into the resolution.
      #
      # LIFT THIS when mlflow admits pandas 3.
      - dependency-name: pandas
        update-types: ['version-update:semver-major']
      # dbt-databricks 1.12.4 `requires_dist`:
      # `databricks-sdk<0.118.0,>=0.68.0`, while our `databricks-sdk` group
      # pins `>=0.130,<1`. That is precisely why the two are already declared
      # conflicting in pyproject.toml; the conflict keeps them resolvable side
      # by side but does not stop Dependabot proposing a bump that is
      # unsatisfiable inside the dbt fork. The same package fails the same way
      # in contoso-data-product-databricks-jobs, held there for the same reason.
      #
      # LIFT THIS when dbt-databricks raises its databricks-sdk ceiling.
      - dependency-name: databricks-sdk

  # The published imageS' base layers, plural. `directory: /` watched exactly
  # one file, ./Dockerfile, and this repository has twelve. The two that matter
  # most were among the eleven unwatched: docker/sail and docker/spark-agent are
  # PUBLISHED to GHCR by the release workflow and pulled by every platform in
  # the family, and both build `FROM python:3.12-slim` with nothing tracking it.
  # The runtimes beside them (spark-runtime on apache/spark:3.5.5,
  # python-runtime, jupyter) were unwatched for the same reason.
  #
  # E2E HARNESS IMAGES ARE DELIBERATELY OUT: e2e/*/Dockerfile and
  # examples/fab-driven exist only inside CI runs, are never published and never
  # reachable, so a base bump there is noise against the same PR budget the
  # shipped images compete for. Add `/e2e/*` here if that judgement changes.
  - package-ecosystem: docker
    directories:
      - /
      - /docker/*
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      # One PR for the four runtimes that share `python:3.12-slim`, rather than
      # four identical ones.
      docker:
        patterns: ['*']
    # apache/spark's tag is a FIDELITY CLAIM, not a dependency to keep current.
    #
    # docs/engine-matrix.md states it outright: "Real Fabric Runtime 1.3 *is*
    # JVM Spark 3.5.5 + Delta 3.2 + Java 11", and docs/parity.md and
    # docs/20 repeat it. Bumping the tag does not update the oracle, it stops
    # the oracle being the thing it claims to emulate — and silently, because
    # the image still builds.
    #
    # Not theoretical: the 3.5.9 bump turned every Delta overwrite into
    # `AnalysisException: Table events does not support truncate in batch
    # mode` — Spark 3.5.9's V2 write path against the Delta 3.2.0 jars that
    # Runtime 1.3 pins. The fix is not a newer Delta (that breaks the claim
    # from the other side); it is not taking the bump.
    ignore:
      - dependency-name: apache/spark

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ['*']
