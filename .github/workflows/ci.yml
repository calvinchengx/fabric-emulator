name: CI

on:
  push:
    branches: [main]
  pull_request:

# PR refs supersede; MAIN COMMITS DO NOT.
#
# On a PR ref, a new push makes the run before it worthless, so it is cancelled:
# without that, a burst leaves every intermediate run grinding through the full
# three-OS matrix for a commit nobody will ship — 15 piled up in one afternoon
# and had to be cancelled by hand. That reasoning is sound for a branch under
# development and WRONG for main, where every commit is shipped and each one is
# the thing a bisect will later ask about.
#
# It had teeth: five consecutive merges left main with no green CI at all —
# 24ec739 and 0c8e6c4 failed, then 6af9ef2, 866952f and bae080f were each
# cancelled by the merge behind them. The REST connector reached main with its
# suite never having run there.
#
# The fix is the GROUP, not just the flag. `cancel-in-progress: false` alone is
# not enough: GitHub keeps at most one PENDING run per group and cancels earlier
# pending ones, so a burst would still skip the commits in the middle. Giving
# each main commit its own group is what guarantees every one gets a verdict.
#
# This workflow only reads — it builds and tests — so nothing is half-done
# either way. Do NOT copy the PR-side cancellation to a workflow that publishes:
# docs-site.yml uses `cancel-in-progress: false` because a cancelled deploy put
# the github-pages environment into `error`.
concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  test:
    name: Build, vet & tests (incl. e2e vs entra-emulator)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - run: go vet ./...
      # `go vet` was gated from the start; formatting never was, which is how a
      # stray blank line reached main and was found by hand rather than by CI.
      # Linux only: the check is platform-independent and running it three times
      # just triples the noise on a CRLF-related false alarm.
      - name: gofmt
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          unformatted=$(gofmt -l . | grep -v '^vendor/' || true)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would change these files:"; echo "$unformatted"; exit 1
          fi
          echo "gofmt clean"
      - run: go build ./...

      # --- a real SQL Server: Linux and Windows ---------------------------------
      # The warehouse tests gate on WAREHOUSE_MSSQL_DSN and skip without it. The
      # intent is one identical gate on all three legs; ONE is there so far:
      #
      #   ubuntu   docker, native amd64 — ~10s to first query. GATED.
      #   windows  LocalDB, already on the image. GATED. It runs INSERT BULK —
      #            internal/warehouse passes there in 105.9s at the same
      #            statement coverage as the Linux leg.
      #   macOS    NOT YET. `colima start --vm-type=vz --vz-rosetta` dies at
      #            "Setting up Rosetta share" on macos-26-arm64 — Rosetta is not
      #            exposed to the VM, so this is not a tuning problem and no flag
      #            combination fixes it. The only remaining route is QEMU
      #            interpreting the whole SQL Server userland, which is minutes
      #            per run to reproduce a number ubuntu already produces.
      #            Deprioritised deliberately, not forgotten.
      - name: SQL Server (Linux, native)
        if: matrix.os == 'ubuntu-latest'
        run: |
          # Same memory cap the compose files ship, so the warehouse tests run
          # against the configuration developers actually get. Without it CI
          # would validate an uncapped engine nobody runs.
          docker run -d --name mssql -e ACCEPT_EULA=Y \
            -e MSSQL_SA_PASSWORD='Str0ng!Passw0rd' \
            -e MSSQL_MEMORY_LIMIT_MB=2048 \
            -p 1433:1433 mcr.microsoft.com/mssql/server:2022-latest

      # A started container is not a ready one. `services:` would have waited on
      # a healthcheck; doing it by hand is the cost of not using it, and without
      # it the first test races SQL Server's boot.
      - name: Wait for SQL Server
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          for i in $(seq 1 60); do
            if docker exec mssql /opt/mssql-tools18/bin/sqlcmd \
                 -S localhost -U sa -P 'Str0ng!Passw0rd' -C -Q 'SELECT 1' >/dev/null 2>&1; then
              echo "ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::SQL Server never became ready"; docker logs mssql | tail -40; exit 1

      - name: Warehouse DSN
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          echo 'WAREHOUSE_MSSQL_DSN=server=localhost,1433;user id=sa;password=Str0ng!Passw0rd;encrypt=disable' >> "$GITHUB_ENV"

      # LocalDB, which the runner already ships — no container needed. The
      # Windows image has Docker but only WSLv1, which has no Linux kernel, and
      # mssql/server publishes no Windows manifest.
      #
      # The path is GLOBBED, not hard-coded: a first attempt assumed
      # "160\Tools\Binn" and got "not recognized"; a probe found it at 170 on
      # windows-2025-vs2026. Pinning a version means the next image bump loses
      # the engine INVISIBLY, because the tests skip rather than fail.
      #
      # The DSN is the ADO keyword form. A URL would truncate at the '#' in
      # `LOCALDB#A1B2C3D4` — '#' starts a fragment — and the connection would
      # fail on half a pipe name with nothing saying why.
      #
      # This wiring failed once with `dial tcp :1433` and an empty host: msdsn
      # parsed the pipe DSN as TCP because the go-mssqldb `namedpipe` blank
      # import lived only in internal/testsupport, not where the DSN is actually
      # parsed. It now lives in internal/tds with a test pinning it. Named-pipe
      # misparsing returns NO error, which is why that cost a run to find.
      - name: SQL Server LocalDB (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          # @(...) forces an array: -ExpandProperty returns a bare STRING on a
          # single match, and indexing that yields its first CHARACTER.
          $exe = @(Get-ChildItem "$env:ProgramFiles\Microsoft SQL Server" -Filter SqlLocalDB.exe `
                     -Recurse -ErrorAction SilentlyContinue |
                   Sort-Object FullName -Descending |
                   Select-Object -ExpandProperty FullName)[0]
          if (-not $exe) { throw "no SqlLocalDB.exe under $env:ProgramFiles\Microsoft SQL Server" }
          Write-Host "using $exe"
          & $exe create MSSQLLocalDB -s 2>$null
          & $exe start  MSSQLLocalDB    2>$null
          $info = & $exe info MSSQLLocalDB
          $pipe = (($info | Select-String 'Instance pipe name:') -replace '.*Instance pipe name:\s*', '').Trim()
          if (-not $pipe) { $info | Write-Host; throw "could not read the instance pipe name" }
          Write-Host "pipe: $pipe"
          "WAREHOUSE_MSSQL_DSN=server=$pipe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # The server tests start a real entra-emulator in-process and drive the
      # full token → JWKS → RBAC → LRO path over HTTP.
      # shell: bash keeps the coverage profile and the floor step below in
      # the same shell semantics on the Windows runner (pwsh vs Git Bash).
      - run: go test -coverpkg=./... -coverprofile=cover.out ./...
        shell: bash
      # Coverage floor: fail the build if total statement coverage regresses
      # below 90% — enforced only where a real SQL Server was reachable.
      #
      # The SQLite double is gone, so the warehouse tests skip without
      # WAREHOUSE_MSSQL_DSN: measured 91.2% with an engine against 89.4%
      # without. HEADROOM ON A GATED LEG IS 1.2 POINTS — that is the number that
      # decides whether a future change trips this gate, not the totals.
      # Enforcing on a leg with no engine would fail it at 89.4% for a reason
      # unrelated to the change being tested.
      #
      # The condition keys on the DSN, not on the platform, so the floor arms
      # itself the moment a leg gains an engine — nobody has to remember to edit
      # this when macOS is solved.
      #
      # TEMPORARY, and deliberately so: the intent remains one identical gate on
      # all three legs, and macOS is the only leg still short. The skip is a loud
      # ::warning:: rather than a silent pass, so "the floor is green" cannot
      # come to mean "the floor did not run" without someone seeing it said so.
      - name: Coverage floor (90%)
        shell: bash
        run: |
          total=$(go tool cover -func=cover.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "total coverage: ${total}%"
          if [ -z "${WAREHOUSE_MSSQL_DSN:-}" ]; then
            echo "::warning::no SQL Server on this leg — the warehouse tests skipped, so ${total}% is not comparable with the gated legs. Floor NOT enforced here."
            exit 0
          fi
          awk -v t="$total" 'BEGIN { exit (t < 90) ? 1 : 0 }'

      # Badge inputs, from the ONE leg whose number is comparable: a leg
      # without SQL Server measures ~1.2 points lower for a reason unrelated to
      # the code, and publishing that would make a red build look like a
      # regression. The python figure comes from the same place its floor does.
      #
      # Uploaded as an artifact rather than committed: the docs site consumes
      # it on its own schedule (docs-site.yml), so no generated number lands in
      # the repository's history.
      - uses: actions/setup-python@v6
        if: matrix.os == 'ubuntu-latest' && github.ref == 'refs/heads/main'
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        if: matrix.os == 'ubuntu-latest' && github.ref == 'refs/heads/main'
        with:
          version: "0.11.32"
      # Node as well, because the portal is the third measured tier and all five
      # badge numbers are written by one script — a second publisher would be a
      # second place for them to disagree.
      - uses: pnpm/action-setup@v6
        if: matrix.os == 'ubuntu-latest' && github.ref == 'refs/heads/main'
      - uses: actions/setup-node@v6
        if: matrix.os == 'ubuntu-latest' && github.ref == 'refs/heads/main'
        with:
          node-version: '22'
          cache: pnpm
      - name: Badge inputs
        if: matrix.os == 'ubuntu-latest' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          go_pct=$(go tool cover -func=cover.out | tail -1 | awk '{print $3}' | tr -d '%')
          py_pct=$(uv run --frozen --group test pytest python/tests -q \
                   --cov --cov-report=term 2>&1 \
                   | sed -n 's/.*Total coverage: \([0-9.]*\)%.*/\1/p' | tail -1)
          # Read from the machine-readable summary rather than scraped stdout:
          # the table's column layout is not a contract.
          #
          # `|| true`, and the guard below, because this step PUBLISHES a number —
          # it is not a second gate. The `portal` job already runs the same suite
          # with the same thresholds on every push and PR. Without this, a portal
          # failure reds the Go `test` job too, and only on main (this step is
          # main-only), so it lands after merge instead of on the PR. That is
          # exactly how it went wrong once.
          pnpm install --frozen-lockfile
          pnpm --filter fabric-emulator-portal test:coverage || true
          portal_pct=$(node -e "process.stdout.write(String(require('./portal/coverage/coverage-summary.json').total.statements.pct))" 2>/dev/null || true)
          echo "go=${go_pct} python=${py_pct:-unset} portal=${portal_pct:-unset}"
          uv run --frozen --group test python scripts/coverage_badges.py \
            --out badges --go "$go_pct" ${py_pct:+--python "$py_pct"} \
            ${portal_pct:+--portal "$portal_pct"}
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && github.ref == 'refs/heads/main'
        with:
          name: coverage-badges
          path: badges/
          retention-days: 14

  coverage-e2e:
    name: Coverage over unit + an instrumented live stack
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      # Real e2e suites, instrumented. Every harness layers
      # e2e/docker-compose.coverage.yml when FABRIC_COVERAGE is set, and they
      # all write into ONE repo-level covdata/, so the merge below sees the
      # whole fleet without needing a list of who ran.
      #
      # A representative subset rather than all sixteen: these three cover the
      # control plane, the Livy/agent path and the notebook drive, and the job
      # is already the slowest thing here. Adding another suite is one line —
      # the wiring is in the harness, not here.
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
      - name: Instrumented e2e suites
        env:
          FABRIC_COVERAGE: "1"
        run: |
          # chmod, not just mkdir: the container is nonroot (uid 65532) and a
          # bind mount keeps the host's ownership, so counters are silently
          # never written. Invisible on macOS, which is why this passed locally.
          scripts/coverage_prepare.sh
          for suite in notebook-run sail livy; do
            echo "::group::$suite"
            uv run --frozen --no-sync python "e2e/$suite/run.py" || echo "::warning::$suite failed; its counters may be partial"
            echo "::endgroup::"
          done
          test -n "$(ls -A covdata 2>/dev/null)" || {
            echo "::error::no coverage counters written — did the emulator exit cleanly?"; exit 1; }
          ls -1 covdata | head

      # Binary-format unit counters, so `go tool covdata merge` can fold both
      # legs together without a third-party merger.
      - name: Unit counters
        run: |
          go test -cover -coverpkg=./... ./... -args -test.gocoverdir=$PWD/covdata/unit

      - id: merge
        run: scripts/coverage_merge.sh

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-merged
          path: coverage-merged.out
          retention-days: 14

  engine-matrix:
    name: Spark engine matrix (Sail vs JVM) is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Regenerates the matrix from both engines and fails if the committed
      # file differs. That is what stops a claim like "SQL VERSION AS OF is a
      # Sail gap" surviving a Sail upgrade that closed it.
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
      # Maven Central rate-limits GitHub-hosted runners (shared IP pools), and a
      # 429 while building the Spark image failed this job twice in one day —
      # a red that reads as a regression and is really someone else's traffic.
      # Retrying does not fix a sustained per-IP limit; not making the request
      # does. The Dockerfile falls back to curl when the cache is cold, so this
      # is an optimisation rather than a dependency.
      - uses: actions/cache@v4
        with:
          path: docker/spark-runtime/jars
          key: spark-jars-${{ hashFiles('docker/spark-runtime/jars.txt') }}
      - run: scripts/fetch_spark_jars.sh
      - run: uv run --frozen --no-sync python e2e/engine-matrix/run.py && git diff --exit-code docs/engine-matrix.md

  witnesses:
    name: Every supported parity claim names its witness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # Strict: all 67 claims are mapped, so a new supported row without a
      # witness — or a witness that no longer exists — fails the build. That
      # second case is the valuable one: it catches a test being renamed or
      # deleted out from under the claim that depended on it.
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
      - run: uv run --frozen --no-sync python scripts/check_witnesses.py --strict
      # Cheap guard for the constraint the governance e2e discovers the
      # expensive way: a column OpenMetadata refuses costs the whole table.
      - run: uv run --frozen --no-sync python scripts/check_govern_types.py
      # The conformance contracts (docs/38) are proven by executing on a real
      # backend, which needs those backends live — that is the conformance job's
      # work, once the kit exists. This is the offline half: every contract the
      # document defines is assigned to the backends that prove it, and once the
      # matrix exists, every cell CI owes a verdict for has one. Not --strict
      # yet; the flag arms in the same change that lands the matrix, so it can
      # never afterwards go missing without failing here.
      - run: uv run --frozen --no-sync python scripts/check_conformance.py
      # docs/03's diagram described a two-system model for as long as
      # keyvault-emulator had been a default compose service — the topology was
      # right, the cast of services had drifted. Nothing about adding a service
      # reminds anyone to redraw, so the roster is asserted instead.
      - run: uv run --frozen --no-sync python scripts/check_arch_services.py
      # Starlight's sidebar is an explicit list — no autogenerate. A doc left
      # out still builds and still has a URL, but nothing links to it, so it is
      # published and unreachable. Same drift, same guard.
      - run: uv run --frozen --no-sync python scripts/check_docs_sidebar.py
      # The portal's event-kind list is GENERATED from internal/store/bus.go.
      # The stream names each SSE frame and EventSource has no wildcard
      # listener, so a kind missing from the client is invisible — no error,
      # no dropped count. This fails the build when the two disagree.
      - run: uv run --frozen --no-sync python scripts/gen_event_kinds.py --check

  lint:
    name: ruff + ty
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
      # Python had no static enforcement at all while Go had `go vet` from the
      # start: ~1800 statements of agent, notebookutils shim and invariant
      # scripts with nothing checking them. Both are configured in pyproject.toml,
      # where the ignores carry the reason they exist rather than being a bare
      # list of rule codes.
      - run: uv run --frozen --group lint ruff check .
      # NOT `ruff format --check`: it would reformat 195 files. This codebase's
      # line breaks are hand-placed to keep comments beside the code they
      # explain, and a formatter would undo that wholesale. Adopting one is a
      # deliberate decision with its own diff, not a side effect of linting.
      # ty is pre-1.0 and pinned tight for that reason — a checker that changes
      # its inferences between runs is a broken build nobody caused.
      # --group test as well: a checker that cannot see pytest does not know
      # `pytest.skip()` never returns, so a `str | None` guarded by it never
      # narrows and subprocess.run appears to be called with None. The checker
      # must see the packages the code actually runs with.
      - run: uv run --frozen --group lint --group test ty check

  example-parity:
    name: Each medallion pair differs only in silver
    runs-on: ubuntu-latest
    steps:
      # Full history is not needed, but the check asks GIT for its file list
      # rather than walking the filesystem — running either example leaves
      # artifacts behind, and only one of the pair is ever run at a time.
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # No job dependency and no emulator: this is a source-level claim, so it
      # answers in a second and fails before the medallion legs have finished
      # booting a stack. It is also the ONLY check that can see this class of
      # bug — a pair silently diverged twice already and every leg stayed
      # green, because each leg runs ONE half and nothing compares them.
      - run: python scripts/check_example_parity.py
  portal:
    name: Portal builds from source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A named script, NOT `test -- --coverage`: pnpm forwards the `--`
      # literally, so vitest reads `--coverage` as a positional test filter and
      # the thresholds never arm. The suite still passes, which is the worst
      # kind of green — it says the gate ran when nothing measured anything.
      - run: pnpm --filter fabric-emulator-portal test:coverage
      - run: pnpm --filter fabric-emulator-portal build
      # portal/dist is committed (go:embed bakes it into the binary so `go build`
      # / `go install @latest` need no Node). Fail if the committed copy has
      # drifted from a fresh build so it can never go stale.
      - name: Verify committed portal/dist is up to date
        run: |
          changes="$(git status --porcelain -- portal/dist)"
          if [ -n "$changes" ]; then
            echo "::error::portal/dist is stale. Run 'pnpm --filter fabric-emulator-portal build' and commit portal/dist."
            echo "$changes"
            exit 1
          fi
      # Headless mount smoke: `vite build` + jsdom unit tests pass even when the
      # bundle resolves Svelte to its server build and never mounts. Only a real
      # browser catches that, so assert the built dist actually renders.
      - run: pnpm --filter fabric-emulator-portal exec playwright install --with-deps chromium
      - run: pnpm --filter fabric-emulator-portal smoke

  portal-types:
    name: svelte-check + a new kind must not compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
      - run: pnpm install --frozen-lockfile
      # A SEPARATE job from `portal`, the way `ruff + ty` is separate from the Go
      # build: a red X here says "the types are wrong", not "the bundle is
      # broken", and the two fail for unrelated reasons.
      #
      # Errors only. The warnings are svelte-check's CSS parser not knowing
      # Tailwind's `@apply`/`@reference`, plus unused-selector notes that predate
      # this job — real, worth a change of their own, and not a type contract.
      - run: pnpm --filter fabric-emulator-portal check
      # The types are only a guarantee if they still BITE. This declares a kind
      # in Go that nothing renders and requires the portal to stop compiling —
      # a `default:` arm or a stray `as any` in Flow.svelte would keep every
      # other check green while quietly restoring the silent-loss bug.
      - run: uv run --frozen --no-sync python scripts/check_kind_exhaustiveness.py

  fabric-cicd:
    name: Real fabric-cicd tool publishes into the emulator
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
      # Self-contained: starts entra-emulator (go install) + fabric-emulator,
      # installs fabric-cicd in a venv, publishes a notebook repo, and
      # verifies the definition round-trips (idempotently).
      - run: uv run --frozen --group fabric-cicd python e2e/fabric-cicd/run.py

  fabric-target:
    name: fabric_target toggle drives the emulator profile (T0)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
      # Unit layer: pure resolver tests (no network). Install the package so
      # fabric_target is importable from any rootdir.
      - run: uv run --frozen --group fabric-target pytest python/fabric-target/tests -q
      # Live layer: target() -> credential -> session -> workspace-by-name ->
      # item -> LRO poll -> guards, against real entra+fabric binaries.
      - run: uv run --frozen --group fabric-target python e2e/fabric-target/run.py

  rti:
    name: Microsoft's Kusto engine (kustainer) executes KQL behind Eventhouse (containerized)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The optional `rti` profile, witnessed: Microsoft's own KQL engine
      # container backs the emulator's Eventhouse / KQL Database surface. The
      # witness reads properties.queryServiceUri off the control plane and
      # speaks the Kusto REST protocol to it — create a table, ingest rows,
      # query them back — with every KQL statement computed by the engine.
      # Two client families over the same surface: raw REST and Microsoft's
      # own azure-kusto-data SDK. Linux/amd64 only: Microsoft documents ARM as
      # unsupported for the engine (its native layer needs AVX2), so this is
      # the only place the engine can be witnessed at all.
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
      - run: uv run --frozen --no-sync python e2e/rti/run.py

  external-s3:
    name: Real S3 server (SeaweedFS) behind a OneLake shortcut, SigV4 enforced (containerized)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # External-store shortcuts, witnessed against a real S3 server rather
      # than an anonymous HTTP endpoint. SeaweedFS runs with an identity
      # config, so every request must carry a valid AWS SigV4 signature: the
      # witness writes the object with boto3 (Amazon's own SDK), proves an
      # unsigned GET is refused, then reads the object back through OneLake —
      # which forces the emulator to sign the upstream request itself. A
      # deliberately wrong secret must be refused, or nothing is being
      # verified.
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
      - run: uv run --frozen --no-sync python e2e/s3/run.py

  azurite-shortcut:
    name: ADLS Gen2 shortcut reads against Azurite, SAS enforced (containerized)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The ADLS Gen2 shortcut *read path*, witnessed against Microsoft's own
      # storage emulator instead of a hand-written stub. Azurite implements
      # Blob/Queue/Table and NOT ADLS Gen2, so the endpoint is the Blob one —
      # legitimate here because the read-through issues a plain authenticated
      # GET, identical on both endpoints of a real ADLS Gen2 account. DFS
      # semantics are not witnessed and are not claimed to be.
      # Non-vacuous by construction: azure-storage-blob writes the blob, an
      # unauthenticated GET must 403, and a tampered SAS must be refused.
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
      - run: uv run --frozen --no-sync python e2e/azurite-shortcut/run.py

  salesforce:
    name: Salesforce round trip through Bulk API 2.0 (containerized)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # A ROUND TRIP, not a one-way read: reading alone can pass while the rows
      # are subtly wrong and still produce a plausible count. Writing them back
      # and comparing what the org RECEIVED against what it SERVED is what
      # catches a shape that only looked right.
      #
      # The stand-in org is faithful in the four places that decide whether this
      # works against a real org: a query job sits InProgress before results
      # exist (and the org COUNTS the polls), result paging ends on the literal
      # string "null", the upload is PUT with text/csv and anything else is
      # REJECTED, and a job left Open is never processed.
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
      - run: uv run --frozen --no-sync python e2e/salesforce/run.py

  rest-helix:
    name: BMC Helix incidents ingest through the REST connector (containerized)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The end-to-end claim the REST connector exists for, against the case that
      # motivates it: BMC Helix has NO Fabric connector — not in Fabric, ADF or
      # Power Query — so the generic REST connector is the only supported route.
      # Its competitor ServiceNow has a first-party connector; Helix does not.
      #
      # The stand-in server is faithful in the three places that decide whether
      # this works against Helix rather than against a convenient fiction: login
      # answers a RAW JWT as the whole body, the scheme is AR-JWT and `Bearer` is
      # REJECTED, and records nest under `values` so auto-flatten finds no scalar
      # columns and translator.mappings is doing real work.
      #
      # 5 incidents at a page size of 2 means a connector that read only the
      # first page reports 2 and looks healthy — the row count is the assertion
      # that only full pagination can satisfy.
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
      - run: uv run --frozen --no-sync python e2e/rest-helix/run.py

  external-shortcuts:
    name: Shortcut target kinds resolve through OneLake (containerized)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Breadth, where external-s3 and azurite-shortcut give depth: those two
      # prove one target kind each against a real server (SigV4, SAS). This
      # walks BOTH documented external kinds — adlsGen2 and amazonS3 — through
