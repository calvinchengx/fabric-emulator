name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build, vet & tests (incl. e2e vs entra-emulator)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - run: go vet ./...
      - run: go build ./...

      # --- a real SQL Server: Linux and Windows ---------------------------------
      # The warehouse tests gate on WAREHOUSE_MSSQL_DSN and skip without it. The
      # intent is one identical gate on all three legs; ONE is there so far:
      #
      #   ubuntu   docker, native amd64 — ~10s to first query. GATED.
      #   windows  LocalDB, already on the image. GATED. It runs INSERT BULK —
      #            internal/warehouse passes there in 105.9s at the same
      #            statement coverage as the Linux leg.
      #   macOS    NOT YET. `colima start --vm-type=vz --vz-rosetta` dies at
      #            "Setting up Rosetta share" on macos-26-arm64 — Rosetta is not
      #            exposed to the VM, so this is not a tuning problem and no flag
      #            combination fixes it. The only remaining route is QEMU
      #            interpreting the whole SQL Server userland, which is minutes
      #            per run to reproduce a number ubuntu already produces.
      #            Deprioritised deliberately, not forgotten.
      - name: SQL Server (Linux, native)
        if: matrix.os == 'ubuntu-latest'
        run: |
          docker run -d --name mssql -e ACCEPT_EULA=Y \
            -e MSSQL_SA_PASSWORD='Str0ng!Passw0rd' \
            -p 1433:1433 mcr.microsoft.com/mssql/server:2022-latest

      # A started container is not a ready one. `services:` would have waited on
      # a healthcheck; doing it by hand is the cost of not using it, and without
      # it the first test races SQL Server's boot.
      - name: Wait for SQL Server
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          for i in $(seq 1 60); do
            if docker exec mssql /opt/mssql-tools18/bin/sqlcmd \
                 -S localhost -U sa -P 'Str0ng!Passw0rd' -C -Q 'SELECT 1' >/dev/null 2>&1; then
              echo "ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::SQL Server never became ready"; docker logs mssql | tail -40; exit 1

      - name: Warehouse DSN
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          echo 'WAREHOUSE_MSSQL_DSN=server=localhost,1433;user id=sa;password=Str0ng!Passw0rd;encrypt=disable' >> "$GITHUB_ENV"

      # LocalDB, which the runner already ships — no container needed. The
      # Windows image has Docker but only WSLv1, which has no Linux kernel, and
      # mssql/server publishes no Windows manifest.
      #
      # The path is GLOBBED, not hard-coded: a first attempt assumed
      # "160\Tools\Binn" and got "not recognized"; a probe found it at 170 on
      # windows-2025-vs2026. Pinning a version means the next image bump loses
      # the engine INVISIBLY, because the tests skip rather than fail.
      #
      # The DSN is the ADO keyword form. A URL would truncate at the '#' in
      # `LOCALDB#A1B2C3D4` — '#' starts a fragment — and the connection would
      # fail on half a pipe name with nothing saying why.
      #
      # This wiring failed once with `dial tcp :1433` and an empty host: msdsn
      # parsed the pipe DSN as TCP because the go-mssqldb `namedpipe` blank
      # import lived only in internal/testsupport, not where the DSN is actually
      # parsed. It now lives in internal/tds with a test pinning it. Named-pipe
      # misparsing returns NO error, which is why that cost a run to find.
      - name: SQL Server LocalDB (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          # @(...) forces an array: -ExpandProperty returns a bare STRING on a
          # single match, and indexing that yields its first CHARACTER.
          $exe = @(Get-ChildItem "$env:ProgramFiles\Microsoft SQL Server" -Filter SqlLocalDB.exe `
                     -Recurse -ErrorAction SilentlyContinue |
                   Sort-Object FullName -Descending |
                   Select-Object -ExpandProperty FullName)[0]
          if (-not $exe) { throw "no SqlLocalDB.exe under $env:ProgramFiles\Microsoft SQL Server" }
          Write-Host "using $exe"
          & $exe create MSSQLLocalDB -s 2>$null
          & $exe start  MSSQLLocalDB    2>$null
          $info = & $exe info MSSQLLocalDB
          $pipe = (($info | Select-String 'Instance pipe name:') -replace '.*Instance pipe name:\s*', '').Trim()
          if (-not $pipe) { $info | Write-Host; throw "could not read the instance pipe name" }
          Write-Host "pipe: $pipe"
          "WAREHOUSE_MSSQL_DSN=server=$pipe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # The server tests start a real entra-emulator in-process and drive the
      # full token → JWKS → RBAC → LRO path over HTTP.
      # shell: bash keeps the coverage profile and the floor step below in
      # the same shell semantics on the Windows runner (pwsh vs Git Bash).
      - run: go test -coverpkg=./... -coverprofile=cover.out ./...
        shell: bash
      # Coverage floor: fail the build if total statement coverage regresses
      # below 90% — enforced only where a real SQL Server was reachable.
      #
      # The SQLite double is gone, so the warehouse tests skip without
      # WAREHOUSE_MSSQL_DSN: measured 91.2% with an engine against 89.4%
      # without. HEADROOM ON A GATED LEG IS 1.2 POINTS — that is the number that
      # decides whether a future change trips this gate, not the totals.
      # Enforcing on a leg with no engine would fail it at 89.4% for a reason
      # unrelated to the change being tested.
      #
      # The condition keys on the DSN, not on the platform, so the floor arms
      # itself the moment a leg gains an engine — nobody has to remember to edit
      # this when macOS is solved.
      #
      # TEMPORARY, and deliberately so: the intent remains one identical gate on
      # all three legs, and macOS is the only leg still short. The skip is a loud
      # ::warning:: rather than a silent pass, so "the floor is green" cannot
      # come to mean "the floor did not run" without someone seeing it said so.
      - name: Coverage floor (90%)
        shell: bash
        run: |
          total=$(go tool cover -func=cover.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "total coverage: ${total}%"
          if [ -z "${WAREHOUSE_MSSQL_DSN:-}" ]; then
            echo "::warning::no SQL Server on this leg — the warehouse tests skipped, so ${total}% is not comparable with the gated legs. Floor NOT enforced here."
            exit 0
          fi
          awk -v t="$total" 'BEGIN { exit (t < 90) ? 1 : 0 }'

  engine-matrix:
    name: Spark engine matrix (Sail vs JVM) is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Regenerates the matrix from both engines and fails if the committed
      # file differs. That is what stops a claim like "SQL VERSION AS OF is a
      # Sail gap" surviving a Sail upgrade that closed it.
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
      - run: uv run --frozen --no-sync python e2e/engine-matrix/run.py && git diff --exit-code docs/engine-matrix.md

  witnesses:
    name: Every supported parity claim names its witness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # Strict: all 67 claims are mapped, so a new supported row without a
      # witness — or a witness that no longer exists — fails the build. That
      # second case is the valuable one: it catches a test being renamed or
      # deleted out from under the claim that depended on it.
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
      - run: uv run --frozen --no-sync python scripts/check_witnesses.py --strict
  portal:
    name: Portal builds from source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter fabric-emulator-portal test
      - run: pnpm --filter fabric-emulator-portal build
      # portal/dist is committed (go:embed bakes it into the binary so `go build`
      # / `go install @latest` need no Node). Fail if the committed copy has
      # drifted from a fresh build so it can never go stale.
      - name: Verify committed portal/dist is up to date
        run: |
          changes="$(git status --porcelain -- portal/dist)"
          if [ -n "$changes" ]; then
            echo "::error::portal/dist is stale. Run 'pnpm --filter fabric-emulator-portal build' and commit portal/dist."
            echo "$changes"
            exit 1
          fi
      # Headless mount smoke: `vite build` + jsdom unit tests pass even when the
      # bundle resolves Svelte to its server build and never mounts. Only a real
      # browser catches that, so assert the built dist actually renders.
      - run: pnpm --filter fabric-emulator-portal exec playwright install --with-deps chromium
      - run: pnpm --filter fabric-emulator-portal smoke

  fabric-cicd:
    name: Real fabric-cicd tool publishes into the emulator
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
      # Self-contained: starts entra-emulator (go install) + fabric-emulator,
      # installs fabric-cicd in a venv, publishes a notebook repo, and
      # verifies the definition round-trips (idempotently).
      - run: uv run --frozen --group fabric-cicd python e2e/fabric-cicd/run.py

  fabric-target:
    name: fabric_target toggle drives the emulator profile (T0)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
      # Unit layer: pure resolver tests (no network). Install the package so
      # fabric_target is importable from any rootdir.
      - run: uv run --frozen --group fabric-target pytest python/fabric-target/tests -q
      # Live layer: target() -> credential -> session -> workspace-by-name ->
      # item -> LRO poll -> guards, against real entra+fabric binaries.
      - run: uv run --frozen --group fabric-target python e2e/fabric-target/run.py

  rti:
    name: Microsoft's Kusto engine (kustainer) executes KQL behind Eventhouse (containerized)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The optional `rti` profile, witnessed: Microsoft's own KQL engine
      # container backs the emulator's Eventhouse / KQL Database surface. The
      # witness reads properties.queryServiceUri off the control plane and
      # speaks the Kusto REST protocol to it — create a table, ingest rows,
      # query them back — with every KQL statement computed by the engine.
      # Two client families over the same surface: raw REST and Microsoft's
      # own azure-kusto-data SDK. Linux/amd64 only: Microsoft documents ARM as
      # unsupported for the engine (its native layer needs AVX2), so this is
      # the only place the engine can be witnessed at all.
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
      - run: uv run --frozen --no-sync python e2e/rti/run.py

  external-s3:
    name: Real S3 server (SeaweedFS) behind a OneLake shortcut, SigV4 enforced (containerized)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # External-store shortcuts, witnessed against a real S3 server rather
      # than an anonymous HTTP endpoint. SeaweedFS runs with an identity
      # config, so every request must carry a valid AWS SigV4 signature: the
      # witness writes the object with boto3 (Amazon's own SDK), proves an
      # unsigned GET is refused, then reads the object back through OneLake —
      # which forces the emulator to sign the upstream request itself. A
      # deliberately wrong secret must be refused, or nothing is being
      # verified.
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
      - run: uv run --frozen --no-sync python e2e/s3/run.py

  azurite-shortcut:
    name: ADLS Gen2 shortcut reads against Azurite, SAS enforced (containerized)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The ADLS Gen2 shortcut *read path*, witnessed against Microsoft's own
      # storage emulator instead of a hand-written stub. Azurite implements
      # Blob/Queue/Table and NOT ADLS Gen2, so the endpoint is the Blob one —
      # legitimate here because the read-through issues a plain authenticated
      # GET, identical on both endpoints of a real ADLS Gen2 account. DFS
      # semantics are not witnessed and are not claimed to be.
      # Non-vacuous by construction: azure-storage-blob writes the blob, an
      # unauthenticated GET must 403, and a tampered SAS must be refused.
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
      - run: uv run --frozen --no-sync python e2e/azurite-shortcut/run.py

  external-shortcuts:
    name: Shortcut target kinds resolve through OneLake (containerized)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Breadth, where external-s3 and azurite-shortcut give depth: those two
      # prove one target kind each against a real server (SigV4, SAS). This
      # walks BOTH documented external kinds — adlsGen2 and amazonS3 — through
      # create-shortcut then read-through-OneLake, so a kind that stops
      # resolving cannot hide behind the other's coverage.
      #
      # The suite existed without a job for it: nothing ran it on push, and it
      # only surfaced because a local runner enumerates e2e/*/run.py.
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
      - run: uv run --frozen --no-sync python e2e/external-shortcuts/run.py

  governance:
    name: OpenMetadata governance profile catalogs the emulator (containerized)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
      # The optional governance profile, witnessed: family + OpenMetadata
      # (Postgres) up, a real Delta table seeded via delta-rs, govern-ingest
      # catalogs it, and OM's API must return the table with columns mapped
      # from the Delta schema. Linux-only (heavy: OM server + Elasticsearch).
      - run: uv run --frozen --group governance python e2e/governance/run.py

  governance-sso:
    name: OpenMetadata authenticates against entra-emulator (containerized)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
      # The catalog inside the family trust chain: OM's authenticator is
      # entra-emulator, so an entra-minted user token is accepted while
      # badly-signed and expired ones are refused. Linux-only (heavy).
      - run: uv run --frozen --group governance python e2e/governance/sso.py

  delta-rs:
    name: Real delta-rs writes Delta through OneLake
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
      # Starts entra-emulator + fabric-emulator, then the real `deltalake`
      # (delta-rs) engine writes and reads a Delta table through the OneLake
      # Blob surface with an entra-minted Storage token — exercising Range
      # reads and the _delta_log put-if-absent commit primitive.
      - run: uv run --frozen --group delta-rs python e2e/delta-rs/run.py

  adls-sdk:
    name: Real Azure Blob SDK round-trips through OneLake
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
      # Microsoft's real `azure-storage-blob` SDK uploads a pyarrow-written
      # Parquet, downloads it byte-identical (exercising x-ms-range), lists
      # blobs, and the DFS surface sees the same file — the ADLS SDK oracle.
      - run: uv run --frozen --group adls-sdk python e2e/adls-sdk/run.py

  azcopy:
    name: Real azcopy transfers through OneLake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # Microsoft's real `azcopy` binary uploads a multi-block file (Put Block +
      # Put Block List), downloads it byte-identical, and the DFS surface sees
      # the same object. Linux-only: azcopy (a Go binary) trusts the emulator's
      # self-signed CA via SSL_CERT_FILE, which the macOS system verifier rejects
      # for the dev cert's >825-day validity.
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
      - run: uv run --frozen --no-sync python e2e/azcopy/run.py

  docker-smoke:
    name: Production image runs and persists (container smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Builds the distroless image and runs it with a persistent volume,
      # asserting the nonroot user opens its SQLite DB and writes state to
      # the volume — the container path nothing else in CI exercised.
      - run: ./scripts/docker-smoke.sh

  vscode-extension:
    name: Fabric Data Engineering VS Code extension contract (containerized)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
      # Replays the routes extracted from Microsoft's pinned extension 1.18.1
      # through the production host alias and a real Power BI-audience token.
      - run: uv run --frozen --no-sync python e2e/vscode-extension/run.py

  airflow:
    name: Apache Airflow job runs on the real Fabric-pinned engine (containerized)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
      # Airflow 2.10.5/Python 3.12 discovers the uploaded DAG, schedules it,
      # executes its task, and determines the Fabric job's terminal state.
      - run: uv run --frozen --no-sync python e2e/airflow/run.py

  spark-a2:
    name: Spark Connect API on Sail writes Delta through OneLake (containerized)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Builds fabric-emulator from source + the Sail image, then a real
      # PySpark Connect client writes/reads a Delta table through the
      # OneLake plane using production-shaped abfs:// URLs. No JVM anywhere.
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
      - run: uv run --frozen --no-sync python e2e/spark/run.py

  livy-native:
    name: Native Livy sessions drive Sail (containerized)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The emulator terminates the Livy REST protocol itself and drives a Spark
      # statement-executor agent — a real client creates a session, submits
      # PySpark statements, and gets results computed by Sail, with NO
      # Apache Livy server. The engine is Sail (no JVM), like spark-a2.
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
      - run: uv run --frozen --no-sync python e2e/livy/run.py

  sail:
    name: LakeSail Sail (Rust Spark Connect) writes Delta through OneLake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # S0 of the JVM-replacement track (docs/20-lakesail-engine.md): a real
      # PySpark Connect client drives Sail (no JVM in any container), writing
      # and reading Delta through the OneLake Blob surface with entra
      # client-credentials auth minted before server start.
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
      - run: uv run --frozen --no-sync python e2e/sail/run.py

  data-science-loop:
    name: Spark to Direct Lake DAX to MLflow to dbt (containerized)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # One physical OneLake Delta table crosses four real engines/clients:
      # Sail executes PySpark SQL, Direct Lake evaluates DAX, MLflow 3 tracks
      # the observation, and dbt-duckdb's Delta plugin builds/tests it.
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
      - run: uv run --frozen --no-sync python e2e/data-science-loop/run.py

  fabric-cli:
    name: Microsoft's Fabric CLI (fab) drives the control plane + deployment pipelines (containerized)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Microsoft's own `fab` CLI authenticates (service principal via entra-
      # emulator + MSAL) and drives the emulator's Fabric REST control plane:
      # workspace + item CRUD (Notebook/SemanticModel/Report/DataPipeline/
      # Lakehouse), ls/get, and the raw api passthrough. It also runs the
      # deployment-pipeline sequence from Microsoft's own
      # DeploymentPipelines-DeployAll.ps1 sample (list -> stages -> deploy ->
      # poll -> result) via `fab api`, since fab 1.6 has no typed verbs for
      # that surface. The highest-authority borrowed oracle. Linux-only
      # (docker compose), like the other e2es.
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
      - run: uv run --frozen --no-sync python e2e/fabric-cli/run.py

  deployment-pipelines-ps:
    name: Azure PowerShell drives deployment pipelines (containerized)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # A SECOND, independent client family for the deployment-pipeline
      # surface: the fabric-cli job reaches it from Python/MSAL, this one from
      # .NET/MSAL via Az.Accounts — the Connect-AzAccount + Get-AzAccessToken
      # flow Microsoft's own DeploymentPipelines-DeployAll.ps1 uses, then that
      # script's REST sequence. Proves entra-emulator satisfies MSAL's .NET
      # implementation, not just its Python one. Linux-only (docker compose).
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
      - run: uv run --frozen --no-sync python e2e/deployment-pipelines/run.py

  dbt-fabricspark:
    name: Microsoft's dbt-fabricspark drives Livy HC on Sail (containerized)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Microsoft's real dbt-fabricspark adapter runs a dbt project (debug ->
      # seed -> run -> test) against the emulator's Fabric REST + Livy
      # High-Concurrency surface, with Sail computing the models and an
      # Entra token minted by entra-emulator. A second, independent client over
      # the Livy HC layer — parity witness. Linux-only (Sail container stack).
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
      - run: uv run --frozen --no-sync python e2e/dbt-fabricspark/run.py

  dbt-fabric:
    name: Microsoft's dbt-fabric drives the TDS warehouse via ODBC Driver 18 (containerized)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Microsoft's real dbt-fabric adapter runs a dbt project (debug -> seed ->
      # run -> test) against the emulator's TDS warehouse surface through the
      # Microsoft ODBC Driver 18 + FedAuth (token minted by entra-emulator),
      # byte-spliced to a real SQL Server sidecar. The second, independent TDS
      # driver witness (go-mssqldb is the first). Linux-only (SQL Server image).
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
      - run: uv run --frozen --no-sync python e2e/dbt-fabric/run.py

  # All four medallion examples, one matrix. They differ in exactly two axes —
  # simple vs advanced, and PySpark vs dbt-fabricspark for bronze -> silver — so
  # four near-identical jobs would be four copies of the same ODBC install
  # drifting apart. The job id stays `medallion` because docs/witnesses.json
  # names `ci:medallion` as the witness for several parity claims.
  #
  # Gold is a WAREHOUSE in all four, built by dbt-fabric over TDS: dbt-fabricspark
  # materialises into a Lakehouse and has no path to a Warehouse. The engine
  # choice these legs compare is upstream, in the Lakehouse-to-Lakehouse half.
  #
  # The EXAMPLES run on the runner, not in containers: they are client code a
  # reader runs on their own machine, and the stack they talk to is what belongs
  # in docker. That is why the driver is installed here — and why these legs
  # exercise self-signed TLS on localhost, the transport the READMEs document.
  # Linux-only: the SQL Server image is amd64 and ships no arm64 manifest.
  medallion:
    name: ${{ matrix.title }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The runnable witness for docs/28-tutorial-end-to-end.md: a Key Vault
          # secret behind an AKV-reference connection, an extract landed in
          # OneLake, bronze -> silver on Sail, silver -> gold with Microsoft's
          # dbt-fabric over TDS + FedAuth, and a semantic model queried through
          # executeQueries with a Power BI audience token. Also proves the gold
          # DQ tests REJECT bad data, not merely pass on good.
          - harness: medallion
            example: medallion-pyspark
            title: "Medallion — PySpark to silver, dbt-fabric to a Warehouse gold"
          # Same pipeline, silver built declaratively by Microsoft's
          # dbt-fabricspark over the Livy HC surface with Sail behind it. Its
          # compare step SKIPS here — the other half is built by a different leg
          # on a different runner — and the assertion that both silvers agree row
          # for row is made by the medallion-compare job below, which has both.
          - harness: medallion-dbt-fabricspark
            example: medallion-dbt-fabricspark
            title: "Medallion — dbt-fabricspark to silver, dbt-fabric to a Warehouse gold"
          # Three source systems. No key spans all three, so an ERP account
          # reaches a Web account only THROUGH POS — identity as a graph, which
          # a two-source example never has to face. The resolution is
          # materialised and the star joins both selling channels in gold; the
          # step that resolves also names the cohorts it cannot place.
          - harness: medallion-advanced
            example: medallion-advanced-pyspark
            title: "Advanced medallion — three sources resolved and joined (PySpark silver)"
          - harness: medallion-advanced-dbt-fabricspark
            example: medallion-advanced-dbt-fabricspark
            title: "Advanced medallion — three sources resolved and joined (dbt-fabricspark silver)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Microsoft ODBC Driver 18 (dbt-fabric + pyodbc)
        run: |
          # gpg is run as the normal user, NOT under sudo: `sudo gpg --dearmor`
          # tries to open /dev/tty, which a runner does not have, and dies with
          # "cannot open '/dev/tty'". The Dockerfile this replaced was root and
          # never hit it. Dearmor to a temp file, then install it with sudo.
          curl -sSL https://packages.microsoft.com/keys/microsoft.asc \
            | gpg --dearmor --batch --yes -o /tmp/microsoft-prod.gpg
          sudo install -o root -g root -m 644 \
            /tmp/microsoft-prod.gpg /usr/share/keyrings/microsoft-prod.gpg
          echo "deb [signed-by=/usr/share/keyrings/microsoft-prod.gpg] https://packages.microsoft.com/ubuntu/24.04/prod noble main" \
            | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y --no-install-recommends msodbcsql18 unixodbc
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
      - run: uv run --frozen --no-sync python e2e/${{ matrix.harness }}/run.py
      # Each leg's silver summary, so the comparison below can have BOTH halves.
      # A leg cannot compare itself: the counterpart is built by a different
      # example on a different runner, which is why compare.py skips when run
      # inside a single leg.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: silver-summary-${{ matrix.harness }}
          path: examples/${{ matrix.example }}/silver_summary.json
          if-no-files-found: warn

  # The assertion the dbt-fabricspark example exists to make: two tools, one
  # answer. It cannot run inside either leg — each produces one half — so it runs
  # here, with both summaries downloaded, and it is a GATE rather than a nudge.
  #
  # This job is load-bearing for compare.py's skip. That skip is only honest
  # while this exists to make the assertion somewhere; delete this and the
  # comparison silently stops being made, which is precisely the failure the
  # comparison is for. Remove them together or not at all.
  medallion-compare:
    name: Both silver builds agree, row for row
    needs: medallion
    # `needs` on a MATRIX job waits on every leg, so one unrelated leg failing
    # skips this one — and a skipped job is not a failure, so the assertion just
    # silently stops being made. That happened on the first run: both legs this
    # job depends on were green, two advanced legs were not, and the comparison
    # never ran while CI showed no complaint about it.
    #
    # So it runs unless the workflow was cancelled, and the summaries-present
    # check below decides. A missing summary fails loudly rather than skipping,
    # which is noisier when a basic leg is already red and worth it: this job
    # exists so the comparison cannot quietly not happen.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: silver-summary-medallion
          path: examples/medallion-pyspark
      - uses: actions/download-artifact@v4
        with:
          name: silver-summary-medallion-dbt-fabricspark
          path: examples/medallion-dbt-fabricspark
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
      # Fail loudly if a summary is missing rather than letting compare.py's
      # skip fire here — in THIS job an absent half means the artifact plumbing
      # broke, not that a developer ran one example.
      - run: |
          for f in examples/medallion-pyspark/silver_summary.json \
                   examples/medallion-dbt-fabricspark/silver_summary.json; do
            [ -f "$f" ] || { echo "::error::$f was not published by the medallion legs"; exit 1; }
          done
      - run: uv run --frozen --no-sync python examples/medallion-dbt-fabricspark/compare.py

  duckdb:
    name: Real DuckDB SQL over lakehouse Delta
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
      # Real DuckDB runs SQL (aggregation, join, filter) over Delta tables in
      # the OneLake plane — the lakehouse SQL-analytics-endpoint semantics.
      - run: uv run --frozen --group duckdb python e2e/duckdb/run.py

  notebookutils:
    name: notebookutils shim drives the family (notebook loop)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
      # T2 unit layer: the shim resolves emulator vs real Fabric from
      # FABRIC_TARGET (endpoints, TLS, and DefaultAzureCredential in real
      # mode) with no network and no Azure.
      - run: uv run --frozen --group test pytest python/tests -q
      # Brings up entra + fabric + azure-keyvault and runs a real Fabric
      # notebook that drives the functional notebookutils shim: fs over
      # OneLake, credential tokens, Key Vault secret brokering, lakehouse
      # control plane, and notebook.run — the notebook developer loop.
      - run: uv run --frozen --group test python e2e/notebookutils/run.py

  notebook-run:
    name: Sail executes representative notebook cells (containerized)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The emulator parses a real Fabric notebook into cells, Sail executes
      # them through Spark Connect against OneLake (a Delta
      # table lands), and the run is reported back so the RunNotebook job
      # reflects real execution. Linux-only.
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
      - run: uv run --frozen --no-sync python e2e/notebook-run/run.py

  warehouse-tds:
    name: Real SQL Server relay through the TDS endpoint
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Str0ng!Passw0rd"
        ports:
          - 1433:1433
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      # entra-emulator runs in-process (a go.mod dependency); fabric's SQL/TDS
      # endpoint points at the SQL Server service, then a real go-mssqldb client
      # connects with an entra token and runs DDL + DML + a GROUP BY through the
      # emulator — the FedAuth login is terminated here, the T-SQL runs on the
      # real engine. Linux-only (SQL Server is a container weight class).
      - name: Real SQL Server relay + Delta-reflection e2e
        env:
          WAREHOUSE_MSSQL_DSN: "server=localhost;user id=sa;password=Str0ng!Passw0rd;encrypt=disable"
        run: go test ./internal/server/ ./internal/api/ -run 'TestWarehouse|TestSQLDatabase|TestPipelineSQLActivities|TestRefreshMirroredDatabaseE2E' -v -count=1

