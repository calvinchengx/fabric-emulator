# CodeQL — advanced (in-repo) setup, replacing the repo's Default setup.
#
# Scoped to FIRST-PARTY code only:
#   - go                    the emulator (root module)
#   - javascript-typescript the portal + docs website
#   - actions               these workflows
#
# Deliberately NOT scanned: csharp — it exists only as external-probe harnesses
# (e2e/xmla, e2e/pbix-desktop) driving Microsoft's clients, and autobuild would
# need a restore/build of each. Python IS scanned: python/ is a first-party
# package (the notebookutils shim) that ships to users, not a test driver.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '31 7 * * 1' # weekly, Monday 07:31 UTC (parity with Default setup)

# Superseding a PR run is free money. Superseding a main run is not: a cancelled
# CodeQL job still uploads its SARIF, flagged `unsuccessful execution` with zero
# results, and that errored analysis becomes the newest one for its category —
# which is exactly what the code-scanning tool status page reports. Landing a
# burst of commits cancelled 11 of our first 43 main runs this way. So main runs
# to completion; only PR pushes cancel.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false # one language's failure must not hide the others
      matrix:
        include:
          - language: go
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Pin the Go toolchain so autobuild compiles the root module cleanly.
      # (Nested modules under e2e/ and samples/ are separate go.mod roots and are
      # excluded from the parent's `go build ./...`, so only the emulator builds.)
      - if: matrix.language == 'go'
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.11'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.6
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.37.6
        with:
          category: '/language:${{ matrix.language }}'
