# CodeQL — advanced (in-repo) setup, replacing the repo's Default setup.
#
# Scoped to FIRST-PARTY code only:
#   - go                    the emulator (root module)
#   - javascript-typescript the portal + docs website
#   - actions               these workflows
#
# Deliberately NOT scanned: csharp — it exists only as external-probe harnesses
# (e2e/xmla, e2e/pbix-desktop) driving Microsoft's clients, and autobuild would
# need a restore/build of each. Python IS scanned: python/ is a first-party
# package (the notebookutils shim) that ships to users, not a test driver.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '31 7 * * 1' # weekly, Monday 07:31 UTC (parity with Default setup)

# THE FLOOR FOR EVERY JOB HERE, as every other workflow in this repo declares.
# `analyze` carried its own block and `changes` carried none, so `changes` ran
# with whatever the repository default grants -- which CodeQL's own `actions`
# pack flagged on this very file (actions/missing-workflow-permissions). A job
# that checks out the tree and diffs it needs to read contents and nothing else.
#
# Workflow-level rather than a second job-level block, so a job added tomorrow
# inherits the floor instead of silently getting the default. `analyze` keeps
# its own block: a job-level `permissions` replaces this wholesale, and it needs
# security-events: write to upload SARIF.
permissions:
  contents: read

# Superseding a PR run is free money. Superseding a main run is not: a cancelled
# CodeQL job still uploads its SARIF, flagged `unsuccessful execution` with zero
# results, and that errored analysis becomes the newest one for its category —
# which is exactly what the code-scanning tool status page reports. Landing a
# burst of commits cancelled 11 of our first 43 main runs this way. So main runs
# to completion; only PR pushes cancel.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The same docs lane ci.yml carries. Nothing in this workflow reads the docs,
  # so every job is gated; see scripts/docs_only_change.py for what counts.
  changes:
    name: Is this change documentation only?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: python3 scripts/docs_only_change.py --self-test
      - id: classify
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if ! git rev-parse -q --verify "$BASE^{commit}" >/dev/null; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "base '$BASE' is not a commit here; running everything"
            exit 0
          fi
          git diff --name-status "$BASE...$HEAD_SHA" | python3 scripts/docs_only_change.py

  analyze:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    # This repo requires an explicit timeout on every job (see
    # scripts/check_workflow_concurrency.py): GitHub's 6-hour default makes a
    # wedged run read as 'still pending' rather than failing.
    timeout-minutes: 30
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false # one language's failure must not hide the others
      matrix:
        include:
          - language: go
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Pin the Go toolchain so autobuild compiles the root module cleanly.
      # (Nested modules under e2e/ and samples/ are separate go.mod roots and are
      # excluded from the parent's `go build ./...`, so only the emulator builds.)
      - if: matrix.language == 'go'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.7
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.37.7
        with:
          category: '/language:${{ matrix.language }}'
