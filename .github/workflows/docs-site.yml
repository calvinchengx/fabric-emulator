name: Docs site

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'website/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/docs-site.yml'
  # NOTE: we do NOT trigger on `v*` tags. The `github-pages` environment only
  # permits deployments from `main`, so a tag build would pass but its deploy
  # would be rejected ("Tag … is not allowed to deploy … environment protection
  # rules"). Instead the parity map re-stamps to the clean vX.Y.Z on the next
  # push to main after a release (the checkout below fetches tags, so
  # `git describe` sees the new tag). To publish immediately after tagging, run
  # this workflow via workflow_dispatch on main. (To restore automatic tag
  # deploys, allow the `v*` tag pattern in the github-pages environment's
  # deployment branch/tag rules, then re-add `tags: ['v*']` here.)
  # Republish after CI succeeds on main, so the coverage badges track the CODE
  # rather than the docs. Without this a change to internal/ moves the real
  # number while the published badge keeps showing the figure from whenever
  # someone last edited a markdown file — a stale number presented as current,
  # which is worse than no badge.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Allow the deploy job to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One in-flight deploy at a time; don't cancel a running publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Starlight site
    runs-on: ubuntu-latest
    # A failed CI run must not republish the site: its badge artifact is either
    # absent or from a build that did not pass, and either way the numbers
    # would not describe main. Other triggers carry no workflow_run context and
    # so pass this unconditionally.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      # Full history + tags: the parity-version generator reads the map at each
      # `v*` tag (git show) and stamps the live map from `git describe`.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter fabric-emulator-docs build

      # Coverage badges, served from this site's own origin — no third-party
      # coverage service, no upload token, no account. The numbers come from
      # the last CI run on main that produced them, because only that run had a
      # real SQL Server and therefore the only Go figure comparable with the
      # floor CI enforces. Recomputing them here would need the whole stack and
      # would still measure a different thing.
      #
      # Best-effort by design: a docs push that lands before any CI run has
      # uploaded an artifact still deploys, and coverage_badges.py writes "n/a"
      # rather than a made-up number. A badge that says n/a is honest; a docs
      # deploy blocked on a coverage artifact is not worth the coupling.
      - name: Coverage badges (from the last CI run on main)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list --workflow=ci.yml --branch=main --status=success \
                     --limit=1 --json databaseId --jq '.[0].databaseId' || true)
          if [ -n "$run_id" ] && gh run download "$run_id" -n coverage-badges -D website/dist 2>/dev/null; then
            echo "badges from CI run $run_id"
          else
            echo "::warning::no coverage-badges artifact found; publishing n/a badges"
            python3 scripts/coverage_badges.py --out website/dist
          fi
          ls -1 website/dist/*.json

      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
