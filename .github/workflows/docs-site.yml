name: Docs site

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/assemble_site.py'
      - 'scripts/check_docs_links.py'
      - 'scripts/build_landing_data.py'
      - 'scripts/coverage_badges.py'
      - 'website/published-routes.txt'
      - 'Makefile'
      - 'website/**'
      # The guard that reads the hero. Triggering on the page and not on the
      # script that checks it would leave an edit to the check with nothing
      # running it.
      - 'scripts/build_landing_data.py'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/docs-site.yml'
  # NOTE: we do NOT trigger on `v*` tags. The `github-pages` environment only
  # permits deployments from `main`, so a tag build would pass but its deploy
  # would be rejected ("Tag … is not allowed to deploy … environment protection
  # rules"). Instead the parity map re-stamps to the clean vX.Y.Z on the next
  # push to main after a release (the checkout below fetches tags, so
  # `git describe` sees the new tag). To publish immediately after tagging, run
  # this workflow via workflow_dispatch on main. (To restore automatic tag
  # deploys, allow the `v*` tag pattern in the github-pages environment's
  # deployment branch/tag rules, then re-add `tags: ['v*']` here.)
  # Republish after CI succeeds on main, so the coverage badges track the CODE
  # rather than the docs. Without this a change to internal/ moves the real
  # number while the published badge keeps showing the figure from whenever
  # someone last edited a markdown file — a stale number presented as current,
  # which is worse than no badge.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  # BUILD on a docs pull request, deploy nothing. Until now the site was first
  # built on main, so an Astro failure or a broken link in a new page was found
  # AFTER merge — and with CI's docs lane skipping 60-odd jobs, this is the one
  # check a docs PR should have. The deploy job below is gated off for PRs, and
  # the concurrency group differs (see below), so a PR build cannot touch the
  # published site or the deploy queue.
  pull_request:
    paths:
      - 'docs/**'
      - 'scripts/assemble_site.py'
      - 'scripts/check_docs_links.py'
      - 'scripts/build_landing_data.py'
      - 'scripts/coverage_badges.py'
      - 'website/published-routes.txt'
      - 'Makefile'
      - 'website/**'
      # The guard that reads the hero. Triggering on the page and not on the
      # script that checks it would leave an edit to the check with nothing
      # running it.
      - 'scripts/build_landing_data.py'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/docs-site.yml'
  workflow_dispatch:

# Allow the deploy job to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One in-flight deploy at a time; don't cancel a running publish.
#
# PR builds get their OWN group, per ref. Sharing `pages` would make a PR build
# sit in the same single-slot queue as a real deploy — and GitHub keeps one
# pending run per group, so a burst of PR builds silently drops a queued
# publish. That has happened here before; it presents as "the site just did not
# update", with every run green. A PR build supersedes itself instead, which is
# correct for a ref under development and safe because it publishes nothing.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build Starlight site
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # A failed CI run must not republish the site: its badge artifact is either
    # absent or from a build that did not pass, and either way the numbers
    # would not describe main. Other triggers carry no workflow_run context and
    # so pass this unconditionally.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      # Full history + tags: the parity-version generator reads the map at each
      # `v*` tag (git show) and stamps the live map from `git describe`.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
      # ONE STEP, AND IT IS THE ONE A DEVELOPER RUNS. `make docs-serve` builds
      # with this same target and then serves the result at the paths it
      # publishes under, so what is previewed locally is what deploys from
      # here. Spelling the sequence out in YAML instead is how the two drift:
      # the local recipe is the one nobody updates, and it is also the only one
      # anyone looks at before pushing.
      #
      # What it runs, and why each part is not redundant, is documented at the
      # target in the Makefile. In short: the doc links (the Astro build exits
      # 0 on a dangling one and publishes a 404), the Starlight build, the
      # assembler with its pre-move route oracle and its self-test, n/a
      # coverage badges the step below overwrites with the real ones, and the
      # landing page, which Astro never sees.
      - run: make docs-build

      # Coverage badges, served from this site's own origin — no third-party
      # coverage service, no upload token, no account. The numbers come from
      # the last CI run on main that produced them, because only that run had a
      # real SQL Server and therefore the only Go figure comparable with the
      # floor CI enforces. Recomputing them here would need the whole stack and
      # would still measure a different thing.
      #
      # Best-effort by design: a docs push that lands before any CI run has
      # uploaded an artifact still deploys, and coverage_badges.py writes "n/a"
      # rather than a made-up number. A badge that says n/a is honest; a docs
      # deploy blocked on a coverage artifact is not worth the coupling.
      - name: Coverage badges (from the last CI run on main)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The LAST run is not good enough any more. CI's docs lane skips
          # coverage-e2e, so a docs-only push produces a successful CI run with
          # no coverage-badges artifact — and taking only the newest would
          # replace real numbers with "n/a" every time someone fixed a typo.
          # Walk back until one actually yields the artifact.
          found=""
          for run_id in $(gh run list --workflow=ci.yml --branch=main --status=success \
                            --limit=15 --json databaseId --jq '.[].databaseId'); do
            if gh run download "$run_id" -n coverage-badges -D website/dist 2>/dev/null; then
              echo "badges from CI run $run_id"
              found=1
              break
            fi
          done
          if [ -z "$found" ]; then
            echo "::warning::no coverage-badges artifact in the last 15 successful CI runs; publishing n/a badges"
            python3 scripts/coverage_badges.py --out website/dist
          fi
          ls -1 website/dist/*.json
          # The badge documents were served from the site ROOT before the docs
          # moved under /docs/, and those URLs are baked into README badges and
          # into shields.io query strings that this repo cannot rewrite once a
          # reader has them. They are five small JSON files, so they are served
          # from BOTH places rather than breaking the old URL.
          cp website/dist/*.json _site/
          cp website/dist/*.json _site/docs/

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    # A pull request builds the site and stops there.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
