name: Make targets

# The Makefile is the documented entry point — the quickstart, the README and
# docs/26-platform-setup.md all tell users to run `make doctor` / `make up` /
# `make status` — so it needs the same cross-OS guarantee the Go tests have.
# Nothing else in CI ran a single `make` command before this workflow existed.
#
# The failures this catches are platform-specific and invisible on Linux, which
# is exactly why they survived so long:
#   * a shell script checked out with CRLF fails at the shebang — `sh` reads the
#     trailing \r as part of the interpreter path (.gitattributes pins eol=lf;
#     `sh -n` below is what proves it stayed pinned).
#   * on Windows `python3` is a Microsoft Store alias stub: on PATH, so every
#     `command -v python3` check passes, and it exits 49 when actually run.
#   * GNU Make falls back to cmd.exe when it cannot find a shell on PATH, and
#     every recipe here is POSIX shell.
#   * an unquoted or wrongly-named variable expands to nothing, or to whatever
#     the caller happened to export — `make -n` catches that without running it.
#
# Docker coverage is Linux-only by necessity, not by choice: GitHub's macOS
# runners have no Docker daemon, and the Windows runners support only Windows
# containers, so the Linux images this stack is built from cannot run there. On
# those two the container targets are checked for correct EXPANSION rather than
# execution, which still catches the variable and quoting classes of bug.

on:
  workflow_call: # called by release.yml as a release gate
  push:
    branches: [main]
  pull_request:

# Same rule as ci.yml, for the same reasons: PR refs supersede, main commits do
# not. Safe either way — these jobs only build and check, so cancelling one
# leaves nothing half-done. Kept in step with ci.yml deliberately; the two
# together are what "main is green" means, and a verdict from one of them is
# half an answer. **That coupling is now ENFORCED** by
# scripts/check_workflow_concurrency.py (run by `make check`), because this
# sentence on its own was a defect report with no owner: it named the failure
# and nothing would have caught the drift.
#
# The RELEASE GATE still cannot be cancelled, but by a different mechanism than
# before. release.yml triggers on a tag push and calls this workflow, so the
# called run also sees `event_name == 'push'` and groups by sha — and a tag
# normally points at a commit already on main, so the gate and that commit's
# main run share ONE group rather than being separated by ref. What protects it
# now is `cancel-in-progress: false`: the second run waits for the first instead
# of killing it, and both finish. Under the old ref-based group they were
# separate; under this one they queue. Either way the gate completes.
concurrency:
  group: make-targets-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read

jobs:
  # The same docs lane ci.yml carries. Nothing in this workflow reads the docs,
  # so every job is gated; see scripts/docs_only_change.py for what counts.
  changes:
    name: Is this change documentation only?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: python3 scripts/docs_only_change.py --self-test
      - id: classify
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if ! git rev-parse -q --verify "$BASE^{commit}" >/dev/null; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "base '$BASE' is not a commit here; running everything"
            exit 0
          fi
          git diff --name-status "$BASE...$HEAD_SHA" | python3 scripts/docs_only_change.py

  make-targets:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    name: make targets (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # macOS ships GNU Make 3.81 with the Xcode CLT and Linux ships it as
      # standard; only Windows needs one installed. Users get the same binary
      # via `winget install ezwinports.make` (docs/26). CI must not ask
      # Chocolatey's community *index* for a package named `make`: that search
      # has returned "package not found" while the nupkg was still on the
      # feed, which failed this job before any Makefile ran. The versioned
      # nupkg URL is the ezwinports 4.4.1 zip Chocolatey already vendors —
      # pin the bytes, not the name.
      - name: Install GNU Make (Windows only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '4.4.1'
          $sha256 = '8b2dec73ed4c84163c4a4f9bfe658553b1e3d1fdfa8930d2aa438e030ff21f9d'
          $url = "https://community.chocolatey.org/api/v2/package/make/$version"
          $nupkg = Join-Path $env:RUNNER_TEMP "make.$version.nupkg"
          $dest = Join-Path $env:RUNNER_TEMP "ezwinports-make"
          curl.exe -fsSL --retry 5 --retry-delay 2 -o $nupkg $url
          $got = (Get-FileHash -Path $nupkg -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $sha256) {
            throw "make nupkg checksum mismatch: got $got want $sha256"
          }
          $zip = Join-Path $env:RUNNER_TEMP "make.$version.zip"
          Copy-Item $nupkg $zip
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          $bin = Join-Path $dest 'tools\install\bin'
          if (-not (Test-Path (Join-Path $bin 'make.exe'))) {
            throw "make.exe missing from nupkg at $bin"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $bin

      # Deliberately the runner's DEFAULT shell — PowerShell on Windows. This is
      # the one step that reproduces how a Windows user actually invokes make,
      # and it fails if Make cannot find sh.exe or the grep/awk the recipe uses.
      # One command per step so its exit code is the step's exit code: under
      # pwsh only the LAST command's status is checked.
      - name: make help (from the platform's native shell)
        run: make help

      - name: Makefile and scripts are POSIX-clean
        shell: bash
        run: |
          set -euo pipefail
          # Syntax-only, with the interpreter each script's shebang actually
          # declares: `sh -n` on a #!/usr/bin/env bash script would reject
          # legitimate bashisms, and `bash -n` on a #!/bin/sh script would let
          # real ones through. This is what catches a CRLF checkout — dash and
          # bash both reject a brace followed by a carriage return — and
          # any bashism creeping into an sh script.
          for f in scripts/*.sh; do
            case "$(head -1 "$f")" in
              *bash) echo "bash -n $f"; bash -n "$f" ;;
              *)     echo "sh -n   $f"; sh -n "$f" ;;
            esac
          done

      - name: Every target expands
        shell: bash
        run: |
          set -euo pipefail
          # -n prints the recipe without running it, so this exercises variable
          # expansion, quoting and the shell selection on every platform —
          # including the docker targets that cannot execute off Linux.
          #
          # DERIVED from .PHONY rather than listed here. This used to be a
          # hard-coded list with a comment asking the next person to keep it in
          # step, and it drifted twice in one day — `up-jupyter` and `lint` were
          # each added to .PHONY and not here, so each shipped as a target
          # nobody expands, which is a target nobody notices breaking. A comment
          # is not a mechanism.
          #
          # .PHONY is the right source: it is where this Makefile already
          # declares its user-facing targets, and a target deliberately kept out
          # of it (portal-types, which needs Node and an installed portal) is
          # thereby excluded here too, which is the behaviour that list had.
          targets=$(awk '/^\.PHONY:/{sub(/^\.PHONY:[[:space:]]*/,""); s=$0
                           while (s ~ /\\$/) { sub(/\\[[:space:]]*$/,"",s); if ((getline nx) <= 0) break; s = s " " nx }
                           print s}' Makefile | tr -s ' \t' '\n' | grep -v '^$' || true)
          n=$(printf '%s\n' "$targets" | grep -c . || true)
          echo "expanding $n targets derived from .PHONY: $(echo $targets)"
          # A floor, not a specification. If .PHONY is renamed, reformatted or
          # the parse otherwise breaks, this loop would expand nothing at all
          # and the job would pass green having checked NOTHING — the same
          # silent-skip failure the derivation exists to remove. The number is
          # deliberately well below the real count so it never needs editing
          # when a target is added or removed.
          if [ "$n" -lt 10 ]; then
            echo "::error::parsed only $n targets from .PHONY — the derivation is broken, not the Makefile"
            exit 1
          fi
          for t in $targets; do
            echo "=== make -n $t ==="
            make -n "$t"
          done
          # The documented overrides must expand too.
          make -n logs SVC=fabric-emulator
          make -n up PROFILE=

      - name: make test
        shell: bash
        run: make test

      # The real thing, where a Linux container runtime exists.
      - name: make doctor
        if: runner.os == 'Linux'
        run: make doctor

      - name: make up / status / down
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          # The lean stack: the governance profile pulls OpenMetadata and
          # Elasticsearch (~1 GB heap), which a CI runner should not pay for
          # just to prove the targets work. status.sh skips the OpenMetadata
          # probe when that profile is absent, so this is a clean pass rather
          # than a tolerated failure.
          make up PROFILE=
          make status
          make down PROFILE=

      # Not `make logs`: that target follows (-f) and would hang the job.
      - name: Container logs on failure
        if: failure() && runner.os == 'Linux'
        run: docker compose logs --no-color --tail 200 || true
