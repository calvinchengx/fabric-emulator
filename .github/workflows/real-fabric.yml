name: Real Fabric conformance

# T1 of the real-Fabric toggle (docs/21): the SAME conformance suite CI runs
# against the emulator on every push (e2e/fabric-target) runs here against
# REAL Microsoft Fabric — FABRIC_TARGET is the only difference. Divergences
# found here are parity-map material: this workflow is the fidelity oracle.
#
# Opt-in by secrets. WITHOUT THEM THE CONFORMANCE JOB IS SKIPPED, not failed:
# an unwired oracle is a missing measurement, and a missing measurement should
# not stop a release from shipping. This reverses an earlier decision to fail
# closed; the reasoning that motivated it is preserved on the gate below,
# because the risk it names is real and has not gone away.
#
# WHAT DOES NOT CHANGE: a skipped run is not evidence. No parity claim may
# cite this workflow until the secrets are set and a conformance job has
# actually COMPLETED. `skipped` is a distinct conclusion from `success` at
# every level that reads one, which is why the gate is still its own job.
#
# TWO WAYS TO AUTHENTICATE. The gate picks whichever is configured:
#
#   OIDC (preferred) — AZURE_CLIENT_ID + AZURE_TENANT_ID, and NO secret stored
#     anywhere. Needs a federated credential on the app registration whose
#     subject matches this repository; `azure/login` then exchanges the run's
#     id-token for an Entra token, leaving an az session that
#     DefaultAzureCredential picks up like any developer's. Neither id is
#     itself secret — both are public in any OIDC discovery document — they
#     live in `secrets` because that is the only place a workflow can read
#     per-repository configuration from.
#   Client secret — the same two plus AZURE_CLIENT_SECRET. Still required by
#     anything that puts a principal in a request BODY rather than using it to
#     authenticate: an AzureKeyVault connection accepts only OAuth2 or
#     ServicePrincipal, so those credentials travel as data and a token cannot
#     substitute.
#
# Required repository secrets:
#   FABRIC_TEST_WORKSPACE
#     — display name of a DEDICATED throwaway workspace (the suite creates
#       and deletes its own items inside it; nothing else is touched)
#   FABRIC_CAPACITY_ID (only for the example-provisioning step, which creates a
#     workspace) — a Fabric F-SKU capacity id. NOT a trial capacity: only the
#     account that started a trial can assign a workspace to it, so a service
#     principal cannot. Run the trial path from a developer machine with
#     `az login` instead (docs/46-artifact-persistence.md).
#
# WHAT THIS WORKFLOW STRUCTURALLY CANNOT COVER. Both modes authenticate as a
# SERVICE PRINCIPAL, and Fabric treats one differently from a signed-in user in
# at least two ways: an SP needs the tenant setting "Service principals can use
# Fabric APIs", and an SP cannot assign a workspace to a TRIAL capacity at all.
# So CI is the regression signal, not the only way to obtain a real-service
# witness — and on a trial tenant it is the weaker of the two.
#
# THE CONFORMANCE SUITE NEEDS NO SECRETS ON A DEVELOPER MACHINE. `az login`
# alone satisfies DefaultAzureCredential, which is what fabric_target builds in
# real mode; the AZURE_* variables below are one of its sources, not a
# requirement. Measured 2026-08-17 — 12 passed in 2m25s:
#
#   FABRIC_TARGET=real FABRIC_WORKSPACE=<workspace> \
#     uv run --frozen --group fabric-target pytest -m target python/fabric-target/conformance

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      capture_item_type:
        description: >-
          Capture an item definition's SHAPE (types and keys, never values).
          Typed collection segment, e.g. dataPipelines. Leave blank to skip.
        required: false
        default: ''
      capture_item_name:
        description: Display name of the item to capture. Required if a type is given.
        required: false
        default: ''
  schedule:
    - cron: '17 5 * * 1' # weekly, Monday 05:17 UTC

# Least privilege for every job in this file. Without it each job inherits the
# repository default, which is write on many repos — 51 CodeQL alerts' worth of
# ambient authority for workflows that only ever read the checkout. A job that
# genuinely needs more should declare it at the job level, so the elevation is
# visible where it is used.
permissions:
  contents: read

jobs:
  # THE GATE IS ITS OWN JOB so the conformance job can be SKIPPED rather than
  # succeed having done nothing.
  #
  # Measured 2026-08-11: both scheduled runs of this workflow (2026-08-03 and
  # 2026-08-10) reported **success** while every real step was skipped for
  # missing secrets. The only steps that executed were checkout, the toolchain
  # setup, and the secret check itself. So the differential leg — the one thing
  # that can catch an emulator-vs-tenant divergence automatically — was green,
  # weekly, having never run. No parity claim cites this workflow until the
  # secrets are set and a conformance job has actually completed.
  #
  # A skipped job is visibly not a passing one; a succeeded job full of skipped
  # steps is indistinguishable from a real pass at every level that reads a
  # conclusion. That distinction is the whole reason the gate is a separate
  # job: it lets `conformance` be SKIPPED rather than succeed having done
  # nothing, which is what makes skipping safe to report at all. `secrets` is
  # not available in a job-level `if`, which is why it cannot be a condition
  # on the job below.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
      mode: ${{ steps.check.outputs.mode }}
    steps:
      # ONLY BOOLEANS CROSS INTO THE ENVIRONMENT HERE, never the secret values
      # themselves: this job needs to know whether each is set and nothing more,
      # and a value that is never materialised cannot be printed by a `set -x`,
      # a stack trace or a future step somebody adds below.
      #
      # IT TESTS EVERY SECRET IT DEPENDS ON, which the previous condition did
      # not: keyed on AZURE_CLIENT_SECRET and FABRIC_TEST_WORKSPACE alone, a
      # missing AZURE_TENANT_ID or AZURE_CLIENT_ID let the job RUN and fail
      # obscurely several minutes later instead of skipping. A gate that checks
      # a subset of its inputs reports on the subset, not on the thing.
      #
      # AND IT NO LONGER REQUIRES A SECRET TO EXIST. Keying on
      # AZURE_CLIENT_SECRET made the secretless path unreachable by
      # construction: a correctly configured OIDC setup, which by design has no
      # client secret, was indistinguishable from "not configured" and skipped.
      - name: Check credentials are configured
        id: check
        env:
          HAVE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID != '' }}
          HAVE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID != '' }}
          HAVE_WORKSPACE: ${{ secrets.FABRIC_TEST_WORKSPACE != '' }}
          HAVE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET != '' }}
        run: |
          set -euo pipefail
          missing=""
          [ "$HAVE_CLIENT_ID" = "true" ] || missing="$missing AZURE_CLIENT_ID"
          [ "$HAVE_TENANT_ID" = "true" ] || missing="$missing AZURE_TENANT_ID"
          [ "$HAVE_WORKSPACE" = "true" ] || missing="$missing FABRIC_TEST_WORKSPACE"
          if [ -n "$missing" ]; then
            # SKIP, do not fail. `conformance` is left unrun and therefore
            # visibly `skipped`, which no reader can mistake for a pass.
            #
            # THE RISK THIS ACCEPTS, STATED PLAINLY so nobody has to rediscover
            # it: release.yml makes every publishing job
            # `needs: fabric-qualification`, so from here a tag SHIPS while the
            # oracle is unwired. A release that ships this way has not been
            # compared against Fabric at all. That was the argument for failing
            # closed, and it is why the warning and the run summary below are
            # not decoration: they are the only remaining record, on the
            # release run itself, that nothing was qualified.
            #
            # Two scheduled runs (2026-08-03, 2026-08-10) reported SUCCESS with
            # every real step skipped. That specific shape cannot return: the
            # gate no longer succeeds silently, and the job that would carry a
            # false green is skipped rather than green.
            # NOT CONFIGURED and HALF CONFIGURED are different situations and
            # get different words. Nothing set is the expected state of a fork
            # or a repo whose owner has not wired a tenant. SOME set is almost
            # always a mistake — a typo in a secret name, or a rotation that
            # dropped one — and it would otherwise read as the untouched case
            # and be skipped past forever.
            if [ "$HAVE_CLIENT_ID" = "false" ] && [ "$HAVE_TENANT_ID" = "false" ] \
               && [ "$HAVE_WORKSPACE" = "false" ]; then
              why="not configured"
            else
              why="PARTIALLY configured, which is usually a mistake"
            fi
            echo "::warning::real-Fabric conformance SKIPPED — credentials $why; missing:$missing. Nothing in this run has been compared against Fabric."
            {
              echo "### Real Fabric conformance: skipped ($why)"
              echo
              echo "**Nothing here was compared against Microsoft Fabric.** The tenant"
              echo "oracle is unwired, so any release from this run is unqualified."
              echo
              echo "Missing repository secrets:$missing"
              echo
              echo "| secret | what it is |"
              echo "| --- | --- |"
              echo "| \`AZURE_CLIENT_ID\` | app registration id (public, not a secret value) |"
              echo "| \`AZURE_TENANT_ID\` | directory id (public) |"
              echo "| \`FABRIC_TEST_WORKSPACE\` | display name of a DEDICATED throwaway workspace |"
              echo
              echo "OIDC needs no client secret; see the header of"
              echo "\`.github/workflows/real-fabric.yml\` for the federated-credential setup."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "mode=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$HAVE_CLIENT_SECRET" = "true" ]; then
            mode=secret
          else
            mode=oidc
          fi
          echo "::notice::real-Fabric credentials configured; authenticating via $mode"
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

  conformance:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # A JOB-LEVEL `permissions:` REPLACES the file-level default rather than
    # adding to it, so `contents: read` has to be restated here or the checkout
    # loses it. `id-token: write` is what lets the runner mint the OIDC token
    # azure/login exchanges; it grants nothing else, and no other job in this
    # file gets it.
    permissions:
      contents: read
      id-token: write
    # HOISTED FROM THE FOUR STEPS BELOW, which each repeated the same three
    # variables. That repetition is how AZURE_TENANT_ID came to be set on every
    # step while the gate never checked it was set at all: four copies look like
    # thoroughness and make the single missing check harder to see.
    #
    # In OIDC mode AZURE_CLIENT_SECRET expands to the empty string. That is the
    # correct value, not a degraded one: `Target.service_principal` requires all
    # three to be non-empty and returns None otherwise, so a step that needs a
    # principal as DATA (an AzureKeyVault connection body) refuses by name
    # instead of sending a half-built credential to the tenant.
    env:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.32"
      # OIDC MODE ONLY, and it is deliberately the only step that differs
      # between the two modes. It leaves an `az` session behind; nothing reads
      # its outputs. DefaultAzureCredential then resolves through
      # AzureCliCredential — the SAME source a developer's `az login` provides,
      # so the credential path CI exercises is the one a reader would use
      # rather than a CI-only special case.
      #
      # allow-no-subscriptions: the Fabric API is not an ARM resource provider
      # and this principal needs no subscription. Without the flag azure/login
      # fails when the tenant has none it can see.
      - name: Azure login (federated)
        if: needs.gate.outputs.mode == 'oidc'
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Conformance against real Fabric
        env:
          FABRIC_TARGET: real
          FABRIC_WORKSPACE: ${{ secrets.FABRIC_TEST_WORKSPACE }}
        run: uv run --frozen --group fabric-target pytest -m target -v python/fabric-target/conformance
      - name: Representative notebook against real Fabric
        env:
          FABRIC_TEST_WORKSPACE: ${{ secrets.FABRIC_TEST_WORKSPACE }}
        run: uv run --frozen --group fabric-target python e2e/notebook-run/real_fabric.py
      # THE ENGINE PROBES, ON FABRIC'S OWN SPARK. docs/engine-matrix.md compares
      # Sail against upstream Apache Spark, which is not Fabric's distribution,
      # so nothing in this repository has ever compared an engine capability
      # against the thing being emulated. This runs the same probes.py inside a
      # published notebook and writes out/fabric.json — the only way that
      # column can ever hold a measurement rather than a dash.
      #
      # The emulator leg of the same script runs on every push (CI job
      # `engine-probes-notebook`), so the mechanism is exercised even while
      # this one cannot run.
      - name: Engine probes on Fabric's Spark
        env:
          FABRIC_TARGET: real
          FABRIC_WORKSPACE: ${{ secrets.FABRIC_TEST_WORKSPACE }}
        run: uv run --frozen --group fabric-target python e2e/engine-matrix/tenant.py
      # THE EXAMPLE'S OWN CODE against real Fabric — the other half of T3 in
      # e2e/fabric-target/run.py, which runs this same step with
      # FABRIC_TARGET=emulator. Until both legs existed, "the same code runs
      # against real Fabric" was true of the conformance suite and unproven of
      # anything a reader would actually copy: the four medallion examples
      # hardcoded the seeded principal, so the toggle never reached them.
      #
      # provision.py only touches the control plane, so it needs no Spark, SQL
      # Server or vault — the whole resolver path with none of the sidecars.
      - name: An example's own provisioning against real Fabric
        working-directory: examples/medallion-pyspark
        env:
          FABRIC_TARGET: real
          FABRIC_WORKSPACE: ${{ secrets.FABRIC_TEST_WORKSPACE }}
          WORKSPACE_NAME: ${{ secrets.FABRIC_TEST_WORKSPACE }}
          # A workspace created with no capacity accepts the create and then
          # rejects every item in it, so the resolver refuses without this rather
          # than failing one call later. Note a TRIAL capacity cannot be assigned
          # by a service principal — only by the account that started the trial —
          # so this secret must name a real Fabric (F SKU) capacity for CI.
          FABRIC_CAPACITY_ID: ${{ secrets.FABRIC_CAPACITY_ID }}
        run: uv run --frozen python provision.py
      # Oracle capture, on demand only. Several activities are blocked on one
      # thing — nobody has captured the wire `type` and `typeProperties` shape
      # Fabric actually sends — and this turns that capture into a button.
      #
      # IT PRINTS A SHAPE, NOT A DEFINITION, and that is not caution for its own
      # sake: THIS REPOSITORY IS PUBLIC, so these logs are too. A raw definition
      # carries workspace and item GUIDs, connection and dataset names, URLs,
      # paths, SQL and parameter defaults — none of which the emulator needs and
      # all of which printing here would publish permanently. Keys and `type`
      # discriminators are what the oracle is made of; everything else is
      # replaced by its JSON type. See scripts/capture_definition_shape.py.
      - name: Capture an item definition's shape (workflow_dispatch only)
        if: inputs.capture_item_type != ''
        env:
          FABRIC_TEST_WORKSPACE: ${{ secrets.FABRIC_TEST_WORKSPACE }}
        run: |
          if [ -z "${{ inputs.capture_item_name }}" ]; then
            echo "::error::capture_item_name is required when capture_item_type is set"
            exit 1
          fi
          uv run --no-project python scripts/capture_definition_shape.py \
            --type "${{ inputs.capture_item_type }}" \
            --name "${{ inputs.capture_item_name }}"
