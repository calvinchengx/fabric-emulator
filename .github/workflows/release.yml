name: Release

on:
  push:
    tags: ['v*']
  # Manual re-run, whose only job is to publish the winget manifest for a tag
  # that has already shipped. Dispatch it with --ref set to that tag:
  #
  #   gh workflow run Release --ref v0.11.0 -f publish_winget=true
  #
  # Everything else re-runs idempotently (release.replace_existing_artifacts).
  workflow_dispatch:
    inputs:
      publish_winget:
        description: 'Submit the winget manifest PR for this ref'
        type: boolean
        default: false

permissions:
  contents: write # create the GitHub Release
  packages: write # push the image to GHCR

jobs:
  # Gate: the Makefile is what users are told to run, on all three platforms.
  # A release that publishes binaries whose documented entry point is broken on
  # Windows or macOS is worse than a late release.
  make-targets:
    uses: ./.github/workflows/make-targets.yml

  fabric-qualification:
    uses: ./.github/workflows/real-fabric.yml
    # `id-token: write` because real-fabric authenticates by OIDC now (#296),
    # and a CALLED workflow cannot request more than its caller grants. Without
    # it GitHub refuses the whole run before any job starts, with a
    # `startup_failure` and no job to read a log from. v0.28.0's first tag hit
    # exactly that: #296 landed after v0.27.0, so this was the first release to
    # call the OIDC version and the failure appeared at the tag rather than on
    # any pull request.
    #
    # HERE AND NOT AT THE TOP OF THE FILE, so the jobs that push images and
    # create the release do not also get the ability to mint identity tokens.
    # `contents: read` is restated because a job-level block REPLACES the
    # file-level default rather than adding to it.
    permissions:
      contents: read
      id-token: write
    secrets: inherit

  binaries:
    name: Cross-platform binaries (GoReleaser)
    needs: [fabric-qualification, make-targets]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # GoReleaser needs full history/tags
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Write access to calvinchengx/homebrew-tap so GoReleaser can commit
          # the cask. Optional: if the secret is unset the homebrew_casks step
          # self-skips (skip_upload) instead of failing the release.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          # Write access to a calvinchengx/winget-pkgs fork so GoReleaser can
          # open the manifest PR against microsoft/winget-pkgs. Optional: if the
          # secret is unset the winget step self-skips (skip_upload).
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          # Off for tag pushes, so a day of tagging doesn't queue a day of
          # manifest PRs behind winget's multi-day moderation. See the comment
          # on skip_upload in .goreleaser.yaml.
          PUBLISH_WINGET: ${{ inputs.publish_winget || false }}

  image:
    name: Docker image → GHCR
    needs: [fabric-qualification, make-targets]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # The consumer contract, executed before anything is pushed.
  #
  # This is the gate that was missing. The agent is published HERE and consumed
  # by databricks-emulator, and a break in the path only IT exercises shipped in
  # four releases with this repo's suite green throughout: fabric-emulator's
  # witnesses address Delta by path, the consumer addresses it by name, and the
  # broken code was reachable only by name.
  #
  # It runs the by-name shapes against the agent built from the very Dockerfile
  # the next job publishes, so a regression fails in the repo that would SHIP it
  # rather than the repo that would suffer it. It also covers the class the unit
  # contract cannot see at all: `createDataFrame` against a live engine, which
  # is where the `'3GB'` conf assumption died without any shape being wrong.
  agent-contract:
    name: Consumer SQL shapes execute on the built agent
    needs: [fabric-qualification, make-targets]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
      - run: uv run --frozen --no-sync python e2e/agent-contract/run.py

  # The compute sidecars ship as images too, so a consumer can PIN them instead of
  # rebuilding from a source tree. Without this, `EMULATOR_VERSION=x.y.z` pinned
  # the emulator but left sail and the statement agent built from whatever the
  # local checkout happened to be — the two components that decide how Spark
  # actually behaves.
  #
  # `needs: agent-contract` is the pre-publish gate: a tag that fails the
  # consumer contract must not reach GHCR, because once it does the only thing
  # standing between it and a consumer is that consumer's own upgrade.
  compute-images:
    name: Compute sidecar images → GHCR
    needs: [fabric-qualification, make-targets, agent-contract]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        include:
          - name: sail
            dockerfile: docker/sail/Dockerfile
            build_args: ""
          # Its own Dockerfile, not the shared python runtime. That one ships
          # dependencies and no agent — the code arrived by bind mount, which
          # a consumer pulling this tag does not have.
          - name: spark-agent
            dockerfile: docker/spark-agent/Dockerfile
            build_args: ""
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The dependency version this image is tagged with, read from the pins
      # so a pysail bump cannot publish a tag naming the version it no longer
      # contains. See scripts/image_tags.py.
      - name: Dependency version for the tag
        id: dep
        run: echo "version=$(python3 scripts/image_tags.py ${{ matrix.name }})" >> "$GITHUB_OUTPUT"
      # Two names during the rename. The new name says what a consumer pins the
      # image FOR; the old one keeps every existing reference resolving until
      # they have moved. The old name keeps its release-version tag, because
      # that is what those references already pin.
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/emulator-${{ matrix.name }}
            ghcr.io/${{ github.repository }}-${{ matrix.name }}
          tags: |
            type=raw,value=${{ steps.dep.outputs.version }},enable=true
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: ${{ matrix.build_args }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # The wheels the standalone acceptance repo installs: the fixture generators
  # and `fabric-target`.
  #
  # `contoso-fabric-platform` runs this medallion against the RELEASED image, and
  # its assertions must be the same numbers the in-tree examples assert. One
  # generator, published, is what makes that guarantee structural rather than
  # hopeful — two copies differing by a single RNG draw would each pass their
  # own EXPECTED_* asserts while describing different datasets.
  #
  # `fabric-target` ships for the same reason one level up: it is the
  # emulator-or-real contract itself, and while it was unpublished the consumer
  # could only restate it — which it did, incorrectly, dropping the
  # `DefaultAzureCredential` branch so its real target demanded a client secret.
  #
  # `needs: binaries` because GoReleaser creates the Release; uploading to it
  # before it exists 404s. `--clobber` mirrors release.replace_existing_artifacts
  # in .goreleaser.yaml, so re-running a published tag is safe.
  fixtures:
    name: Published wheels → the release
    needs: binaries
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
      # Builds at the tag's version and PROVES the wheels: installs both into a
      # clean venv outside the tree and asserts the generators' constants from
      # site-packages. A wheel missing a module imports fine from a checkout and
      # fails only for the consumer, which is the wrong place to find out.
      - run: python scripts/build_fixture_wheels.py
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
      - run: gh release upload "${{ github.ref_name }}" dist/fixtures/*.whl --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Tell the acceptance repo a release shipped, so it verifies THIS release.
  #
  # `needs: fixtures` and not merely `binaries`: the downstream run installs the
  # wheels as its first step, so dispatching before they are uploaded starts a
  # run that fails on a missing asset — and reports it as the platform being
  # broken rather than as a race in this workflow.
  #
  # `image` and `compute-images` for exactly the same reason, one step later.
  # The wheels are not the only thing the downstream run consumes: its
  # `set_release.py` repins FABRIC_EMULATOR_VERSION, SAIL_VERSION *and*
  # SPARK_AGENT_VERSION to the dispatched version, then composes a stack that
  # pulls all three tags. Waiting only on the wheels announces a release whose
  # images may not exist yet.
  #
  # MEASURED on v0.27.0, which is why this is not a hypothetical ordering
  # tidy-up. dispatch fired at 14:36:17; the spark-agent image finished pushing
  # at 14:44:03 — the downstream repo was told to verify a
  # `fabric-emulator-spark-agent:0.27.0` that did not exist for another 7m46s.
  # compute-images is reliably last: it builds linux/arm64 under QEMU, so it
  # outlives `fixtures` by minutes on every release, and this race is the
  # normal case rather than an unlucky one.
  #
  # A PAT, because `secrets.GITHUB_TOKEN` is scoped to THIS repository and
  # cannot dispatch into another one. The failure mode if it is missing or
  # expired is silence, which is why the acceptance workflow also runs on a
  # daily schedule — see its own comment.
  dispatch:
    name: Tell contoso-fabric-platform to verify this release
    needs: [fixtures, image, compute-images]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Fire repository_dispatch
        env:
          GH_TOKEN: ${{ secrets.ACCEPTANCE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::ACCEPTANCE_DISPATCH_TOKEN is not set — the release " \
                 "shipped but nothing downstream was told. Add a PAT with " \
                 "'contents: write' on calvinchengx/contoso-fabric-platform."
            exit 1
          fi
          # The version travels WITH the event. Without it the downstream repo
          # would verify whatever its own versions.env pins — quite possibly
          # the previous release — and report success for a release nobody
          # tested.
          version="${GITHUB_REF_NAME#v}"
          gh api repos/calvinchengx/contoso-fabric-platform/dispatches \
            -f event_type=fabric-emulator-release \
            -F "client_payload[version]=$version" \
            -F "client_payload[tag]=${GITHUB_REF_NAME}"
          echo "dispatched fabric-emulator-release for $version"
