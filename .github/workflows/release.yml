name: Release

on:
  push:
    tags: ['v*']
  # Manual re-run, whose only job is to publish the winget manifest for a tag
  # that has already shipped. Dispatch it with --ref set to that tag:
  #
  #   gh workflow run Release --ref v0.11.0 -f publish_winget=true
  #
  # Everything else re-runs idempotently (release.replace_existing_artifacts).
  workflow_dispatch:
    inputs:
      publish_winget:
        description: 'Submit the winget manifest PR for this ref'
        type: boolean
        default: false

permissions:
  contents: write # create the GitHub Release
  packages: write # push the image to GHCR

jobs:
  # Gate: the Makefile is what users are told to run, on all three platforms.
  # A release that publishes binaries whose documented entry point is broken on
  # Windows or macOS is worse than a late release.
  make-targets:
    uses: ./.github/workflows/make-targets.yml

  fabric-qualification:
    uses: ./.github/workflows/real-fabric.yml
    secrets: inherit

  binaries:
    name: Cross-platform binaries (GoReleaser)
    needs: [fabric-qualification, make-targets]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # GoReleaser needs full history/tags
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Write access to calvinchengx/homebrew-tap so GoReleaser can commit
          # the cask. Optional: if the secret is unset the homebrew_casks step
          # self-skips (skip_upload) instead of failing the release.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          # Write access to a calvinchengx/winget-pkgs fork so GoReleaser can
          # open the manifest PR against microsoft/winget-pkgs. Optional: if the
          # secret is unset the winget step self-skips (skip_upload).
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          # Off for tag pushes, so a day of tagging doesn't queue a day of
          # manifest PRs behind winget's multi-day moderation. See the comment
          # on skip_upload in .goreleaser.yaml.
          PUBLISH_WINGET: ${{ inputs.publish_winget || false }}

  image:
    name: Docker image → GHCR
    needs: [fabric-qualification, make-targets]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # The compute sidecars ship as images too, so a consumer can PIN them instead of
  # rebuilding from a source tree. Without this, `EMULATOR_VERSION=x.y.z` pinned
  # the emulator but left sail and the statement agent built from whatever the
  # local checkout happened to be — the two components that decide how Spark
  # actually behaves.
  compute-images:
    name: Compute sidecar images → GHCR
    needs: [fabric-qualification, make-targets]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: sail
            dockerfile: docker/sail/Dockerfile
            build_args: ""
          - name: spark-agent
            dockerfile: docker/python-runtime/Dockerfile
            build_args: UV_GROUP=sail-delta
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: ${{ matrix.build_args }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
