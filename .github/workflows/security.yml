# Secret scanning and vulnerability scanning.
#
# Neither existed anywhere in the emulator family before this workflow. The
# gap that prompted it: govulncheck reported standard-library vulnerabilities
# in every Go repo, 6 to 25 each, all of them fixed by moving off Go 1.25. A
# scanner nobody runs is a scanner that finds nothing.
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Vulnerabilities are published against code that has not changed, so this
    # cannot only run on push: a repo that is finished still needs watching.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    # A wedged run must fail rather than sit in GitHub's 6-hour default,
    # where 'pending' and 'stuck' look identical.
    timeout-minutes: 15
    steps:
      # Full history: a secret that was committed and then removed is still in
      # the pack, still cloneable, and still leaked. Scanning only the tip
      # would report clean on exactly the case that matters most.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.0
        run: |
          curl -fsSL -o /tmp/gl.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gl.tgz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan the working tree
        run: gitleaks dir . --config .gitleaks.toml --no-banner --redact --verbose

      - name: Scan the history
      # --verbose here too, and it is not noise: without it a failing scan
      # logs "leaks found: 3" and nothing else, so the one job whose whole
      # output is "which line" names no line. --redact still masks the value.
        run: gitleaks git . --config .gitleaks.toml --no-banner --redact --verbose

  vulnerabilities:
    name: govulncheck
    runs-on: ubuntu-latest
    # A wedged run must fail rather than sit in GitHub's 6-hour default,
    # where 'pending' and 'stuck' look identical.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # Reports only vulnerabilities the code can actually REACH, so a finding
      # here is a call path rather than a dependency-tree coincidence.
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # PYTHON AND npm HAD NO ADVISORY SCAN AT ALL. SECURITY.md listed that under
  # "what does not run" as an honest known gap: Go had govulncheck and the
  # other two ecosystems had Dependabot alerts alone. Python is this
  # repository's largest dependency surface -- nine tracked uv.lock files, 856
  # locked packages, seven of them the example lockfiles people copy out of
  # here -- and a grep for pip-audit/osv-scanner/pnpm audit/trivy across these
  # workflows, the Makefile and pyproject.toml returned nothing.
  #
  # Two jobs rather than one, over a tool that handles both ecosystems: a red
  # job then names WHICH surface broke without anyone opening the log, and
  # check_dependency_risk.py's fourth invariant can line each ecosystem up
  # against the job that scans it.
  #
  # INPUTS ARE DISCOVERED FROM `git ls-files`, never listed here. A
  # hand-maintained path list is the exact failure check_dependency_risk.py
  # exists to prevent -- seven example lockfiles watched by nothing -- and
  # discovery means a new example is scanned by code already in the tree. That
  # is enforced, not merely intended: the fourth invariant fails this file if
  # either job grows a literal lockfile path.
  python-advisories:
    name: Python advisories (9 uv.lock files)
    runs-on: ubuntu-latest
    # A wedged run must fail rather than sit in GitHub's 6-hour default,
    # where 'pending' and 'stuck' look identical.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: ./.github/actions/osv-scanner
      - run: python3 scripts/check_advisories.py --ecosystem uv

  js-advisories:
    name: JavaScript advisories (pnpm workspace)
    runs-on: ubuntu-latest
    # A wedged run must fail rather than sit in GitHub's 6-hour default,
    # where 'pending' and 'stuck' look identical.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: ./.github/actions/osv-scanner
      # No pnpm or node setup step, deliberately: osv-scanner reads
      # pnpm-lock.yaml as a file. `pnpm audit` would need an install first,
      # and installing to find out what is already pinned would make the scan
      # depend on a resolution step that can itself fail.
      - run: python3 scripts/check_advisories.py --ecosystem npm

  # A DISMISSED ALERT NEVER COMES BACK. Dependabot 56 was dismissed as
  # tolerable risk because the MLflow advisory had no fixed release -- true
  # when it was written and only until upstream ships one. Nothing in GitHub
  # re-raises it then, so the dismissal quietly becomes permanent on the
  # strength of a temporary fact.
  #
  # Here rather than in a cron-only workflow of its own: this file already
  # runs on push, pull_request, a weekly cron and dispatch, so the question
  # gets asked on every change as well as on a schedule. Its own header states
  # the rule -- a scanner nobody runs is a scanner that finds nothing.
  dismissed-advisories:
    name: Dismissed advisories are still unfixed upstream
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python3 scripts/check_dismissed_advisories.py
        env:
          # The endpoint is public; the token only lifts the 60/hour
          # unauthenticated rate limit that a busy runner IP can hit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
