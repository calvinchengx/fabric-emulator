name: JVM Spark compatibility

on:
  workflow_dispatch:
  schedule:
    - cron: '41 4 * * 2' # weekly, Tuesday 04:41 UTC

jobs:
  spark-jvm:
    name: Fabric Runtime 1.3-aligned Spark 3.5 compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - run: python3 e2e/spark-jvm/run.py

  notebook-jvm:
    name: Representative notebook on Spark 3.5
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - run: python3 e2e/notebook-run/run-jvm.py
