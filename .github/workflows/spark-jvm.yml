name: JVM Spark compatibility

on:
  workflow_dispatch:
  schedule:
    - cron: '41 4 * * 2' # weekly, Tuesday 04:41 UTC

jobs:
  spark-jvm:
    name: Fabric Runtime 1.3-aligned Spark 3.5 compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
      - run: uv run --frozen --no-sync python e2e/spark-jvm/run.py

  notebook-jvm:
    name: Representative notebook on Spark 3.5
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
      - run: uv run --frozen --no-sync python e2e/notebook-run/run-jvm.py
