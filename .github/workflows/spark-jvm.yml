name: JVM Spark compatibility

on:
  workflow_dispatch:
  schedule:
    - cron: '41 4 * * 2' # weekly, Tuesday 04:41 UTC

# Least privilege for every job in this file. Without it each job inherits the
# repository default, which is write on many repos — 51 CodeQL alerts' worth of
# ambient authority for workflows that only ever read the checkout. A job that
# genuinely needs more should declare it at the job level, so the elevation is
# visible where it is used.
permissions:
  contents: read

jobs:
  spark-jvm:
    name: Fabric Runtime 1.3-aligned Spark 3.5.5 compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.32"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: docker/spark-runtime/jars
          key: spark-jars-${{ hashFiles('docker/spark-runtime/jars.txt') }}
      - run: scripts/fetch_spark_jars.sh
      - run: uv run --frozen --no-sync python e2e/spark-jvm/run.py

  notebook-jvm:
    name: Representative notebook on Spark 3.5
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.32"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: docker/spark-runtime/jars
          key: spark-jars-${{ hashFiles('docker/spark-runtime/jars.txt') }}
      - run: scripts/fetch_spark_jars.sh
      - run: uv run --frozen --no-sync python e2e/notebook-run/run-jvm.py

  eventstream:
    name: Eventstream notebook API on JVM Spark + Kafka
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.32"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: docker/spark-runtime/jars
          key: spark-jars-${{ hashFiles('docker/spark-runtime/jars.txt') }}
      - run: scripts/fetch_spark_jars.sh
      - run: uv run --frozen --no-sync python e2e/eventstream/run.py

  sail-jvm-client:
    name: JVM Spark Connect client against Sail
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.32"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      # Keyed on the fetcher because the client coordinate lives there and
      # everything else is derived from its pom — a bump changes the file and
      # invalidates this in one move.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: e2e/sail-jvm-client/jars
          key: connect-client-jars-${{ hashFiles('scripts/fetch_connect_client_jars.py') }}
      - run: uv run --frozen --group sail python e2e/sail-jvm-client/run.py
