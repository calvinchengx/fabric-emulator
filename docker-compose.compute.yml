# Compute overlay: adds LakeSail's Sail (Rust Spark-Connect server — PySpark
# with no JVM) and the Livy statement-executor agent to the emulator pair, so
# Livy sessions, RunNotebook jobs, and dbt run against a real engine.
#
#   docker compose -f docker-compose.yml -f docker-compose.compute.yml up
#
# Clients connect to Spark Connect directly too: sc://localhost:50051
# (`uv add pyspark-client==4.2.0`; no JVM needed). See
# docs/20-lakesail-engine.md for the design and its limits.
services:
  sail:
    build:
      context: .
      dockerfile: docker/sail/Dockerfile
    depends_on:
      fabric-emulator:
        condition: service_healthy
    ports:
      - "50051:50051" # Spark Connect (plain h2c gRPC; no auth — local use only)
    environment:
      # The launcher mints AZURE_STORAGE_TOKEN from entra before exec'ing sail
      # (object_store reads credentials from process env at startup only).
      ENTRA_TOKEN_URL: "https://entra-emulator:8443/6f89cf12-978b-4d23-ac18-9ef0c127cf87/oauth2/v2.0/token"
      ENTRA_CLIENT_ID: "00d88624-f0d7-46f6-a641-6232c2608928"
      ENTRA_CLIENT_SECRET: "daemon-app-secret"
      # az://{workspace}/{item}/… → the emulator's account-prefixed Blob path.
      AZURE_STORAGE_ACCOUNT_NAME: "onelake"
      AZURE_STORAGE_ENDPOINT: "https://fabric-emulator:9443/onelake"
      AZURE_ALLOW_INVALID_CERTIFICATES: "true" # emulator's self-signed TLS
      SAIL_SPARK__SESSION_TIMEOUT_SECS: "3600"
      RUST_LOG: "info"

  spark-agent:
    build:
      context: .
      dockerfile: docker/spark-agent/Dockerfile
    depends_on:
      sail:
        condition: service_started
    # No bind mount and no command: the agent ships inside the image.
    environment:
      SPARK_REMOTE: "sc://sail:50051" # agent becomes a Connect client — no JVM
      # delta-rs reaches OneLake on its own account: a Connect client cannot
      # read back the bearer sail holds, so the agent mints its own from the
      # same issuer with the same Storage audience.
      ENTRA_TOKEN_URL: "https://entra-emulator:8443/6f89cf12-978b-4d23-ac18-9ef0c127cf87/oauth2/v2.0/token"
      # Notebook attribution for the delta-rs path: Rust object_store cannot set
      # request headers, so the agent mints a bearer carrying fabric_job_id /
      # fabric_cell_index as extra claims and the emulator reads them off the
      # validated principal. See internal/onelake/observe.go.
      ENTRA_FORGE_URL: "https://entra-emulator:8443/admin/api/tokens"
      ENTRA_CLIENT_ID: "00d88624-f0d7-46f6-a641-6232c2608928"
      ENTRA_CLIENT_SECRET: "daemon-app-secret"
      AZURE_STORAGE_ACCOUNT_NAME: "onelake"
      AZURE_STORAGE_ENDPOINT: "https://fabric-emulator:9443/onelake"
      AZURE_ALLOW_INVALID_CERTIFICATES: "true" # emulator's self-signed TLS

  # Same warehouse sidecar as docker-compose.override.yml — restated here so
  # `-f docker-compose.yml -f docker-compose.compute.yml` is a COMPLETE stack
  # (naming files with -f disables the override auto-load, which would
  # otherwise silently drop the TDS surface).
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    # amd64 only (no arm64 manifest) — see docker-compose.override.yml.
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Str0ng!Passw0rd"
      # Bound the engine's memory. UNCAPPED, SQL Server sizes its buffer pool from
      # what it can see — 12.8 GB of a 16 GB host — and grew to ~1.8 GB RSS under a
      # medallion run; on a bigger dev box it takes proportionally more. This caps
      # what it believes it has, which is the knob that matters:
      #
      #   uncapped   physical 12832 MB, committed target 1490 MB, ~1.8 GB busy
      #   2048       physical  2048 MB, committed target ~1.2 GB, ~0.9 GB busy
      #
      # 2048 and not lower because the engine FLOORS it there: MSSQL_MEMORY_LIMIT_MB=1024
      # still reports 2000 MB, so a smaller number would only mislead the next reader.
      # Note this does NOT move `max server memory` in sys.configurations, which stays
      # at its 2147483647 sentinel — checking that setting makes the cap look inert.
      MSSQL_MEMORY_LIMIT_MB: "2048"
    healthcheck:
      test:
        - CMD
        - /opt/mssql-tools18/bin/sqlcmd
        - -S
        - localhost
        - -U
        - sa
        - -P
        - "Str0ng!Passw0rd"
        - -C
        - -Q
        - "SELECT 1"
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  fabric-emulator:
    environment:
      # Terminate the Livy protocol in-emulator and execute statements on the
      # agent (which runs them on Sail).
      FABRIC_SPARK_AGENT_URL: "http://spark-agent:8099"
      # The T-SQL/TDS warehouse surface, relaying to the SQL Server sidecar.
      FABRIC_SQL_TDS_ADDR: ":1433"
      FABRIC_WAREHOUSE_SQL_URL: "server=sqlserver;user id=sa;password=Str0ng!Passw0rd;encrypt=disable;dial timeout=90;connection timeout=90"
    ports:
      - "9443:9443" # api.fabric + onelake.dfs + portal (host-routed)
      - "1433:1433" # warehouse T-SQL/TDS
      # (Spark Connect 50051 is published by the sail service above — listing
      # it here too would double-bind the host port and fail `up`.)
