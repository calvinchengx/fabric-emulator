# Engine swap: run the Livy statement agent on **Spark 3.5.5 JVM** instead of the
# default Sail (Rust Spark Connect). Overlay — layer it on the usual files:
#
#   docker compose -f docker-compose.yml -f docker-compose.override.yml \
#                  -f docker-compose.spark-jvm.yml up
#
# Why you'd want it: Sail covers the Spark subset most notebooks use, but a few
# capabilities are JVM-only — structured streaming, OPTIMIZE/VACUUM, Java/Scala
# UDFs, `spark.jars`, and the RDD API (`sc`), which Spark Connect cannot expose
# at all. This profile trades startup time and image size for that fidelity.
# See docs/20-lakesail-engine.md and the parity map's notebook-compatibility
# table for exactly which rows change.
#
# The agent script is unchanged: python/spark_agent/agent.py builds a classic in-process
# SparkSession when SPARK_REMOTE is unset, and a Connect client when it is set.
# Hence the `!reset` below — Compose MERGES environment maps across files, so
# without it the JVM container would still be handed sail's sc:// URL and
# quietly stay a Connect client, defeating the whole overlay.
services:
  spark-agent:
    build:
      context: .
      dockerfile: docker/spark-runtime/Dockerfile
    # The base file builds this service from the python runtime; drop that
    # image identity so the JVM build above is what runs.
    image: !reset null
    depends_on: !override
      fabric-emulator:
        condition: service_healthy
    environment:
      # THE SHIM NEEDS ENDPOINTS. Its default is 127.0.0.1:19080, which inside
      # this container is nothing, so `notebookutils.fs` raised `Connection
      # refused` from a RunNotebook cell while working fine in a Jupyter one —
      # the jupyter service in docker-compose.yml has carried this wiring all
      # along and the agent never did, though that service's own comment claims
      # "a cell here and a cell in a RunNotebook job execute identically".
      #
      # Found by the framework-conformance contract-1 probe, which was the first
      # thing that ever called notebookutils from inside a notebook job.
      #
      # NOT workspace/lakehouse ids: those are the environment fallback, and a
      # runtime that answers through it can hide two broken control-plane links
      # (docs/38 §1). The agent binds the real context per statement.
      NOTEBOOKUTILS_FABRIC_URL: "http://fabric-emulator"
      NOTEBOOKUTILS_ENTRA_URL: "http://entra-emulator:8443"
      NOTEBOOKUTILS_INSECURE: "1"
      SPARK_REMOTE: !reset null # classic JVM session, not a Connect client
      # Eventstream adapter: mint a Fabric-audience token and resolve item IDs.
      FABRIC_API_URL: "https://fabric-emulator:9443"
      ENTRA_FABRIC_SCOPE: "https://api.fabric.microsoft.com/.default"
    volumes: !override
      - ./python/spark_agent:/opt/spark/work-dir:ro
    command: !override
      - /opt/spark/bin/spark-submit
      - --master
      - local[2]
      - /opt/spark/work-dir/agent.py
      - "8099"

  # Sail is not needed in this configuration; keep it out of the way so the
  # stack doesn't build and boot an engine nothing talks to.
  sail:
    profiles: [donotstart]
