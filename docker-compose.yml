# Brings up the emulator FAMILY with one command:
#
#   docker compose up
#     entra-emulator    :8443  issues every token (the STS)
#     keyvault-emulator :8444  Azure Key Vault data plane (secrets, AKV refs)
#     fabric-emulator   :9443  the Fabric control plane + OneLake
#
#   docker compose -f docker-compose.yml -f docker-compose.compute.yml up
#     …adds LakeSail's Sail (Rust Spark-Connect engine, no JVM) + the Livy
#     statement agent, so Livy sessions, RunNotebook, dbt, and any PySpark
#     client (sc://localhost:50051) run against a real engine.
#
#   docker compose --profile rti \
#     -f docker-compose.yml -f docker-compose.override.yml -f docker-compose.rti.yml up
#     …adds Microsoft's own KQL engine (kustainer, :8080) behind the
#     Eventhouse / KQL Database surface, so Real-Time Intelligence queries,
#     management commands, and inline ingestion really execute. Optional by
#     profile: without the flag the kustainer service never starts or pulls,
#     and without the overlay the Kusto routes stay an honest 501.
#     See docs/25-rti-kusto.md.
#
#   docker compose --profile governance up
#     …adds OpenMetadata (:8585) — data governance/catalog over the same
#     state your pipelines write. Optional by profile: without the flag the
#     services below tagged `profiles: [governance]` never start or pull.
#     Catalog the emulator into it:  docker compose run --rm govern-ingest
#
# entra issues tokens; keyvault and fabric validate them against entra's JWKS —
# the same trust relationships as production Azure. Point FABRIC_ENTRA_ISSUER
# at a real tenant instead and nothing else changes.
#
# Issuer alignment matters: tokens carry iss = <entra login origin>/<tenant>/v2.0,
# so entra must ADVERTISE the origin fabric validates against. On the compose
# network that origin is https://entra-emulator:8443, hence PUBLIC_ORIGIN below.
# Image versions are overridable so a consumer can pin a known-good release
# instead of tracking whatever `latest` happens to be:
#
#   FABRIC_EMULATOR_VERSION=0.7.0 docker compose up -d
#
# Default stays `latest` so the quickstart is unchanged. Release tags publish
# both `<version>` and `latest` (see .github/workflows/release.yml).
services:
  entra-emulator:
    image: ghcr.io/calvinchengx/entra-emulator:${ENTRA_EMULATOR_VERSION:-latest}
    environment:
      ORIGIN_MODE: compat # single origin, path-prefixed surfaces
      PUBLIC_ORIGIN: "https://entra-emulator:8443"
    ports:
      - "8443:8443" # login / graph / discovery (JWKS)
    healthcheck:
      test: ["CMD", "/usr/local/bin/entra-emulator", "healthcheck"]
      interval: 5s
      timeout: 2s
      retries: 10

  keyvault-emulator:
    image: ghcr.io/calvinchengx/azure-keyvault-emulator:${KEYVAULT_EMULATOR_VERSION:-latest}
    depends_on:
      entra-emulator:
        condition: service_healthy
    ports:
      - "8444:8444" # Key Vault data plane (AKV references, notebookutils.credentials.getSecret)
    environment:
      # Same trust wiring as fabric: validate bearers against entra's JWKS.
      KV_ENTRA_ISSUER: "https://entra-emulator:8443/6f89cf12-978b-4d23-ac18-9ef0c127cf87/v2.0"
      KV_ENTRA_TLS_INSECURE: "true"
      # Like fabric below: the image bakes KV_DATA_DIR=/data for volume users;
      # no volume here, so run in-memory or SQLite fails to open.
      KV_DATA_DIR: ""

  fabric-emulator:
    image: ghcr.io/calvinchengx/fabric-emulator:${FABRIC_EMULATOR_VERSION:-latest}
    depends_on:
      entra-emulator:
        condition: service_healthy
    ports:
      - "9443:9443" # api.fabric + onelake.dfs + portal (host-routed)
    environment:
      # Must equal the iss entra advertises (see PUBLIC_ORIGIN above).
      # 11111111-… is entra-emulator's default seeded tenant.
      FABRIC_ENTRA_ISSUER: "https://entra-emulator:8443/6f89cf12-978b-4d23-ac18-9ef0c127cf87/v2.0"
      FABRIC_ENTRA_JWKS_URL: "https://entra-emulator:8443/6f89cf12-978b-4d23-ac18-9ef0c127cf87/discovery/v2.0/keys"
      # Trust entra-emulator's self-signed cert on the internal network.
      FABRIC_ENTRA_TLS_INSECURE: "true"
      # The image bakes in FABRIC_DATA_DIR=/data (for callers who mount a
      # volume there); this compose file mounts none, so state is in-memory —
      # override back to empty or the store fails to open /data (no volume).
      FABRIC_DATA_DIR: ""
      # Who is a Fabric administrator. The binary defaults to NOBODY — an
      # unconfigured emulator refuses every /v1/admin/* mutation rather than
      # letting any authenticated principal govern the tenant. That default is
      # right for a library and wrong for a dev stack you just brought up, so
      # this compose declares the well-known daemon app entra-emulator seeds.
      # Matched against the token's appid or oid; comma-separated for more.
      FABRIC_TENANT_ADMINS: "${FABRIC_TENANT_ADMINS:-00d88624-f0d7-46f6-a641-6232c2608928}"
  # The terminal pane's backend: ttyd, a shell over a websocket, for the Flow
  # view's side-by-side terminal (drive the pipeline while you watch it run).
  #
  # PROFILED, and NOT published to the host. The only route in is the
  # emulator's proxy at /_emulator/portal/terminal/ws, which demands the token
  # printed at startup — see internal/server/terminal.go for why that route
  # carries its own auth when the other 11 portal routes carry none.
  #
  # Publishing a port here would undo all of that: ttyd's own `--credential` is
  # basic auth over whatever the host exposes, and the point is that the shell
  # is reachable ONLY through the origin the portal is already served from.
  #
  # Two opt-ins, same as `rti`:
  #   --profile terminal                    starts ttyd
  #   -f docker-compose.terminal.yml        hands the emulator its URL
  # Skip the overlay and the terminal routes are not mounted at all.
  ttyd:
    profiles: [terminal]
    image: tsl0922/ttyd:1.7.7
    # `-W` makes the client writable; without it the pane is a read-only
    # viewer, which is a different (and much safer) product — if you want that,
    # drop the flag rather than adding a second service.
    command: ["ttyd", "-W", "-p", "7681", "bash"]
    expose:
      - "7681"


  # ---- Notebooks (optional): real JupyterLab, profile-gated -----------------
  # A real editor SHIPPED rather than one built into the portal. docs/44 records
  # the doctrine (authoring belongs to real tools, because a UI we write is not
  # parity evidence) and the one place it was weak: a newcomer could not touch a
  # notebook without installing VS Code or Jupyter first. Same answer as
  # OpenMetadata for the catalog UI — attach the real thing.
  #
  #   make up-jupyter        then open http://localhost:8888
  #
  # The kernel gets `notebookutils` on PYTHONPATH and Spark Connect to Sail, so
  # a notebook authored here is the same notebook fabric-cicd publishes and
  # RunNotebook executes.
  jupyter:
    profiles: [jupyter]
    build:
      context: .
      dockerfile: docker/jupyter/Dockerfile
    depends_on:
      fabric-emulator:
        condition: service_healthy
    ports:
      - "8888:8888"
    volumes:
      # Notebooks live on the host so they survive the container and can be
      # committed, published by fabric-cicd, or opened in VS Code instead.
      - ./notebooks:/notebooks
    environment:
      # The shim's documented wiring (python/notebookutils/_config.py). Tenant,
      # client id and secret default to entra-emulator's seeded dev identity, so
      # only the endpoints need naming.
      NOTEBOOKUTILS_FABRIC_URL: "http://fabric-emulator"
      NOTEBOOKUTILS_ENTRA_URL: "http://entra-emulator:8443"
      NOTEBOOKUTILS_INSECURE: "1"
      # Spark Connect to the same engine the Livy path uses, so a cell here and
      # a cell in a RunNotebook job execute identically.
      SPARK_REMOTE: "sc://sail:50051"
    # Local dev only, like the rest of this file: no token, no password. This
    # listens on localhost and is not for anything internet-facing.
    command: >
      jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root
      --IdentityProvider.token= --ServerApp.password=
      --ServerApp.root_dir=/notebooks

  # ---- Orchestration (optional): real Apache Airflow, profile-gated ---------
  # Fabric's code-first orchestrator IS upstream Apache Airflow, so this is the
  # engine rather than an imitation of it — the same versions Microsoft
  # documents (2.10.5 on Python 3.12), running the real scheduler and executor
  # behind `ApacheAirflowJob` items. The emulator stores DAG sources as item
  # definitions, syncs them into the shared DAG volume below, and drives
  # Airflow's REST API for discovery, unpause, trigger and polling.
  #
  # Profile-gated so `docker compose up` neither pulls nor starts it. The
  # emulator's FABRIC_AIRFLOW_* wiring lives in docker-compose.airflow.yml, and
  # both are needed — a URL pointing at a container nobody started is exactly
  # the bug the spark-agent profile shipped once, which is why the terminal
  # overlay is split the same way.
  #
  # SequentialExecutor on SQLite: this is a local fidelity target, not a
  # throughput one, and it keeps the sidecar to one container.
  airflow:
    profiles: [airflow]
    image: apache/airflow:2.10.5-python3.12
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      # The emulator writes a DAG and then waits for Airflow to notice it; the
      # defaults (5 min) make that look like a hang.
      AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "2"
      AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: "1"
    volumes:
      - airflow-dags:/opt/airflow/dags
    ports:
      - "8085:8080" # the Airflow UI, for looking at what a job actually did
    command:
      - bash
      - -ec
      - |
        airflow db migrate
        airflow users create --username admin --password admin \
          --firstname Fabric --lastname Emulator --role Admin --email admin@example.com
        airflow scheduler &
        exec airflow webserver
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 60

  # ---- Real-Time Intelligence (optional): Kusto engine, profile-gated -------
  # Microsoft's own KQL engine container (the Azure Data Explorer "Kusto
  # emulator"), attached the same way the SQL Server sidecar backs the T-SQL
  # warehouse: the emulator terminates Fabric's Kusto REST contract — bearer,
  # RBAC, per-KQL-database isolation — and this computes the KQL for real.
  # Profile-gated so `docker compose up` never starts or pulls it (~1.2 GB).
  #
  #   docker compose --profile rti \
  #     -f docker-compose.yml -f docker-compose.override.yml -f docker-compose.rti.yml up
  #
  # The overlay is what points the emulator at it (FABRIC_KQL_URL); without
  # the overlay the Kusto routes stay an honest 501. See docs/25-rti-kusto.md.
  kustainer:
    profiles: [rti]
    # Digest-pinned: `latest` on a Microsoft image moves without notice, and a
    # silently swapped engine turns a parity witness into a coin toss. Refresh with
    #   docker buildx imagetools inspect mcr.microsoft.com/azuredataexplorer/kustainer-linux:latest
    image: mcr.microsoft.com/azuredataexplorer/kustainer-linux:latest@sha256:1a488e094be760ebff1204e690a54b1b372decd9730ea0baf2d291b4a488205f
    # amd64 only, and Microsoft documents ARM as unsupported: the engine's
    # native layer needs AVX2, which Apple-silicon emulation does not expose,
    # so the container crashes on boot there. Linux/amd64 hosts (and CI) are
    # where this profile runs.
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y" # the image refuses to start without it
    mem_limit: 4g # Microsoft's documented minimum for the engine
    ports:
      - "8080:8080" # Kusto query + management (HTTP only; the engine has no TLS)
    healthcheck:
      # The documented readiness probe: a management command that needs no
      # database (learn.microsoft.com/azure/data-explorer/kusto-emulator-install).
      test:
        - CMD-SHELL
        - >-
          curl -sf -X POST -H 'Content-Type: application/json'
          -d '{"csl":".show cluster"}' http://localhost:8080/v1/rest/mgmt >/dev/null
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s

  # ---- Governance (optional): OpenMetadata, profile-gated -------------------
  # Mirrors OpenMetadata's own quickstart compose (docker-compose-postgres.yml
  # @ 1.13.2), profile-gated so `docker compose up` never starts or pulls it.
  # The OM env schema defaults every connection var; we set only the hosts.
  # Heavier than the emulators: the search backend alone wants ~1 GB heap.
  #
  # OpenSearch, not Elasticsearch, and deliberately so. OpenMetadata supports
  # both via SEARCH_TYPE, but **semantic search works only on OpenSearch** —
  # its docs state Elasticsearch "is not supported" for it. Defaulting to
  # Elasticsearch would foreclose a whole feature class at the infrastructure
  # layer, silently: nothing fails, the option simply is not there. OpenSearch
  # is also Apache-2.0 in its binaries, where the elastic.co images remain
  # ELv2/SSPL even though the source regained an AGPL option in 8.16.
  om-postgresql:
    profiles: [governance]
    image: docker.getcollate.io/openmetadata/postgresql:1.13.2
    command: "--work_mem=10MB"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - om-db-data:/var/lib/postgresql/data
    healthcheck:
      test: psql -U postgres -tAc 'select 1' -d openmetadata_db
      interval: 15s
      timeout: 10s
      retries: 10

  om-opensearch:
    profiles: [governance]
    # Mirrors OpenMetadata's own docker-compose-opensearch-standalone.yml,
    # with ONE deviation: upstream asks -Xms2g -Xmx4g, which is a lot to
    # reserve in a dev-loop stack whose quickstart already asks for 8 GB. 1 GB
    # matches what the Elasticsearch service used here and is enough for the
    # governance e2e's catalog; raise it if you index a real estate.
    image: opensearchproject/opensearch:3.4.0
    environment:
      - discovery.type=single-node
      - OPENSEARCH_JAVA_OPTS=-Xms1024m -Xmx1024m
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
    volumes:
      - om-search-data:/usr/share/opensearch/data
    healthcheck:
      test: "curl -s http://localhost:9200/_cluster/health?pretty | grep status | grep -qE 'green|yellow' || exit 1"
      interval: 15s
      timeout: 10s
      retries: 10

  om-migrate:
    profiles: [governance]
    image: docker.getcollate.io/openmetadata/server:1.13.2
    command: "./bootstrap/openmetadata-ops.sh migrate"
    environment:
      DB_HOST: om-postgresql
      # The server image defaults to MySQL; these flip it to the Postgres
      # sidecar (same values as OM's quickstart-postgres compose).
      DB_PORT: "5432"
      DB_SCHEME: postgresql
      DB_DRIVER_CLASS: org.postgresql.Driver
      DB_PARAMS: "allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC"
      # SEARCH_TYPE picks the backend; the CONNECTION vars stay
      # ELASTICSEARCH_*-prefixed for both, which is OpenMetadata's naming, not a
      # copy/paste slip — there is no OPENSEARCH_HOST. Setting one silently does
      # nothing and the server falls back to localhost:9200.
      SEARCH_TYPE: opensearch
      ELASTICSEARCH_HOST: om-opensearch
    depends_on:
      om-postgresql:
        condition: service_healthy
      om-opensearch:
        condition: service_healthy

  openmetadata:
    profiles: [governance]
    image: docker.getcollate.io/openmetadata/server:1.13.2
    ports:
      - "8585:8585" # UI + API (seeded basic-auth admin)
    environment:
      DB_HOST: om-postgresql
      # The server image defaults to MySQL; these flip it to the Postgres
      # sidecar (same values as OM's quickstart-postgres compose).
      DB_PORT: "5432"
      DB_SCHEME: postgresql
      DB_DRIVER_CLASS: org.postgresql.Driver
      DB_PARAMS: "allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC"
      # SEARCH_TYPE picks the backend; the CONNECTION vars stay
      # ELASTICSEARCH_*-prefixed for both, which is OpenMetadata's naming, not a
      # copy/paste slip — there is no OPENSEARCH_HOST. Setting one silently does
      # nothing and the server falls back to localhost:9200.
      SEARCH_TYPE: opensearch
      ELASTICSEARCH_HOST: om-opensearch
    depends_on:
      om-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8586/healthcheck"]
      interval: 15s
      timeout: 10s
      retries: 20

  # One-shot: walk the emulator (workspaces → lakehouses → Delta tables, schemas
  # read from real OneLake bytes) and upsert the catalog into OpenMetadata.
  # Idempotent — rerun after pipeline runs to refresh.
  #   docker compose run --rm govern-ingest
  govern-ingest:
    profiles: [governance]
    # `build:` with no `image:` — this one exists ONLY as a local build, so
    # `docker compose pull` skips it and cannot refresh it. After a pull that
    # touches pyproject.toml / uv.lock, rebuild or the container runs against a
    # stale dependency set:
    #   docker compose --profile governance build govern-ingest
    # The symptom is quiet: every other service is healthy and only this
    # one-shot exits non-zero (it was `ModuleNotFoundError: No module named
    # 'yaml'` when govern_ingest.py gained its pyyaml dependency). See
    # docs/22-openmetadata.md.
    build:
      context: .
      dockerfile: docker/python-runtime/Dockerfile
      args: { UV_GROUP: governance }
    depends_on:
      openmetadata:
        condition: service_healthy
      fabric-emulator:
        condition: service_healthy
    volumes:
      - ./scripts/govern_ingest.py:/govern_ingest.py:ro
    environment:
      FABRIC_URL: "https://fabric-emulator:9443"
      ENTRA_URL: "https://entra-emulator:8443"
      OM_URL: "http://openmetadata:8585"
    command: python /govern_ingest.py

volumes:
  om-db-data:
  om-search-data:
  # Shared with the emulator: it writes DAG files here, Airflow's scheduler
  # reads them from the same volume. One volume is what makes the sync a file
  # copy rather than an upload API.
  airflow-dags:
