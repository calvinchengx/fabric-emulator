# Compose override for the flow.gif recording: build the emulator from THIS
# tree, and allow host-port remapping so the recording can run on a machine
# where a dev stack already holds 9443.
#
# Only two services are started (see flow.py): entra-emulator, because the
# emulator validates real tokens, and the emulator itself. No Sail, no
# warehouse, no OpenMetadata — the medallion this films is drawn by the
# emulator's OWN Copy executor, which is what makes the recording reproducible
# from this repository alone.
services:
  fabric-emulator:
    build:
      # flow.py sets DEMO_BUILD_CONTEXT to the repo root (absolute) — relative
      # contexts resolve against the project dir on some compose versions,
      # which would point outside the repo.
      context: ${DEMO_BUILD_CONTEXT:-../..}
      dockerfile: Dockerfile
    ports: !override
      - "${DEMO_FABRIC_PORT:-9443}:9443"
  entra-emulator:
    ports: !override
      - "${DEMO_ENTRA_PORT:-8443}:8443"
  keyvault-emulator:
    ports: !override
      - "${DEMO_KV_PORT:-8444}:8444"
