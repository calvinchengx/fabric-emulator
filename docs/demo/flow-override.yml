# Compose override for the flow.gif recording.
#
# Builds the emulator from THIS tree, and remaps every published port so the
# recording never collides with a dev stack — or with a sibling project holding
# 9443, which is what prompted the remap. The example is pointed at these ports
# through its own environment variables (`FABRIC_EMULATOR_URL` and friends --
# the names python/fabric-target reads), so nothing is hard-coded twice.
services:
  fabric-emulator:
    build:
      # flow.py sets DEMO_BUILD_CONTEXT to the repo root (absolute) — relative
      # contexts resolve against the project dir on some compose versions,
      # which would point outside the repo.
      context: ${DEMO_BUILD_CONTEXT:-../..}
      dockerfile: Dockerfile
    ports: !override
      - "${DEMO_FABRIC_PORT:-9843}:9443"
      - "${DEMO_TDS_PORT:-11533}:1433"
  entra-emulator:
    ports: !override
      - "${DEMO_ENTRA_PORT:-8843}:8443"
  keyvault-emulator:
    ports: !override
      - "${DEMO_KV_PORT:-8844}:8444"
  sail:
    ports: !override
      - "${DEMO_SPARK_PORT:-50351}:50051"
  openmetadata:
    ports: !override
      - "${DEMO_OM_PORT:-8685}:8585"
