services:
  entra-emulator:
    image: ghcr.io/calvinchengx/entra-emulator:${ENTRA_EMULATOR_VERSION:-0.4.0}
    environment:
      ORIGIN_MODE: compat
      TLS_ENABLED: "false"
      PORT: "8443"
      PUBLIC_ORIGIN: "http://entra-emulator:8443"
    healthcheck:
      test: ["CMD", "/usr/local/bin/entra-emulator", "healthcheck"]
      interval: 3s
      timeout: 2s
      retries: 20

  mlflow:
    build:
      context: ../..
      dockerfile: docker/python-runtime/Dockerfile
      args: { UV_GROUP: mlflow }
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --workers
      - "1"
      - --backend-store-uri
      - sqlite:////tmp/mlflow.db
      - --artifacts-destination
      - /tmp/mlartifacts
      - --disable-security-middleware
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 3s
      timeout: 2s
      retries: 30

  fabric-emulator:
    build:
      context: ../..
      dockerfile: Dockerfile
    depends_on:
      entra-emulator:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    environment:
      FABRIC_ADDR: ":80"
      FABRIC_DATA_DIR: ""
      FABRIC_DISABLE_TLS: "true"
      FABRIC_ENTRA_ISSUER: "http://entra-emulator:8443/6f89cf12-978b-4d23-ac18-9ef0c127cf87/v2.0"
      FABRIC_MLFLOW_URL: "http://mlflow:5000"
    networks:
      default:
        aliases:
          - onelake.dfs.fabric.microsoft.com
    healthcheck:
      test: ["CMD", "/usr/local/bin/fabric-emulator", "healthcheck"]
      interval: 3s
      timeout: 2s
      retries: 20

  sail:
    build:
      context: ../..
      dockerfile: docker/sail/Dockerfile
    depends_on:
      fabric-emulator:
        condition: service_healthy
    environment:
      ENTRA_TOKEN_URL: "http://entra-emulator:8443/6f89cf12-978b-4d23-ac18-9ef0c127cf87/oauth2/v2.0/token"
      ENTRA_CLIENT_ID: "00d88624-f0d7-46f6-a641-6232c2608928"
      ENTRA_CLIENT_SECRET: "daemon-app-secret"
      AZURE_STORAGE_ACCOUNT_NAME: "onelake"
      AZURE_STORAGE_ENDPOINT: "http://fabric-emulator/onelake"
      AZURE_ALLOW_HTTP: "true"
      SAIL_SPARK__SESSION_TIMEOUT_SECS: "3600"

  witness:
    build:
      context: ../..
      dockerfile: docker/python-runtime/Dockerfile
      args: { UV_GROUP: data-science-loop }
    depends_on:
      fabric-emulator:
        condition: service_healthy
      sail:
        condition: service_started
    volumes:
      - ./driver.py:/driver.py:ro
      - ./dbt:/dbt:ro
    environment:
      FABRIC: "http://fabric-emulator"
      ENTRA: "http://entra-emulator:8443"
      SPARK_REMOTE: "sc://sail:50051"
      GIT_PYTHON_REFRESH: "quiet"
    command: python /driver.py
