# e2e: Microsoft's real dbt-fabricspark adapter runs a dbt project (debug ->
# seed -> run -> test) against fabric-emulator's Livy High-Concurrency surface,
# with Sail behind it through Spark Connect. This is the second independent client over the Livy
# HC layer (after the go/pure-requests clients) — a strong parity witness.
#
#   dbt-fabricspark → fabric-emulator (Fabric REST + Livy HC, native) → Spark Connect agent → Sail
#                          ↑ Entra FedAuth token minted by entra-emulator
#
# fabric-emulator serves TLS here (dbt requires an HTTPS endpoint); its
# self-signed cert (SAN api.fabric.microsoft.com) is shared to the dbt container
# via the emu-data volume for REQUESTS_CA_BUNDLE.
services:
  entra-emulator:
    image: ghcr.io/calvinchengx/entra-emulator:latest
    environment:
      ORIGIN_MODE: compat
      TLS_ENABLED: "false"
      PORT: "8443"
      PUBLIC_ORIGIN: "http://entra-emulator:8443"
    healthcheck:
      test: ["CMD", "/usr/local/bin/entra-emulator", "healthcheck"]
      interval: 3s
      timeout: 2s
      retries: 20

  # LakeSail's Sail: the Spark engine (Rust Spark Connect, no JVM). Its
  # launcher mints the entra Storage token before the server starts;
  # object_store writes ride the emulator's account-prefixed Blob path.
  sail:
    build:
      context: ../..
      dockerfile: docker/sail/Dockerfile
    depends_on:
      fabric-emulator:
        condition: service_healthy
    environment:
      ENTRA_TOKEN_URL: "http://entra-emulator:8443/6f89cf12-978b-4d23-ac18-9ef0c127cf87/oauth2/v2.0/token"
      ENTRA_CLIENT_ID: "00d88624-f0d7-46f6-a641-6232c2608928"
      ENTRA_CLIENT_SECRET: "daemon-app-secret"
      AZURE_STORAGE_ACCOUNT_NAME: "onelake"
      AZURE_STORAGE_ENDPOINT: "https://fabric-emulator:9443/onelake"
      AZURE_ALLOW_INVALID_CERTIFICATES: "true" # emulator self-signed TLS
      SAIL_SPARK__SESSION_TIMEOUT_SECS: "3600"
      RUST_LOG: "info"

  # The SQL agent behind the emulator's Livy layer, executing dbt's SQL — a
  # Spark Connect client of sail (python:slim, no JVM). The health gate
  # matters: the emulator reports HC sessions Idle immediately, so dbt hits
  # the agent on the first statement — it must not start until the agent is up.
  spark-agent:
    build:
      context: ../..
      dockerfile: docker/python-runtime/Dockerfile
      args: { UV_GROUP: spark-connect }
    depends_on:
      sail:
        condition: service_started
    volumes:
      - ./sql_agent.py:/sql_agent.py:ro
    environment:
      SPARK_REMOTE: "sc://sail:50051"
    command: python /sql_agent.py 8099
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8099/health').status==200 else 1)"
      interval: 5s
      timeout: 4s
      retries: 60
      start_period: 60s

  fabric-emulator:
    build:
      context: ../..
      dockerfile: Dockerfile
    depends_on:
      entra-emulator:
        condition: service_healthy
    environment:
      FABRIC_ADDR: ":9443"
      FABRIC_DATA_DIR: "/data" # persist the TLS cert so the dbt container can trust it
      FABRIC_ENTRA_ISSUER: "http://entra-emulator:8443/6f89cf12-978b-4d23-ac18-9ef0c127cf87/v2.0"
      # Terminate Livy natively (incl. High-Concurrency) and drive the agent.
      FABRIC_SPARK_AGENT_URL: "http://spark-agent:8099"
    volumes:
      - emu-data:/data
    networks:
      default:
        aliases:
          - api.fabric.microsoft.com
    healthcheck:
      test: ["CMD", "/usr/local/bin/fabric-emulator", "healthcheck"]
      interval: 3s
      timeout: 2s
      retries: 20

  dbt:
    build:
      context: ../..
      dockerfile: e2e/dbt-fabricspark/Dockerfile.dbt
    depends_on:
      fabric-emulator:
        condition: service_healthy
      spark-agent:
        condition: service_healthy
    environment:
      ENTRA_URL: "http://entra-emulator:8443"
      FABRIC_URL: "https://api.fabric.microsoft.com:9443"
      REQUESTS_CA_BUNDLE: "/data/tls/cert.pem"
    volumes:
      - emu-data:/data:ro

volumes:
  emu-data:
