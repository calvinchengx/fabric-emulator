# Native Livy: the emulator terminates the Livy REST protocol itself and drives
# a statement-executor agent — real interactive sessions with NO Apache Livy
# server (it's retired). The engine is LakeSail's Sail (Spark Connect, no JVM);
# a real client creates a session, submits PySpark statements, and gets results
# computed by a real engine.
#
#   client → fabric-emulator (Livy REST, native) → spark agent (persistent SparkSession)
services:
  entra-emulator:
    image: ghcr.io/calvinchengx/entra-emulator:${ENTRA_EMULATOR_VERSION:-0.9.0}
    environment:
      ORIGIN_MODE: compat
      TLS_ENABLED: "false"
      PORT: "8443"
      PUBLIC_ORIGIN: "http://entra-emulator:8443"
    healthcheck:
      test: ["CMD", "/usr/local/bin/entra-emulator", "healthcheck"]
      interval: 3s
      timeout: 2s
      retries: 20

  # LakeSail's Sail: the Spark engine (Rust Spark Connect, no JVM). Its
  # launcher mints the entra Storage token before the server starts;
  # object_store writes ride the emulator's account-prefixed Blob path.
  sail:
    build:
      context: ../..
      dockerfile: docker/sail/Dockerfile
    depends_on:
      fabric-emulator:
        condition: service_healthy
    environment:
      ENTRA_TOKEN_URL: "http://entra-emulator:8443/6f89cf12-978b-4d23-ac18-9ef0c127cf87/oauth2/v2.0/token"
      ENTRA_CLIENT_ID: "00d88624-f0d7-46f6-a641-6232c2608928"
      ENTRA_CLIENT_SECRET: "daemon-app-secret"
      AZURE_STORAGE_ACCOUNT_NAME: "onelake"
      AZURE_STORAGE_ENDPOINT: "http://fabric-emulator/onelake"
      AZURE_ALLOW_HTTP: "true"
      SAIL_SPARK__SESSION_TIMEOUT_SECS: "3600"
      RUST_LOG: "info"

  # The statement-executor agent: one long-lived session, a REPL over HTTP —
  # now a Spark Connect client of sail (python:slim, no JVM).
  spark-agent:
    build:
      context: ../..
      dockerfile: docker/spark-agent/Dockerfile
    depends_on:
      sail:
        condition: service_started
    # The agent comes from the image, exactly as it does for someone who pulled
    # the published tag — so this e2e exercises the shipped artifact rather than
    # the working tree mounted over it.
    environment:
      SPARK_REMOTE: "sc://sail:50051"
      # delta-rs reaches OneLake on its own account (see storage.py), so the
      # agent mints its own Storage token from the same issuer sail uses.
      ENTRA_TOKEN_URL: "http://entra-emulator:8443/6f89cf12-978b-4d23-ac18-9ef0c127cf87/oauth2/v2.0/token"
      ENTRA_CLIENT_ID: "00d88624-f0d7-46f6-a641-6232c2608928"
      ENTRA_CLIENT_SECRET: "daemon-app-secret"
      AZURE_STORAGE_ACCOUNT_NAME: "onelake"
      AZURE_STORAGE_ENDPOINT: "http://fabric-emulator/onelake"
      AZURE_ALLOW_HTTP: "true"

  fabric-emulator:
    build:
      context: ../..
      dockerfile: Dockerfile
    depends_on:
      entra-emulator:
        condition: service_healthy
    environment:
      FABRIC_ADDR: ":80"
      FABRIC_DATA_DIR: ""
      FABRIC_DISABLE_TLS: "true"
      FABRIC_ENTRA_ISSUER: "http://entra-emulator:8443/6f89cf12-978b-4d23-ac18-9ef0c127cf87/v2.0"
      # Terminate Livy natively and drive the agent — the whole point.
      FABRIC_SPARK_AGENT_URL: "http://spark-agent:8099"
    healthcheck:
      test: ["CMD", "/usr/local/bin/fabric-emulator", "healthcheck"]
      interval: 3s
      timeout: 2s
      retries: 20

  client:
    build:
      context: ../..
      dockerfile: docker/python-runtime/Dockerfile
      args: { UV_GROUP: runtime }
    depends_on:
      fabric-emulator:
        condition: service_healthy
    volumes:
      - ./driver.py:/driver.py:ro
    command: ["python3", "/driver.py"]
