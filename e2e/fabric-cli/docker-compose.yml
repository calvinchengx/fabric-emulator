# Microsoft's Fabric CLI (fab) drives the emulator. fab hardcodes https:// and
# the MSAL authority login.microsoftonline.com, so entra-emulator IS that host
# (PUBLIC_ORIGIN + network alias, on :443) and fabric is api.fabric.microsoft.com
# (fab's FAB_API_ENDPOINT_FABRIC override points at it on :8443).
services:
  entra:
    image: ghcr.io/calvinchengx/entra-emulator:${ENTRA_EMULATOR_VERSION:-0.9.0}
    user: "0:0"                       # bind privileged :443 (authority has no port)
    environment:
      PUBLIC_ORIGIN: "https://login.microsoftonline.com"
      LOCAL_DOMAINS: "login.microsoftonline.com"
      PORT: "443"
      TLS_ENABLED: "true"
    networks:
      default:
        aliases: ["login.microsoftonline.com"]

  fabric:
    build: { context: ../.., dockerfile: Dockerfile }
    user: "0:0"
    environment:
      FABRIC_ADDR: ":443"
      FABRIC_DATA_DIR: "/data"
      # Force tiny pages so every list exercises the continuation-token loop —
      # the pagination equivalent of the controllable clock (docs/parity.md).
      FABRIC_LIST_PAGE_SIZE: "2"
      # Admin WRITES -- creating a domain, setting a sensitivity label --
      # are legal only for a declared administrator: a service principal
      # may READ /v1/admin/* and may not change it. Without this the
      # emulator answers InsufficientPrivileges, which is correct, and the
      # typed verbs below never reach the routes they are meant to witness.
      # Same value and same reason as e2e/az-rest.
      #
      # THE REFUSAL IS NOT LOST BY GRANTING IT HERE: that a non-admin
      # service principal is refused an admin write is witnessed by
      # go:TestAdminWriteRefusesAServicePrincipalThatIsNotAnAdministrator,
      # which this suite does not and need not duplicate.
      FABRIC_TENANT_ADMINS: "00d88624-f0d7-46f6-a641-6232c2608928"
      FABRIC_ENTRA_ISSUER: "https://login.microsoftonline.com/6f89cf12-978b-4d23-ac18-9ef0c127cf87/v2.0"
      FABRIC_ENTRA_TLS_INSECURE: "true"
    networks:
      default:
        aliases: ["api.fabric.microsoft.com"]

  client:
    build: { context: ../.., dockerfile: e2e/fabric-cli/Dockerfile }
    depends_on: [entra, fabric]
