# Native Livy: the emulator terminates the Livy REST protocol itself and drives
# a statement-executor agent — real interactive sessions with NO Apache Livy
# server (it's retired). The engine is LakeSail's Sail (Spark Connect, no JVM);
# a real client creates a session, submits PySpark statements, and gets results
# computed by a real engine.
#
#   client → fabric-emulator (Livy REST, native) → spark agent (persistent SparkSession)
services:
  entra-emulator:
    image: ghcr.io/calvinchengx/entra-emulator:latest
    environment:
      ORIGIN_MODE: compat
      TLS_ENABLED: "false"
      PORT: "8443"
      PUBLIC_ORIGIN: "http://entra-emulator:8443"
    healthcheck:
      test: ["CMD", "/usr/local/bin/entra-emulator", "healthcheck"]
      interval: 3s
      timeout: 2s
      retries: 20

  # LakeSail's Sail: the Spark engine (Rust Spark Connect, no JVM). Its
  # launcher mints the entra Storage token before the server starts;
  # object_store writes ride the emulator's account-prefixed Blob path.
  sail:
    build:
      context: ../../docker/sail
    depends_on:
      fabric-emulator:
        condition: service_healthy
    environment:
      ENTRA_TOKEN_URL: "http://entra-emulator:8443/11111111-1111-1111-1111-111111111111/oauth2/v2.0/token"
      ENTRA_CLIENT_ID: "cccccccc-0000-0000-0000-000000000002"
      ENTRA_CLIENT_SECRET: "daemon-app-secret"
      AZURE_STORAGE_ACCOUNT_NAME: "onelake"
      AZURE_STORAGE_ENDPOINT: "http://fabric-emulator/onelake"
      AZURE_ALLOW_HTTP: "true"
      SAIL_SPARK__SESSION_TIMEOUT_SECS: "3600"
      RUST_LOG: "info"

  # The statement-executor agent: one long-lived session, a REPL over HTTP —
  # now a Spark Connect client of sail (python:slim, no JVM).
  spark-agent:
    image: python:3.12-slim
    depends_on:
      sail:
        condition: service_started
    volumes:
      - ./agent.py:/agent.py:ro
    environment:
      SPARK_REMOTE: "sc://sail:50051"
    command: sh -c "pip install --no-cache-dir -q 'pyspark-client==4.2.0' && python /agent.py"

  fabric-emulator:
    build:
      context: ../..
      dockerfile: Dockerfile
    depends_on:
      entra-emulator:
        condition: service_healthy
    environment:
      FABRIC_ADDR: ":80"
      FABRIC_DATA_DIR: ""
      FABRIC_DISABLE_TLS: "true"
      FABRIC_ENTRA_ISSUER: "http://entra-emulator:8443/11111111-1111-1111-1111-111111111111/v2.0"
      # Terminate Livy natively and drive the agent — the whole point.
      FABRIC_SPARK_AGENT_URL: "http://spark-agent:8099"
    healthcheck:
      test: ["CMD", "/usr/local/bin/fabric-emulator", "healthcheck"]
      interval: 3s
      timeout: 2s
      retries: 20

  client:
    image: python:3.12-slim
    depends_on:
      fabric-emulator:
        condition: service_healthy
    volumes:
      - ./client.py:/client.py:ro
    command: ["python3", "/client.py"]
