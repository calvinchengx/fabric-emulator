# e2e: the emulator stack the medallion examples run AGAINST.
#
# There is no client here. The examples are ordinary Python that a reader runs
# on their own machine, so the harness runs them the same way — on the host,
# against this stack over published ports. Containerising the client would test
# a path the README never describes.
#
#   host: uv run python pipeline.py
#     ├── REST      → fabric-emulator  (control plane + OneLake)   :9443
#     ├── TDS       → fabric-emulator  (FedAuth) → SQL Server      :1433
#     ├── vault     → keyvault-emulator                            :8444
#     ├── tokens    → entra-emulator   (every audience)            :8443
#     └── sc://     → sail             (Spark Connect)            :50051
#
# Self-signed TLS is ON, matching ../../docker-compose.yml — the stack a reader
# actually starts. This harness used to run everything over plain HTTP because
# the client lived inside the network and one uniform transport spared five TLS
# stacks their certificate plumbing. That was a real simplification, and it also
# meant CI exercised a transport the documentation never mentions. With the
# client on the host, the documented path is the tested path.
services:
  entra-emulator:
    image: ghcr.io/calvinchengx/entra-emulator:latest
    ports:
      - "8443:8443" # login / graph / discovery (JWKS)
    environment:
      ORIGIN_MODE: compat
      PUBLIC_ORIGIN: "https://entra-emulator:8443"
    healthcheck:
      test: ["CMD", "/usr/local/bin/entra-emulator", "healthcheck"]
      interval: 3s
      timeout: 2s
      retries: 20

  keyvault-emulator:
    image: ghcr.io/calvinchengx/azure-keyvault-emulator:latest
    depends_on:
      entra-emulator:
        condition: service_healthy
    ports:
      - "8444:8444" # Key Vault data plane (AKV references, getSecret)
    environment:
      # Validate bearers against entra's JWKS, over TLS it must be told to trust.
      KV_ENTRA_ISSUER: "https://entra-emulator:8443/11111111-1111-1111-1111-111111111111/v2.0"
      KV_ENTRA_TLS_INSECURE: "true"
      KV_DATA_DIR: "" # in-memory; the e2e needs no persistence
    healthcheck:
      test: ["CMD", "/usr/local/bin/azure-keyvault-emulator", "healthcheck"]
      interval: 3s
      timeout: 2s
      retries: 20

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    # The ONLY amd64-locked service here: Microsoft publishes no arm64 manifest
    # for mssql/server. Pinning the platform states that requirement explicitly
    # instead of relying on each engine's fallback when the host is arm64 —
    # OrbStack and Docker Desktop translate it via Rosetta, but an unpinned pull
    # can also fail outright with "no matching manifest for linux/arm64/v8".
    # No-op on an amd64 host (CI), so it costs nothing there.
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Str0ng!Passw0rd"
    healthcheck:
      test:
        - CMD
        - /opt/mssql-tools18/bin/sqlcmd
        - -S
        - localhost
        - -U
        - sa
        - -P
        - "Str0ng!Passw0rd"
        - -C
        - -Q
        - "SELECT 1"
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  fabric-emulator:
    build:
      context: ../..
      dockerfile: Dockerfile
    depends_on:
      entra-emulator:
        condition: service_healthy
      keyvault-emulator:
        condition: service_healthy
    ports:
      - "9443:9443" # api.fabric + onelake.dfs + portal
      - "1433:1433" # warehouse T-SQL/TDS (FedAuth)
    environment:
      FABRIC_DATA_DIR: "" # in-memory
      FABRIC_ENTRA_ISSUER: "https://entra-emulator:8443/11111111-1111-1111-1111-111111111111/v2.0"
      FABRIC_ENTRA_JWKS_URL: "https://entra-emulator:8443/11111111-1111-1111-1111-111111111111/discovery/v2.0/keys"
      FABRIC_ENTRA_TLS_INSECURE: "true"
      # The TDS warehouse surface, relaying to the SQL Server sidecar. Generous
      # timeouts: creating + starting a per-item database on first connect is
      # slow, and the backend must not give up before it comes online.
      FABRIC_SQL_TDS_ADDR: ":1433"
      FABRIC_WAREHOUSE_SQL_URL: "server=sqlserver;user id=sa;password=Str0ng!Passw0rd;encrypt=disable;dial timeout=90;connection timeout=90"
      # The Livy statement executor. The PySpark examples do not need it — they
      # drive Spark Connect directly — but the dbt-fabricspark ones do: their
      # silver models run over the Livy High-Concurrency surface, and the
      # emulator terminates that protocol and hands statements to this agent.
      # Without it, `HC session acquire` fails.
      FABRIC_SPARK_AGENT_URL: "http://spark-agent:8099"
    healthcheck:
      test: ["CMD", "/usr/local/bin/fabric-emulator", "healthcheck"]
      interval: 3s
      timeout: 2s
      retries: 20

  # A real Spark engine (LakeSail's Sail — Rust Spark Connect, no JVM). The
  # emulator never executes notebooks itself: it parses them into cells and
  # records a Pending run, and an engine executes those cells and reports back.
  # Without this, a notebook hop could only be play-acted by the client.
  sail:
    build:
      context: ../..
      dockerfile: docker/sail/Dockerfile
    depends_on:
      fabric-emulator:
        condition: service_healthy
    ports:
      - "50051:50051" # Spark Connect (h2c gRPC), for the host-run example
    environment:
      ENTRA_TOKEN_URL: "https://entra-emulator:8443/11111111-1111-1111-1111-111111111111/oauth2/v2.0/token"
      ENTRA_CLIENT_ID: "cccccccc-0000-0000-0000-000000000002"
      ENTRA_CLIENT_SECRET: "daemon-app-secret"
      AZURE_STORAGE_ACCOUNT_NAME: "onelake"
      AZURE_STORAGE_ENDPOINT: "https://fabric-emulator:9443/onelake"
      AZURE_ALLOW_INVALID_CERTIFICATES: "true" # the stack's self-signed TLS
      SAIL_SPARK__SESSION_TIMEOUT_SECS: "3600"
      RUST_LOG: "info"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import socket; socket.create_connection(('127.0.0.1', 50051), 2).close()"]
      interval: 5s
      timeout: 3s
      retries: 20

  # The Livy statement executor: the emulator terminates the Livy REST protocol
  # itself and drives this agent, which runs statements on Sail. Only the
  # dbt-fabricspark examples reach it — the PySpark ones talk Spark Connect to
  # Sail directly — but it must be here for those two to work at all.
  spark-agent:
    # PROFILED, deliberately. Only the dbt-fabricspark examples reach the Livy
    # surface; the PySpark ones drive Spark Connect directly and never touch it.
    # The agent is not idle when running — it opens its own SparkSession against
    # Sail — and on a two-core runner that cost the PySpark legs dearly:
    # lakehouse reflection of 100k x 101 went from 3m10s to over 12 minutes and
    # timed out. A service that one example needs must not tax the others.
    profiles: ["livy"]
    build:
      context: ../..
      dockerfile: docker/python-runtime/Dockerfile
      args: { UV_GROUP: sail-delta }
    depends_on:
      sail:
        condition: service_healthy
    volumes:
      - ../../e2e/livy:/livy:ro
    environment:
      SPARK_REMOTE: "sc://sail:50051"
      # delta-rs reaches OneLake on its own account: a Connect client cannot
      # read back the bearer Sail holds, so the agent mints its own from the
      # same issuer with the same Storage audience.
      ENTRA_TOKEN_URL: "https://entra-emulator:8443/11111111-1111-1111-1111-111111111111/oauth2/v2.0/token"
      ENTRA_FORGE_URL: "https://entra-emulator:8443/admin/api/tokens"
      ENTRA_CLIENT_ID: "cccccccc-0000-0000-0000-000000000002"
      ENTRA_CLIENT_SECRET: "daemon-app-secret"
      AZURE_STORAGE_ACCOUNT_NAME: "onelake"
      AZURE_STORAGE_ENDPOINT: "https://fabric-emulator:9443/onelake"
      AZURE_ALLOW_INVALID_CERTIFICATES: "true" # the stack's self-signed TLS
    command: python /livy/agent.py
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8099/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s

  # ---- OpenMetadata, profile-gated ---------------------------------------
  # Copied from the root compose, as the rest of this file is: a harness that
  # reaches into another compose file is a harness that breaks when that file
  # moves. Nothing here starts without `--profile governance`, so the three
  # medallion suites that do not catalogue pay nothing for it.
  om-postgresql:
    profiles: [governance]
    image: docker.getcollate.io/openmetadata/postgresql:1.13.2
    command: "--work_mem=10MB"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - om-db-data:/var/lib/postgresql/data
    healthcheck:
      test: psql -U postgres -tAc 'select 1' -d openmetadata_db
      interval: 15s
      timeout: 10s
      retries: 10

  om-opensearch:
    profiles: [governance]
    # Mirrors OpenMetadata's own docker-compose-opensearch-standalone.yml,
    # with ONE deviation: upstream asks -Xms2g -Xmx4g, which is a lot to
    # reserve in a dev-loop stack whose quickstart already asks for 8 GB. 1 GB
    # matches what the Elasticsearch service used here and is enough for the
    # governance e2e's catalog; raise it if you index a real estate.
    image: opensearchproject/opensearch:3.4.0
    environment:
      - discovery.type=single-node
      - OPENSEARCH_JAVA_OPTS=-Xms1024m -Xmx1024m
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
    volumes:
      - om-search-data:/usr/share/opensearch/data
    healthcheck:
      test: "curl -s http://localhost:9200/_cluster/health?pretty | grep status | grep -qE 'green|yellow' || exit 1"
      interval: 15s
      timeout: 10s
      retries: 10

  om-migrate:
    profiles: [governance]
    image: docker.getcollate.io/openmetadata/server:1.13.2
    command: "./bootstrap/openmetadata-ops.sh migrate"
    environment:
      DB_HOST: om-postgresql
      # The server image defaults to MySQL; these flip it to the Postgres
      # sidecar (same values as OM's quickstart-postgres compose).
      DB_PORT: "5432"
      DB_SCHEME: postgresql
      DB_DRIVER_CLASS: org.postgresql.Driver
      DB_PARAMS: "allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC"
      # SEARCH_TYPE picks the backend; the CONNECTION vars stay
      # ELASTICSEARCH_*-prefixed for both, which is OpenMetadata's naming, not a
      # copy/paste slip — there is no OPENSEARCH_HOST. Setting one silently does
      # nothing and the server falls back to localhost:9200.
      SEARCH_TYPE: opensearch
      ELASTICSEARCH_HOST: om-opensearch
    depends_on:
      om-postgresql:
        condition: service_healthy
      om-opensearch:
        condition: service_healthy

  openmetadata:
    profiles: [governance]
    image: docker.getcollate.io/openmetadata/server:1.13.2
    ports:
      - "8585:8585" # UI + API (seeded basic-auth admin)
    environment:
      DB_HOST: om-postgresql
      # The server image defaults to MySQL; these flip it to the Postgres
      # sidecar (same values as OM's quickstart-postgres compose).
      DB_PORT: "5432"
      DB_SCHEME: postgresql
      DB_DRIVER_CLASS: org.postgresql.Driver
      DB_PARAMS: "allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC"
      # SEARCH_TYPE picks the backend; the CONNECTION vars stay
      # ELASTICSEARCH_*-prefixed for both, which is OpenMetadata's naming, not a
      # copy/paste slip — there is no OPENSEARCH_HOST. Setting one silently does
      # nothing and the server falls back to localhost:9200.
      SEARCH_TYPE: opensearch
      ELASTICSEARCH_HOST: om-opensearch
    depends_on:
      om-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8586/healthcheck"]
      interval: 15s
      timeout: 10s
      retries: 20

  # One-shot: walk the emulator (workspaces → lakehouses → Delta tables, schemas
  # read from real OneLake bytes) and upsert the catalog into OpenMetadata.
  # Idempotent — rerun after pipeline runs to refresh.
  #   docker compose run --rm govern-ingest

volumes:
  om-db-data:
  om-search-data:
