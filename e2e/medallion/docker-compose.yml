# e2e: the full medallion tutorial (docs/28-tutorial-end-to-end.md) running for
# real — Entra tokens, a Key Vault secret behind an AKV-reference connection,
# landing → bronze → silver in OneLake Delta, silver → gold with Microsoft's
# dbt-fabric over TDS, and a semantic model queried through executeQueries.
#
#   pipeline (pandas + delta-rs + ODBC Driver 18 + dbt-fabric)
#     ├── REST      → fabric-emulator (control plane + OneLake)
#     ├── TDS/1433  → fabric-emulator (FedAuth) → SQL Server sidecar
#     ├── vault     → keyvault-emulator
#     └── tokens    → entra-emulator (every audience)
#
# Plain HTTP throughout — entra, Key Vault, and fabric all run with TLS off, as
# the other containerized e2e harnesses do. This is a *test-harness* choice, not
# a claim about the product: the default developer stack (../../docker-compose.yml)
# keeps self-signed TLS on precisely because it mirrors production Azure trust.
# Here the stack is ephemeral and network-isolated, and one uniform transport
# means none of the five TLS stacks in play (Go, Python/requests, rustls behind
# delta-rs, OpenSSL behind unixodbc, SQL Server) needs a CA distributed into it.
services:
  entra-emulator:
    image: ghcr.io/calvinchengx/entra-emulator:latest
    environment:
      ORIGIN_MODE: compat
      TLS_ENABLED: "false"
      PORT: "8443"
      PUBLIC_ORIGIN: "http://entra-emulator:8443"
    healthcheck:
      test: ["CMD", "/usr/local/bin/entra-emulator", "healthcheck"]
      interval: 3s
      timeout: 2s
      retries: 20

  keyvault-emulator:
    image: ghcr.io/calvinchengx/azure-keyvault-emulator:latest
    depends_on:
      entra-emulator:
        condition: service_healthy
    # -disable-tls, matching entra and fabric below: one transport for the whole
    # harness, so no client needs certificate plumbing or an insecure-skip flag.
    command: ["-disable-tls", "-entra-issuer",
              "http://entra-emulator:8443/11111111-1111-1111-1111-111111111111/v2.0"]
    environment:
      KV_DATA_DIR: "" # in-memory; the e2e needs no persistence
    healthcheck:
      test: ["CMD", "/usr/local/bin/azure-keyvault-emulator", "healthcheck"]
      interval: 3s
      timeout: 2s
      retries: 20

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    # The ONLY amd64-locked service here: Microsoft publishes no arm64 manifest
    # for mssql/server. Pinning the platform states that requirement explicitly
    # instead of relying on each engine's fallback when the host is arm64 —
    # OrbStack and Docker Desktop translate it via Rosetta, but an unpinned pull
    # can also fail outright with "no matching manifest for linux/arm64/v8".
    # No-op on an amd64 host (CI), so it costs nothing there.
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Str0ng!Passw0rd"
    healthcheck:
      test:
        - CMD
        - /opt/mssql-tools18/bin/sqlcmd
        - -S
        - localhost
        - -U
        - sa
        - -P
        - "Str0ng!Passw0rd"
        - -C
        - -Q
        - "SELECT 1"
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  fabric-emulator:
    build:
      context: ../..
      dockerfile: Dockerfile
    depends_on:
      entra-emulator:
        condition: service_healthy
      keyvault-emulator:
        condition: service_healthy
    environment:
      FABRIC_ADDR: ":80"
      FABRIC_DISABLE_TLS: "true"
      FABRIC_DATA_DIR: "" # in-memory
      FABRIC_ENTRA_ISSUER: "http://entra-emulator:8443/11111111-1111-1111-1111-111111111111/v2.0"
      # The TDS warehouse surface, relaying to the SQL Server sidecar. Generous
      # timeouts: creating + starting a per-item database on first connect is
      # slow, and the backend must not give up before it comes online.
      FABRIC_SQL_TDS_ADDR: ":1433"
      FABRIC_WAREHOUSE_SQL_URL: "server=sqlserver;user id=sa;password=Str0ng!Passw0rd;encrypt=disable;dial timeout=90;connection timeout=90"
    healthcheck:
      test: ["CMD", "/usr/local/bin/fabric-emulator", "healthcheck"]
      interval: 3s
      timeout: 2s
      retries: 20

  # A real Spark engine (LakeSail's Sail — Rust Spark Connect, no JVM). The
  # emulator never executes notebooks itself: it parses them into cells and
  # records a Pending run, and an engine executes those cells and reports back.
  # Without this, a notebook hop could only be play-acted by the client.
  sail:
    build:
      context: ../..
      dockerfile: docker/sail/Dockerfile
    depends_on:
      fabric-emulator:
        condition: service_healthy
    environment:
      ENTRA_TOKEN_URL: "http://entra-emulator:8443/11111111-1111-1111-1111-111111111111/oauth2/v2.0/token"
      ENTRA_CLIENT_ID: "cccccccc-0000-0000-0000-000000000002"
      ENTRA_CLIENT_SECRET: "daemon-app-secret"
      AZURE_STORAGE_ACCOUNT_NAME: "onelake"
      AZURE_STORAGE_ENDPOINT: "http://fabric-emulator:80/onelake"
      AZURE_ALLOW_HTTP: "true"
      SAIL_SPARK__SESSION_TIMEOUT_SECS: "3600"
      RUST_LOG: "info"

  # Runs examples/medallion unmodified — the same scripts the tutorial teaches.
  # Only the endpoints differ (compose service names, plain HTTP), supplied by
  # the environment the example already reads.
  pipeline:
    build:
      context: ../..
      dockerfile: e2e/medallion/Dockerfile.pipeline
    depends_on:
      fabric-emulator:
        condition: service_healthy
      sqlserver:
        condition: service_healthy
      sail:
        condition: service_started
    environment:
      # The example drives notebook cells onto Sail over Spark Connect, the same
      # engine role e2e/notebook-run plays.
      SPARK_REMOTE: "sc://sail:50051"
      ENTRA_URL: "http://entra-emulator:8443"
      KV_URL: "http://keyvault-emulator:8444"
      FABRIC_REST_URL: "http://fabric-emulator:80"
      TDS_SERVER: "fabric-emulator,1433"
      # Fabric resolves the AKV reference server-side, so the vault URI it
      # stores must be reachable from the fabric container — not from here.
      KV_INTERNAL_URL: "http://keyvault-emulator:8444"
