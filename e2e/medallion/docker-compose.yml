# e2e: the emulator stack the medallion examples run AGAINST.
#
# There is no client here. The examples are ordinary Python that a reader runs
# on their own machine, so the harness runs them the same way — on the host,
# against this stack over published ports. Containerising the client would test
# a path the README never describes.
#
#   host: uv run python pipeline.py
#     ├── REST      → fabric-emulator  (control plane + OneLake)   :9443
#     ├── TDS       → fabric-emulator  (FedAuth) → SQL Server      :1433
#     ├── vault     → keyvault-emulator                            :8444
#     ├── tokens    → entra-emulator   (every audience)            :8443
#     └── sc://     → sail             (Spark Connect)            :50051
#
# Self-signed TLS is ON, matching ../../docker-compose.yml — the stack a reader
# actually starts. This harness used to run everything over plain HTTP because
# the client lived inside the network and one uniform transport spared five TLS
# stacks their certificate plumbing. That was a real simplification, and it also
# meant CI exercised a transport the documentation never mentions. With the
# client on the host, the documented path is the tested path.
services:
  entra-emulator:
    image: ghcr.io/calvinchengx/entra-emulator:${ENTRA_EMULATOR_VERSION:-0.4.1}
    ports:
      - "8443:8443" # login / graph / discovery (JWKS)
    environment:
      ORIGIN_MODE: compat
      PUBLIC_ORIGIN: "https://entra-emulator:8443"
    healthcheck:
      test: ["CMD", "/usr/local/bin/entra-emulator", "healthcheck"]
      interval: 3s
      timeout: 2s
      retries: 20

  keyvault-emulator:
    image: ghcr.io/calvinchengx/azure-keyvault-emulator:${KEYVAULT_EMULATOR_VERSION:-0.6.0}
    depends_on:
      entra-emulator:
        condition: service_healthy
    ports:
      - "8444:8444" # Key Vault data plane (AKV references, getSecret)
    environment:
      # Validate bearers against entra's JWKS, over TLS it must be told to trust.
      KV_ENTRA_ISSUER: "https://entra-emulator:8443/6f89cf12-978b-4d23-ac18-9ef0c127cf87/v2.0"
      KV_ENTRA_TLS_INSECURE: "true"
      KV_DATA_DIR: "" # in-memory; the e2e needs no persistence
    healthcheck:
      test: ["CMD", "/usr/local/bin/azure-keyvault-emulator", "healthcheck"]
      interval: 3s
      timeout: 2s
      retries: 20

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    # The ONLY amd64-locked service here: Microsoft publishes no arm64 manifest
    # for mssql/server. Pinning the platform states that requirement explicitly
    # instead of relying on each engine's fallback when the host is arm64 —
    # OrbStack and Docker Desktop translate it via Rosetta, but an unpinned pull
    # can also fail outright with "no matching manifest for linux/arm64/v8".
    # No-op on an amd64 host (CI), so it costs nothing there.
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Str0ng!Passw0rd"
      # Same cap as docker-compose.override.yml — 2048 is the engine's floor.
      # Capping only the dev stack would leave CI exercising a configuration
      # nobody runs, which is the wrong way round for a memory limit.
      MSSQL_MEMORY_LIMIT_MB: "2048"
    healthcheck:
      test:
        - CMD
        - /opt/mssql-tools18/bin/sqlcmd
        - -S
        - localhost
        - -U
        - sa
        - -P
        - "Str0ng!Passw0rd"
        - -C
        - -Q
        - "SELECT 1"
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  fabric-emulator:
    build:
      context: ../..
      dockerfile: Dockerfile
    depends_on:
      entra-emulator:
        condition: service_healthy
      keyvault-emulator:
        condition: service_healthy
    ports:
      - "9443:9443" # api.fabric + onelake.dfs + portal
      - "1433:1433" # warehouse T-SQL/TDS (FedAuth)
    environment:
      FABRIC_DATA_DIR: "" # in-memory
      FABRIC_ENTRA_ISSUER: "https://entra-emulator:8443/6f89cf12-978b-4d23-ac18-9ef0c127cf87/v2.0"
      # AzureKeyVaultReference resolves only against this host and Azure's own
      # *.vault.azure.net. It is a security boundary, not a convenience:
      # resolving sends a vault-audience bearer token to the host the
      # connection names, so an unlisted one would be a token leak.
      FABRIC_AKV_VAULT_HOST: "keyvault-emulator:8444"
      FABRIC_ENTRA_JWKS_URL: "https://entra-emulator:8443/6f89cf12-978b-4d23-ac18-9ef0c127cf87/discovery/v2.0/keys"
      FABRIC_ENTRA_TLS_INSECURE: "true"
      # The TDS warehouse surface, relaying to the SQL Server sidecar. Generous
      # timeouts: creating + starting a per-item database on first connect is
      # slow, and the backend must not give up before it comes online.
      FABRIC_SQL_TDS_ADDR: ":1433"
      FABRIC_WAREHOUSE_SQL_URL: "server=sqlserver;user id=sa;password=Str0ng!Passw0rd;encrypt=disable;dial timeout=90;connection timeout=90"
      # The Livy statement executor. The PySpark examples do not need it — they
      # drive Spark Connect directly — but the dbt-fabricspark ones do: their
      # silver models run over the Livy High-Concurrency surface, and the
      # emulator terminates that protocol and hands statements to this agent.
      # Without it, `HC session acquire` fails.
      FABRIC_SPARK_AGENT_URL: "http://spark-agent:8099"
    healthcheck:
      test: ["CMD", "/usr/local/bin/fabric-emulator", "healthcheck"]
      interval: 3s
      timeout: 2s
      retries: 20

  # A real Spark engine (LakeSail's Sail — Rust Spark Connect, no JVM). The
  # emulator parses notebooks into cells but cannot run Spark itself, so it
  # drives them through the Spark agent onto Sail — synchronously, because
  # Fabric's notebook activity is. Without this, a notebook hop could only be
  # play-acted by the client.
  sail:
    build:
      context: ../..
      dockerfile: docker/sail/Dockerfile
    depends_on:
      fabric-emulator:
        condition: service_healthy
    ports:
      - "50051:50051" # Spark Connect (h2c gRPC), for the host-run example
    environment:
      ENTRA_TOKEN_URL: "https://entra-emulator:8443/6f89cf12-978b-4d23-ac18-9ef0c127cf87/oauth2/v2.0/token"
      ENTRA_CLIENT_ID: "00d88624-f0d7-46f6-a641-6232c2608928"
      ENTRA_CLIENT_SECRET: "daemon-app-secret"
      AZURE_STORAGE_ACCOUNT_NAME: "onelake"
      AZURE_STORAGE_ENDPOINT: "https://fabric-emulator:9443/onelake"
      AZURE_ALLOW_INVALID_CERTIFICATES: "true" # the stack's self-signed TLS
      SAIL_SPARK__SESSION_TIMEOUT_SECS: "3600"
      RUST_LOG: "info"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import socket; socket.create_connection(('127.0.0.1', 50051), 2).close()"]
      interval: 5s
      timeout: 3s
      retries: 20

  # The Livy statement executor: the emulator terminates the Livy REST protocol
  # itself and drives this agent, which runs statements on Sail. Only the
  # dbt-fabricspark examples reach it — the PySpark ones talk Spark Connect to
  # Sail directly — but it must be here for those two to work at all.
  spark-agent:
    # PROFILED so a stack that does not want it can leave it out, but EVERY
    # medallion leg asks for it now: the notebook activity is synchronous and
    # the emulator drives the run through this agent.
    #
    # It used to be kept away from the PySpark legs because it "cost the
    # PySpark legs dearly: lakehouse reflection of 100k x 101 went from 3m10s
    # to over 12 minutes and timed out". That was measured in ece5e17, which
    # ALSO fixed an `_rn` projection bug — and the projection was the cause.
    # Re-measured on CI with every leg running the agent: 5m -> 5m, 9m -> 10m.
    profiles: ["livy"]
    build:
      context: ../..
      dockerfile: docker/spark-agent/Dockerfile
    depends_on:
      sail:
        condition: service_healthy
    # No mount, no command: the agent ships in the image.
    environment:
      SPARK_REMOTE: "sc://sail:50051"
      # delta-rs reaches OneLake on its own account: a Connect client cannot
      # read back the bearer Sail holds, so the agent mints its own from the
      # same issuer with the same Storage audience.
      ENTRA_TOKEN_URL: "https://entra-emulator:8443/6f89cf12-978b-4d23-ac18-9ef0c127cf87/oauth2/v2.0/token"
      ENTRA_FORGE_URL: "https://entra-emulator:8443/admin/api/tokens"
      ENTRA_CLIENT_ID: "00d88624-f0d7-46f6-a641-6232c2608928"
      ENTRA_CLIENT_SECRET: "daemon-app-secret"
      AZURE_STORAGE_ACCOUNT_NAME: "onelake"
      AZURE_STORAGE_ENDPOINT: "https://fabric-emulator:9443/onelake"
      AZURE_ALLOW_INVALID_CERTIFICATES: "true" # the stack's self-signed TLS
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8099/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s
