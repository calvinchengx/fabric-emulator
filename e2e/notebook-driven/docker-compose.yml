# A Fabric notebook run with NO runner in the stack.
#
# This is `e2e/notebook-run` with one service deleted. There, a `spark` service
# polls the parsed cells, executes them, and POSTs results back — a real engine
# reporting to the service, which is how Fabric works and remains the primary
# path. But that runner is an e2e script that ships in no artifact, so a
# consumer holding only the published images had no way to run a notebook at
# all: the job parked forever waiting for an engine that could not exist.
#
# What is left here is exactly what a consumer HAS — the emulator, Sail, and the
# published spark-agent — and the point of the test is that it is enough. The
# emulator drives the agent itself (internal/api/notebookdrive.go).
#
# The client only publishes, submits and asserts. If it executed anything, the
# test would prove nothing.
services:
  entra-emulator:
    image: ghcr.io/calvinchengx/entra-emulator:latest
    environment:
      # entra >=v0.4.0 seeds a different tenant by default; pin the one
      # this suite's issuer URLs name, or discovery 404s.
      TENANT_ID: "11111111-1111-1111-1111-111111111111"
      ORIGIN_MODE: compat
      TLS_ENABLED: "false"
      PORT: "8443"
      PUBLIC_ORIGIN: "http://entra-emulator:8443"
    healthcheck:
      test: ["CMD", "/usr/local/bin/entra-emulator", "healthcheck"]
      interval: 3s
      timeout: 2s
      retries: 20

  fabric-emulator:
    build:
      context: ../..
      dockerfile: Dockerfile
    depends_on:
      entra-emulator:
        condition: service_healthy
    environment:
      FABRIC_ADDR: ":80"
      FABRIC_DATA_DIR: "" # in-memory; the e2e needs no persistence
      FABRIC_DISABLE_TLS: "true"
      FABRIC_ENTRA_ISSUER: "http://entra-emulator:8443/11111111-1111-1111-1111-111111111111/v2.0"
      # THE WHOLE CONFIGURATION. One variable turns a stack that can only park
      # notebook jobs into one that runs them.
      FABRIC_SPARK_AGENT_URL: "http://spark-agent:8099"
    networks:
      default:
        aliases:
          - onelake.dfs.fabric.microsoft.com
          - api.fabric.microsoft.com
    healthcheck:
      test: ["CMD", "/usr/local/bin/fabric-emulator", "healthcheck"]
      interval: 3s
      timeout: 2s
      retries: 20

  sail:
    build:
      context: ../..
      dockerfile: docker/sail/Dockerfile
    depends_on:
      fabric-emulator:
        condition: service_healthy
    environment:
      ENTRA_TOKEN_URL: "http://entra-emulator:8443/11111111-1111-1111-1111-111111111111/oauth2/v2.0/token"
      ENTRA_CLIENT_ID: "cccccccc-0000-0000-0000-000000000002"
      ENTRA_CLIENT_SECRET: "daemon-app-secret"
      AZURE_STORAGE_ACCOUNT_NAME: "onelake"
      AZURE_STORAGE_ENDPOINT: "http://fabric-emulator/onelake"
      AZURE_ALLOW_HTTP: "true"
      SAIL_SPARK__SESSION_TIMEOUT_SECS: "3600"
      RUST_LOG: "info"

  # Built from its own Dockerfile, with no bind mount and no command — the
  # published image, as a consumer would get it.
  spark-agent:
    build:
      context: ../..
      dockerfile: docker/spark-agent/Dockerfile
    depends_on:
      sail:
        condition: service_started
    environment:
      SPARK_REMOTE: "sc://sail:50051"
      ENTRA_TOKEN_URL: "http://entra-emulator:8443/11111111-1111-1111-1111-111111111111/oauth2/v2.0/token"
      ENTRA_CLIENT_ID: "cccccccc-0000-0000-0000-000000000002"
      ENTRA_CLIENT_SECRET: "daemon-app-secret"
      AZURE_STORAGE_ACCOUNT_NAME: "onelake"
      AZURE_STORAGE_ENDPOINT: "http://fabric-emulator/onelake"
      AZURE_ALLOW_HTTP: "true"
    # `started` is not `listening`. The agent builds a Spark session before it
    # binds, so a client that submits a job the moment the container exists gets
    # `connection refused` on cell 0 — which the emulator correctly reports as a
    # failed run, making a startup race look like a broken feature.
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8099/health', timeout=3)"]
      interval: 3s
      timeout: 5s
      retries: 40

  client:
    build:
      context: ../..
      dockerfile: docker/python-runtime/Dockerfile
      args: { UV_GROUP: spark-connect }
    depends_on:
      fabric-emulator:
        condition: service_healthy
      spark-agent:
        condition: service_healthy
    volumes:
      - ./client.py:/client.py:ro
    command: python /client.py
