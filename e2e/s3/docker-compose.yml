# External-store witness: a real S3 server (SeaweedFS) behind a OneLake
# shortcut. The point is that nothing here is anonymous — SeaweedFS is started
# with an identity config, so every request must carry a valid AWS SigV4
# signature. An unsigned or wrongly-signed request gets 403, which is what
# makes this a real test of the emulator's signer rather than of plain HTTP.
services:
  entra-emulator:
    image: ghcr.io/calvinchengx/entra-emulator:${ENTRA_EMULATOR_VERSION:-0.7.0}
    environment:
      ORIGIN_MODE: compat
      TLS_ENABLED: "false"
      PORT: "8443"
      PUBLIC_ORIGIN: "http://entra-emulator:8443"
    healthcheck:
      test: ["CMD", "/usr/local/bin/entra-emulator", "healthcheck"]
      interval: 3s
      timeout: 2s
      retries: 20

  # Apache-2.0, actively maintained, multi-arch. Deliberately NOT MinIO or
  # LocalStack — both repos were archived in 2026 (see docs/24).
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    command: >-
      server -dir=/data -s3 -s3.port=8333
      -s3.config=/etc/seaweedfs/s3.json -ip=seaweedfs
    volumes:
      - ./seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
    # No healthcheck: the image has no predictable probe tool, and a refused
    # anonymous request (the correct behaviour here) reads as failure to most
    # of them. The witness waits for the S3 port itself instead.

  fabric-emulator:
    build:
      context: ../..
      dockerfile: Dockerfile
    depends_on:
      entra-emulator:
        condition: service_healthy
      seaweedfs:
        condition: service_started
    environment:
      FABRIC_ADDR: ":80"
      FABRIC_DATA_DIR: ""
      FABRIC_DISABLE_TLS: "true"
      FABRIC_ENTRA_ISSUER: "http://entra-emulator:8443/6f89cf12-978b-4d23-ac18-9ef0c127cf87/v2.0"
    healthcheck:
      test: ["CMD", "/usr/local/bin/fabric-emulator", "healthcheck"]
      interval: 3s
      timeout: 2s
      retries: 20

  witness:
    build:
      context: ../..
      dockerfile: docker/python-runtime/Dockerfile
      args: { UV_GROUP: s3 }
    depends_on:
      fabric-emulator:
        condition: service_healthy
    volumes:
      - ./driver.py:/driver.py:ro
    environment:
      FABRIC: "http://fabric-emulator"
      ENTRA: "http://entra-emulator:8443"
      S3_ENDPOINT: "http://seaweedfs:8333"
      S3_ACCESS_KEY: "FABRICACCESSKEY"
      S3_SECRET_KEY: "FABRICSECRETKEY0123456789"
    command: python /driver.py
