# e2e S0: LakeSail's Sail (Rust Spark-Connect server, no JVM) writes and reads
# a Delta table through fabric-emulator's OneLake plane.
#
# Storage routing is the azurite recipe delta-rs already proved: az://{ws}/…
# URLs + AZURE_STORAGE_ENDPOINT={fabric}/onelake (the account-prefixed Blob
# path form), AZURE_ALLOW_HTTP for the plain-HTTP container network. Auth is a
# real client-credentials grant against entra-emulator, minted by the sail
# image's launcher BEFORE the server starts — object_store reads credentials
# from process env only.
services:
  entra-emulator:
    image: ghcr.io/calvinchengx/entra-emulator:${ENTRA_EMULATOR_VERSION:-0.9.0}
    environment:
      ORIGIN_MODE: compat
      TLS_ENABLED: "false"
      PORT: "8443"
      PUBLIC_ORIGIN: "http://entra-emulator:8443"
    healthcheck:
      test: ["CMD", "/usr/local/bin/entra-emulator", "healthcheck"]
      interval: 3s
      timeout: 2s
      retries: 20

  fabric-emulator:
    build:
      context: ../..
      dockerfile: Dockerfile
    depends_on:
      entra-emulator:
        condition: service_healthy
    environment:
      FABRIC_ADDR: ":80"
      FABRIC_DATA_DIR: "" # in-memory; the e2e needs no persistence
      FABRIC_DISABLE_TLS: "true"
      FABRIC_ENTRA_ISSUER: "http://entra-emulator:8443/6f89cf12-978b-4d23-ac18-9ef0c127cf87/v2.0"
      # A materialized lake view's refresh RUNS ITS QUERY on the statement
      # agent, so without this the refresh is an honest 502 ("no engine")
      # rather than a silent success. That 502 is what this suite hit the first
      # time the MLV witness ran here.
      FABRIC_SPARK_AGENT_URL: "http://spark-agent:8099"
    healthcheck:
      test: ["CMD", "/usr/local/bin/fabric-emulator", "healthcheck"]
      interval: 3s
      timeout: 2s
      retries: 20

  sail:
    build:
      context: ../..
      dockerfile: docker/sail/Dockerfile
    depends_on:
      fabric-emulator:
        condition: service_healthy
    environment:
      # The launcher mints AZURE_STORAGE_TOKEN from entra before exec'ing sail.
      ENTRA_TOKEN_URL: "http://entra-emulator:8443/6f89cf12-978b-4d23-ac18-9ef0c127cf87/oauth2/v2.0/token"
      ENTRA_CLIENT_ID: "00d88624-f0d7-46f6-a641-6232c2608928"
      ENTRA_CLIENT_SECRET: "daemon-app-secret"
      # object_store → the emulator's account-prefixed Blob surface.
      AZURE_STORAGE_ACCOUNT_NAME: "onelake"
      AZURE_STORAGE_ENDPOINT: "http://fabric-emulator/onelake"
      AZURE_ALLOW_HTTP: "true"
      # Notebook-friendly session lifetime (default is 900s).
      SAIL_SPARK__SESSION_TIMEOUT_SECS: "3600"
      RUST_LOG: "info"

  # The statement agent, which is how the emulator drives Sail for the surfaces
  # that execute a query rather than proxy one. Added for the MLV refresh; Sail
  # and its OneLake credentials above are unchanged and already proven by the
  # Delta writes earlier in this suite.
  spark-agent:
    build:
      context: ../..
      dockerfile: docker/spark-agent/Dockerfile
    depends_on:
      sail:
        condition: service_started
    environment:
      SPARK_REMOTE: "sc://sail:50051"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8099/health', timeout=3)"]
      interval: 3s
      timeout: 3s
      retries: 40

  driver:
    build:
      context: ../..
      dockerfile: docker/python-runtime/Dockerfile
      args: { UV_GROUP: spark-connect }
    depends_on:
      sail:
        condition: service_started
      fabric-emulator:
        condition: service_healthy
    volumes:
      - ./driver.py:/driver.py:ro
    environment:
      SPARK_REMOTE: "sc://sail:50051"
      FABRIC: "http://fabric-emulator"
      ENTRA: "http://entra-emulator:8443"
      # Per-step hang budget for driver.py's watchdog. Overridable so the guard
      # itself can be exercised (set it to a fraction of a second and the run
      # must die naming the step it was in, not pass anyway).
      SAIL_E2E_STEP_BUDGET: "${SAIL_E2E_STEP_BUDGET:-180}"
    command: python /driver.py
