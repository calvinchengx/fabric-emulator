# Optional Apache Spark oracle aligned with Fabric Runtime 1.3 (Spark 3.5.5,
# Delta 3.2, Java 11). This is deliberately separate from the default Sail compose.
services:
  entra-emulator:
    image: ghcr.io/calvinchengx/entra-emulator:${ENTRA_EMULATOR_VERSION:-0.7.0}
    environment:
      ORIGIN_MODE: compat
      TLS_ENABLED: "false"
      PORT: "8443"
      PUBLIC_ORIGIN: "http://entra-emulator:8443"
    healthcheck:
      test: ["CMD", "/usr/local/bin/entra-emulator", "healthcheck"]
      interval: 3s
      timeout: 2s
      retries: 20

  fabric-emulator:
    build:
      context: ../..
      dockerfile: Dockerfile
    depends_on:
      entra-emulator:
        condition: service_healthy
    environment:
      FABRIC_ADDR: ":80"
      FABRIC_DATA_DIR: ""
      FABRIC_DISABLE_TLS: "true"
      FABRIC_ENTRA_ISSUER: "http://entra-emulator:8443/6f89cf12-978b-4d23-ac18-9ef0c127cf87/v2.0"
    networks:
      default:
        aliases:
          - onelake.dfs.fabric.microsoft.com
          - api.fabric.microsoft.com
    healthcheck:
      test: ["CMD", "/usr/local/bin/fabric-emulator", "healthcheck"]
      interval: 3s
      timeout: 2s
      retries: 20

  spark-jvm:
    build:
      context: ../..
      dockerfile: docker/spark-runtime/Dockerfile
    depends_on:
      fabric-emulator:
        condition: service_healthy
    volumes:
      - ./job.py:/opt/spark/work-dir/job.py:ro
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - local[2]
      - /opt/spark/work-dir/job.py
