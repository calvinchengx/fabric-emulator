services:
  entra-emulator:
    image: ghcr.io/calvinchengx/entra-emulator:latest
    environment:
      ORIGIN_MODE: compat
      TLS_ENABLED: "false"
      PORT: "8443"
      PUBLIC_ORIGIN: "http://entra-emulator:8443"
    healthcheck:
      test: ["CMD", "/usr/local/bin/entra-emulator", "healthcheck"]
      interval: 3s
      timeout: 2s
      retries: 30

  fabric-emulator:
    build:
      context: ../..
      dockerfile: Dockerfile
    user: "0:0"
    depends_on:
      entra-emulator:
        condition: service_healthy
    environment:
      FABRIC_ADDR: ":443"
      FABRIC_DATA_DIR: ""
      FABRIC_ENTRA_ISSUER: "http://entra-emulator:8443/11111111-1111-1111-1111-111111111111/v2.0"
    networks:
      default:
        aliases:
          - api.powerbi.com
          - api.fabric.microsoft.com
    healthcheck:
      test: ["CMD", "/usr/local/bin/fabric-emulator", "healthcheck"]
      interval: 3s
      timeout: 2s
      retries: 30

  client:
    build:
      context: ../..
      dockerfile: docker/python-runtime/Dockerfile
      args: { UV_GROUP: runtime }
    depends_on:
      fabric-emulator:
        condition: service_healthy
    volumes:
      - ./witness.py:/witness.py:ro
      - ./extension-contract-1.18.1.json:/extension-contract.json:ro
    command: ["python3", "/witness.py"]
