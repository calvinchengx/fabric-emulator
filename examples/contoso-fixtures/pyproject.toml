# The fixture and the plumbing both medallion examples share.
#
# It is a package rather than a copied file for one specific reason:
# source_system.py is a SEEDED generator, and the comparison between the two
# examples asserts they produced identical silver. Two copies that drifted by a
# single RNG draw would generate different data — and both examples would still
# pass their own EXPECTED_* assertions, because those are computed from their
# own generator. The comparison would report green while comparing two
# different datasets. One generator makes that failure impossible rather than
# merely unlikely.
#
# Each example still owns its own pyproject.toml and uv.lock, and neither
# reaches into the other's directory.
[project]
name = "contoso-fixtures"
version = "0.1.0"
description = "Shared source-system fixture and emulator plumbing for the medallion examples"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32,<3",
    # The target contract, consumed rather than restated. Published from the
    # emulator's release workflow; `make fixtures` installs it alongside these
    # generators. See docs/21-real-fabric-toggle.md and the common.py docstring.
    "fabric-target",
]

# Flat modules, not a package namespace: the examples are tutorial code, and
# `from common import log` reads better in a walkthrough than
# `from contoso_fixtures.common import log`.
[tool.setuptools]
py-modules = ["common", "source_system"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.uv.sources]
fabric-target = { path = "../../python/fabric-target", editable = true }
