# Self-contained: this example owns its dependencies and its lockfile, so it
# can be copied out of the repo and run anywhere, and so its versions never
# enter the emulator's own dependency graph.
#
#   uv sync --frozen && uv run python pipeline.py
#
# Three source systems, resolved into one identity graph, joined into a star.
# bronze -> silver is PySpark; silver -> gold is dbt-fabric over TDS, because
# gold is a WAREHOUSE. Differs from ../medallion-advanced-dbt-fabricspark only
# in the first half.
[project]
name = "fabric-emulator-example-medallion-advanced-pyspark"
version = "0.1.0"
description = "Advanced medallion: three sources, PySpark to silver, dbt-fabric to a Warehouse star"
requires-python = ">=3.12"
dependencies = [
    "contoso-fixtures",
    # The web store and the ERP change log. Depends on contoso-fixtures for the
    # POS generator rather than restating it.
    "contoso-fixtures-advanced",
    "dbt-fabric>=1.11",
    "deltalake>=0.23,<2",
    # MATCHES THE ROOT's RANGE, and both halves of it matter.
    #
    # The ceiling was `<24` while every group in the root pyproject asks for
    # `>=23.0.1,<26`, so the moment Dependabot proposed pyarrow 25.0.1 this
    # project became unsatisfiable:
    #
    #   Because your project depends on pyarrow>=18,<24 and pyarrow==25.0.1,
    #   we can conclude that your project's requirements are unsatisfiable.
    #
    # The floor was `>=18`, which permits 18 through 22 -- inside
    # GHSA-rgxp-2hwp-jwgg (use-after-free reading an IPC file with
    # pre-buffering, vulnerable >=15.0.0,<23.0.1), the advisory the root was
    # floored to 23.0.1 for. An example is the last place to leave that open,
    # because examples are what people copy.
    "pyarrow>=23.0.1,<27",
    "pyodbc>=5.2,<6",
    # PERMANENT HOLD. The exact version is a FIDELITY CLAIM, not a dependency
    # kept current: 4.2.0 is the client pysail 0.7.2 is built and tested
    # against, and the root pyproject's `spark-client` group records the
    # measurement behind it -- an old server cannot take a new client (0.6.6 +
    # 4.2.0 dies in `createDataFrame`). Moving this number alone breaks the
    # engine; it moves when the server does, or not at all. The same class as
    # `apache/spark` in .github/dependabot.yml, whose tag is a claim about
    # Fabric Runtime 1.3 rather than something to keep current.
    "pyspark-client==4.2.0",
    "requests>=2.32,<3",
    # contract_gates.py compiles the ODCS `library` rules in contracts/ into
    # Expectation Suites.
    #
    # DIVERGES FROM ROOT, deliberately and with the reason, because the comment
    # that used to sit here claimed the opposite and was wrong. It said this
    # was `pinned <1 to match the emulator's own great-expectations extra, so
    # the two demonstrations cannot drift onto different major versions of the
    # API` -- while the root pyproject's `great-expectations` group declares
    # `>=0.18,<2` and the root uv.lock resolves 1.23.2 against the 0.18.22
    # locked here. The drift the comment forbade had already happened.
    #
    # The root moved on purpose: e2e/great-expectations/driver.py is written
    # against the 1.x API (`ctx.data_sources`, `add_batch_definition_*`,
    # `batch.validate(gxe....)`). `contract_gate.py` in this example is still
    # on the 0.18 fluent API -- `ctx.sources.add_pandas`,
    # `asset.build_batch_request`,
    # `ctx.get_validator(create_expectation_suite_with_name=...)` -- all of
    # which 1.0 REMOVED. Raising the ceiling here does not bump a version, it
    # breaks the example at runtime, which is measured: the widening to `<2`
    # failed both advanced medallion e2es with
    # `AttributeError: 'EphemeralDataContext' object has no attribute
    # 'sources'`. .github/dependabot.yml holds the major for the same reason.
    #
    # LIFT THIS when contract_gate.py is ported to the 1.x
    # `data_sources`/`batch_definition`/`ValidationDefinition` API, with the
    # deliberate-failure case re-proved on the new result objects -- these
    # gates are a witness surface, so how they assert must not change as a
    # side effect of a dependency bump. There is no upstream change to wait
    # for; the work is the exit condition.
    "great-expectations>=0.18,<1",
    # contract_gate.py reads the ODCS YAML.
    "pyyaml>=6,<7",
]

[tool.uv]
package = false
# sqlparse arrives only through dbt-core, which pins `sqlparse<0.6.0` in every
# published release, so no dbt upgrade reaches the version that patches four
# advisories. Overridden deliberately, and measured: dbt's single sqlparse call
# site (`inject_ctes_into_sql`) returns byte-identical SQL under 0.5.5 and
# 0.6.0. See the root pyproject.toml for the full note; DELETE this once
# dbt-core relaxes the bound.
override-dependencies = ["sqlparse>=0.6.0"]

[tool.uv.sources]
contoso-fixtures = { path = "../contoso-fixtures", editable = true }
# The target contract, resolved from the repo rather than PyPI so an example run
# from a checkout uses the same code the emulator publishes.
fabric-target = { path = "../../python/fabric-target", editable = true }
# The notebookutils shim, from the same checkout: contoso-fixtures depends on it
# so a step can read a secret the way a Fabric notebook does.
fabric-emulator-notebookutils = { path = "../../python", editable = true }
contoso-fixtures-advanced = { path = "../contoso-fixtures-advanced", editable = true }
