# Self-contained: this example owns its dependencies and its lockfile, so it can
# be copied out of the repo and run anywhere.
#
#   uv sync --frozen && uv run python pipeline.py
#
# THREE dbt adapters are here, and that is the shape of the example rather than
# an accident: dbt-fabricspark builds bronze -> silver in the Lakehouse over
# Livy, and dbt-fabric builds silver -> gold in the Warehouse over TDS. Gold is
# a Warehouse, and fabricspark cannot write to one.
#
# dbt-spark is the third, and it is not a second way to do the same thing.
# dbt-fabricspark speaks ONLY Livy -- its one connection method is
# FabricSparkConnectionMethod.LIVY -- so `method: session`, the shape a Fabric
# notebook takes when it runs dbtRunner on the driver, cannot be expressed with
# it at all. silver_session.py builds the SAME models that way, over Spark
# Connect to the same Sail, and exists to separate a defect on the Livy path
# from one in the SQL. See its docstring.
#
# NOT dbt-spark[session], which pulls full pyspark for the JVM. `pyspark-client`
# already provides the `pyspark` namespace and resolves SPARK_REMOTE to a
# Connect session, which is measured: getOrCreate() returns
# pyspark.sql.connect.session and Sail answers it.
[project]
name = "fabric-emulator-example-medallion-dbt-fabricspark"
version = "0.1.0"
description = "Medallion: dbt-fabricspark to silver, dbt-fabric to a Warehouse gold"
requires-python = ">=3.12"
dependencies = [
    "contoso-fixtures",
    "dbt-fabric>=1.11",
    "dbt-fabricspark>=1.13",
    "dbt-spark>=1.11",
    "pyspark-client>=4.1",
    "deltalake>=0.23,<2",
    # MATCHES THE ROOT's RANGE. The ceiling was `<24` while the root asks for
    # `>=23.0.1,<26`, so a pyarrow 25 bump makes this project unsatisfiable;
    # the floor was `>=18`, which permits 18 through 22, inside
    # GHSA-rgxp-2hwp-jwgg (vulnerable >=15.0.0,<23.0.1) that the root was
    # floored to 23.0.1 for. Examples are what people copy.
    "pyarrow>=23.0.1,<26",
    "pyodbc>=5.2,<6",
    "pyspark-client==4.2.0",
    "requests>=2.32,<3",
]

[tool.uv]
package = false
# sqlparse arrives only through dbt-core, which pins `sqlparse<0.6.0` in every
# published release, so no dbt upgrade reaches the version that patches four
# advisories. Overridden deliberately, and measured: dbt's single sqlparse call
# site (`inject_ctes_into_sql`) returns byte-identical SQL under 0.5.5 and
# 0.6.0. See the root pyproject.toml for the full note; DELETE this once
# dbt-core relaxes the bound.
override-dependencies = ["sqlparse>=0.6.0"]

[tool.uv.sources]
contoso-fixtures = { path = "../contoso-fixtures", editable = true }
# The target contract, resolved from the repo rather than PyPI so an example run
# from a checkout uses the same code the emulator publishes.
fabric-target = { path = "../../python/fabric-target", editable = true }
# The notebookutils shim, from the same checkout: contoso-fixtures depends on it
# so a step can read a secret the way a Fabric notebook does.
fabric-emulator-notebookutils = { path = "../../python", editable = true }
