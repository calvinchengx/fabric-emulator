# ODCS v3.1.0 — the PUBLISHED contract for gold.
#
# This is the only layer with a consumer outside the pipeline (the semantic
# model, and Power BI behind it), so it is the layer a data contract is
# actually for. Every `quality` rule below is enforced today by a dbt test in
# gold/models/schema.yml — the mapping is in docs/30-odcs-data-contracts.md.
#
# `physicalType` is deliberately ABSENT on properties: nobody has measured what
# the warehouse reflects these columns as. Declaring a guess would be the kind
# of approximation this repo refuses; the contract checker fills them in from
# INFORMATION_SCHEMA once it exists.
apiVersion: v3.1.0
kind: DataContract
id: 029b449e-d4c4-5a22-8452-924bbdefb05d
name: sales-gold
version: 1.0.0
status: draft
domain: sales
dataProduct: contoso-sales-analytics
tenant: fabric-emulator

description:
  purpose: >-
    The conformed sales star served from the Warehouse: a customer dimension,
    an order-grain fact, and the daily revenue aggregate the semantic model
    reads. This is the layer downstream consumers are entitled to depend on.
  usage: >-
    Query over TDS (FedAuth) against the warehouse database, or through the
    published semantic model with the Power BI `executeQueries` API. Grain is
    stated per object.
  limitations: >-
    Rows quarantined in silver never reach gold — `fct_orders` is the CLEAN
    order set, not the complete one. Reconciliation against the source system
    must use silver's quarantine table as well. Refresh is batch, on pipeline
    run; there is no streaming path.

servers:
  - server: warehouse-tds
    type: sqlserver
    description: >-
      The emulator's T-SQL/TDS warehouse surface. `database` is the warehouse
      item's GUID, which the pipeline creates at run time — hence a
      placeholder rather than a literal.
    environment: dev
    host: localhost
    database: ${WAREHOUSE_ID}
    schema: dbo

schema:
  - name: dim_customer
    logicalType: object
    physicalType: table
    businessName: Customer dimension
    description: Conformed customer dimension, one row per customer.
    dataGranularityDescription: One row per customer_id.
    properties:
      - name: customer_id
        logicalType: string
        businessName: Customer ID
        primaryKey: true
        primaryKeyPosition: 1
        required: true
        unique: true
        criticalDataElement: true
        examples: ["C-001", "C-007"]
        quality:
          - type: library
            metric: duplicateValues
            mustBe: 0
            unit: rows
            dimension: uniqueness
            description: dbt `unique` on dim_customer.customer_id.
          - type: library
            metric: nullValues
            mustBe: 0
            unit: rows
            dimension: completeness
            description: dbt `not_null` on dim_customer.customer_id.
      - name: name
        logicalType: string
        description: Customer display name as supplied by the source system.
      - name: email
        logicalType: string
        description: Lower-cased in silver. May be empty — the source permits it.
        classification: pii
      - name: country
        logicalType: string
        description: ISO-3166 alpha-2, conformed in silver from five source spellings.
        quality:
          - type: library
            metric: nullValues
            mustBe: 0
            unit: rows
            dimension: completeness
            description: dbt `not_null` on dim_customer.country.
          - type: library
            metric: invalidValues
            mustBe: 0
            unit: rows
            dimension: conformity
            arguments:
              validValues: ["US", "GB", "SG"]
            description: >-
              dbt `accepted_values` — silver's conformed domain. Widening this
              list is a contract change, not a transform change.

  - name: fct_orders
    logicalType: object
    physicalType: table
    businessName: Order fact
    description: >-
      Order-grain fact after silver's dedupe. The source emits at-least-once,
      so uniqueness here is a guarantee the pipeline earns, not one it inherits.
    dataGranularityDescription: One row per order_id.
    properties:
      - name: order_id
        logicalType: string
        primaryKey: true
        primaryKeyPosition: 1
        required: true
        unique: true
        criticalDataElement: true
        quality:
          - type: library
            metric: duplicateValues
            mustBe: 0
            unit: rows
            dimension: uniqueness
            description: >-
              dbt `unique` — the at-least-once redelivery of O-1003 must be
              collapsed by the time gold is built.
          - type: library
            metric: nullValues
            mustBe: 0
            unit: rows
            dimension: completeness
      - name: customer_id
        logicalType: string
        required: true
        description: Foreign key to dim_customer.
        quality:
          # ODCS's library has five metrics and referential integrity is not
          # among them, so dbt's `relationships` test can only be expressed as
          # a sql rule. See docs/30-odcs-data-contracts.md.
          - type: sql
            name: orders_resolve_to_a_customer
            query: |
              SELECT COUNT(*) FROM {object} o
              WHERE NOT EXISTS (
                SELECT 1 FROM dim_customer c WHERE c.customer_id = o.customer_id
              )
            mustBe: 0
            dimension: consistency
            businessImpact: operational
            description: dbt `relationships` to ref('dim_customer').
      - name: order_date
        logicalType: date
        description: Date the order was placed, as reported by the source.
      - name: quantity
        logicalType: integer
        description: Units ordered. Non-positive quantities are quarantined in silver.
      - name: amount
        logicalType: number
        description: quantity x unit_price, computed in silver.
        quality:
          - type: library
            metric: nullValues
            mustBe: 0
            unit: rows
            dimension: completeness
            description: dbt `not_null` on fct_orders.amount.

  - name: fct_daily_revenue
    logicalType: object
    physicalType: table
    businessName: Daily revenue
    description: Reporting aggregate — revenue by order date and country.
    dataGranularityDescription: One row per (order_date, country).
    quality:
      - type: sql
        name: revenue_is_positive
        query: SELECT COUNT(*) FROM {object} WHERE revenue <= 0
        mustBe: 0
        dimension: accuracy
        businessImpact: operational
        description: >-
          gold/tests/assert_no_negative_revenue.sql — a business rule, not a
          schema shape.
    properties:
      - name: order_date
        logicalType: date
        primaryKey: true
        primaryKeyPosition: 1
      - name: country
        logicalType: string
        primaryKey: true
        primaryKeyPosition: 2
      - name: orders
        logicalType: integer
        description: Count of orders in the group.
      - name: units
        logicalType: integer
        description: Sum of quantity in the group.
      - name: revenue
        logicalType: number
        description: Sum of amount in the group.
        quality:
          - type: library
            metric: nullValues
            mustBe: 0
            unit: rows
            dimension: completeness
            description: dbt `not_null` on fct_daily_revenue.revenue.

slaProperties:
  - property: frequency
    value: 1
    unit: d
    element: dim_customer
    driver: analytics
    description: Gold is rebuilt on each pipeline run; the example runs it daily.

support:
  - channel: fabric-emulator-issues
    url: https://github.com/calvinchengx/fabric-emulator/issues
    tool: other
    scope: issues

authoritativeDefinitions:
  - url: https://github.com/calvinchengx/fabric-emulator/blob/main/docs/28-tutorial-end-to-end.md
    type: businessDefinition
    description: The tutorial this contract's pipeline implements.
  - url: https://github.com/calvinchengx/fabric-emulator/blob/main/examples/medallion/gold/models/schema.yml
    type: implementation
    description: The dbt tests that enforce every quality rule above.

tags:
  - medallion
  - gold
  - published
