# ODCS v3.1.0 — the third INBOUND contract: what Contoso ERP promises us.
#
# The other two inbound contracts describe STATE: a snapshot of customers, a
# list of orders. This one describes CHANGE. Every row is an event, and the
# consumer's job is to reconstruct state from them rather than receive it.
#
# That difference is why the quality rules here look unusual. There is no
# uniqueness rule on the business key — an ERP customer appears once per version
# and that is correct, not a defect. What the contract can promise is that the
# capture sequence is unique and that every event carries the fields needed to
# order it, because without those two an SCD2 build is impossible rather than
# merely inaccurate.
apiVersion: v3.1.0
kind: DataContract
id: 8b41f5a7-3c2e-5d19-9f04-6ea2b7c31d88
name: contoso-erp-landing
version: 1.0.0
status: draft
domain: sales
dataProduct: contoso-sales-analytics
tenant: fabric-emulator

description:
  purpose: >-
    The change-data-capture extract from Contoso ERP, the finance/back-office
    customer master. An append-only log of insert, update and delete events,
    landed byte-for-byte as Parquet under a date-partitioned path.
  usage: >-
    Read-only, by bronze only. The log is append-only: a correction arrives as
    a NEW event, never as an edit to one already sent.
  limitations: >-
    Capture order and business order DISAGREE. `capture_seq` is the order the
    connector saw events; `effective_date` is when they took effect, and a
    backfill is captured last while taking effect in the middle of a customer's
    history. Ordering by capture_seq and taking the final row yields a version
    that was superseded — order by effective_date, with capture_seq only as the
    same-day tiebreak. Deletes are SOFT: a `D` event closes the open version and
    must not be read as "remove this customer", which would destroy their
    history too. There is NO email in this system at all; phone is the only key
    it shares with Contoso POS, and it shares none with Contoso Web. Country is
    ISO-3 ("USA"), a fourth convention agreeing with neither other feed.

servers:
  - server: onelake-erp-cdc
    type: azure
    description: Change log, Parquet — columnar, as a CDC connector lands it.
    environment: dev
    location: abfs://${WORKSPACE_ID}@onelake.dfs.fabric.microsoft.com/${LAKEHOUSE_ID}/Files/landing/contoso_erp/{yyyy-MM-dd}/changes.parquet
    format: parquet

schema:
  - name: changes
    logicalType: object
    physicalType: file
    physicalName: changes.parquet
    businessName: Customer change log
    description: One row per change event, append-only.
    dataGranularityDescription: >-
      One row per EVENT. NOT one row per customer — a customer appears once per
      version, which is the whole point of the feed.
    quality:
      - type: library
        metric: rowCount
        mustBeGreaterThan: 0
        dimension: completeness
        description: An empty change log is an incident, not a quiet day.
      - type: library
        metric: duplicateValues
        mustBe: 0
        unit: rows
        dimension: uniqueness
        arguments:
          columns: ["capture_seq"]
        description: >-
          The one uniqueness promise this feed CAN make. Without a unique
          capture sequence there is no deterministic same-day tiebreak, and two
          events on one date become unorderable.
    properties:
      - name: op
        logicalType: string
        required: true
        examples: ["I", "U", "D"]
        description: >-
          Insert, Update, or soft Delete. `D` closes the open version; it does
          not remove the customer.
        quality:
          - type: library
            metric: invalidValues
            mustBe: 0
            unit: rows
            dimension: conformity
            arguments:
              validValues: ["I", "U", "D"]
      - name: capture_seq
        logicalType: integer
        required: true
        unique: true
        criticalDataElement: true
        description: >-
          Connector capture order. NOT chronological — see limitations. Safe
          only as a same-effective-date tiebreak.
      - name: erp_customer_id
        logicalType: string
        required: true
        examples: ["E-0000042"]
        description: This system's own key. Meaningless to POS and to Web.
      - name: phone
        logicalType: string
        required: true
        classification: pii
        criticalDataElement: true
        description: >-
          The ONLY key shared with Contoso POS, and the only route by which an
          ERP account can ever reach Contoso Web (transitively, through POS).
      - name: effective_date
        logicalType: string
        required: true
        criticalDataElement: true
        description: >-
          When the change took effect in the business. This — not capture_seq —
          is the column an SCD2 build must order by.
      - name: legal_name
        logicalType: string
        classification: pii
      - name: account_tier
        logicalType: string
        examples: ["standard", "preferred", "strategic", "key-account"]
      - name: segment
        logicalType: string
      - name: credit_band
        logicalType: string
      - name: account_status
        logicalType: string
      - name: payment_terms_days
        logicalType: integer
      - name: country
        logicalType: string
        description: ISO-3166 alpha-3. A fourth convention; conformity is silver's job.

slaProperties:
  - property: frequency
    value: 1
    unit: d
    element: changes
    driver: operational
    description: One CDC extract per day, date-partitioned.

support:
  - channel: contoso-erp-support
    url: https://example.com/contoso-erp/support
    tool: other
    scope: issues
    description: Fictitious system — the channel exists to show where it belongs.

authoritativeDefinitions:
  - url: https://github.com/calvinchengx/fabric-emulator/blob/main/examples/medallion/erp_system.py
    type: implementation
    description: The CDC stub this contract describes.

tags:
  - medallion
  - landing
  - inbound
  - cdc
