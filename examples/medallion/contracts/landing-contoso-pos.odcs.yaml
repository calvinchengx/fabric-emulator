# ODCS v3.1.0 — the INBOUND contract: what Contoso POS promises us.
#
# This one is not written by the pipeline team. It is the agreement with the
# upstream vendor, and it is the only contract here whose quality rules are
# about ARRIVAL rather than cleanliness — landing is stored verbatim, so
# asserting that it is clean would assert something we have no right to.
# Everything known to be wrong with the feed is declared under
# `description.limitations` instead, where a consumer will actually read it.
apiVersion: v3.1.0
kind: DataContract
id: 4e21d820-05e9-59ed-bfe0-45f665ac05c2
name: contoso-pos-landing
version: 1.0.0
status: draft
domain: sales
dataProduct: contoso-sales-analytics
tenant: fabric-emulator

description:
  purpose: >-
    The daily export from Contoso POS, the SaaS point-of-sale system, landed
    byte-for-byte in OneLake under a date-partitioned path. Landing is the
    system of record for what the vendor actually sent.
  usage: >-
    Read-only. Bronze ingests it; nothing else should. Files are immutable once
    written — a correction arrives as a new date partition, never as an edit.
  limitations: >-
    Known-dirty by design, and none of it is fixed here. Order events are
    delivered AT LEAST ONCE, so order_id repeats. Country is free text with at
    least five spellings of three countries. Customer rows repeat. email may be
    empty. Malformed orders (non-positive quantity, absent unit_price) are
    exported rather than rejected. Consumers must not treat any column as
    unique, conformed, or complete until silver.

servers:
  - server: onelake-landing-csv
    type: azure
    description: Customer export, delimited text, under the lakehouse Files area.
    environment: dev
    location: abfs://${WORKSPACE_ID}@onelake.dfs.fabric.microsoft.com/${LAKEHOUSE_ID}/Files/landing/contoso_pos/{yyyy-MM-dd}/customers.csv
    format: csv
    delimiter: ","
  - server: onelake-landing-jsonl
    type: azure
    description: Order events, JSON Lines — one event per line, not an array.
    environment: dev
    location: abfs://${WORKSPACE_ID}@onelake.dfs.fabric.microsoft.com/${LAKEHOUSE_ID}/Files/landing/contoso_pos/{yyyy-MM-dd}/orders.jsonl
    format: json

schema:
  - name: customers
    logicalType: object
    physicalType: file
    physicalName: customers.csv
    businessName: Customer export
    description: Full snapshot of the customer master, exported daily.
    dataGranularityDescription: >-
      One line per customer row as exported. NOT one row per customer — the
      vendor is known to repeat rows.
    quality:
      - type: library
        metric: rowCount
        mustBeGreaterThan: 0
        dimension: completeness
        description: >-
          An empty export is an incident, not a valid day. This is the only
          thing landing asserts about content.
    properties:
      - name: customer_id
        logicalType: string
        required: true
        examples: ["C-001"]
      - name: name
        logicalType: string
      - name: email
        logicalType: string
        classification: pii
        description: May be empty; the vendor does not require it.
      - name: country
        logicalType: string
        description: >-
          Free text, NOT ISO-3166. Observed values include US, USA, us, GB and
          "U.K." — conformity is silver's job.

  - name: orders
    logicalType: object
    physicalType: file
    physicalName: orders.jsonl
    businessName: Order event stream
    description: Order events since the last export.
    dataGranularityDescription: >-
      One line per EVENT, not per order. Redeliveries share an order_id and are
      distinguished by event_seq.
    quality:
      - type: library
        metric: rowCount
        mustBeGreaterThan: 0
        dimension: completeness
    properties:
      - name: order_id
        logicalType: string
        required: true
        description: Not unique in this feed — see event_seq.
        examples: ["O-1003"]
      - name: customer_id
        logicalType: string
        required: true
      - name: order_date
        logicalType: string
        description: ISO date as a string; typed only in silver.
      - name: quantity
        logicalType: integer
        description: May be non-positive on a malformed event.
      - name: unit_price
        logicalType: number
        description: May be absent on a malformed event.
      - name: status
        logicalType: string
        examples: ["shipped", "pending", "error"]
      - name: event_seq
        logicalType: integer
        description: >-
          Vendor's monotonic sequence within an export. Silver's dedupe orders
          by this and keeps the last, so it is load-bearing, not decorative.

slaProperties:
  - property: frequency
    value: 1
    unit: d
    element: orders
    driver: operational
    description: One export per day, date-partitioned.

support:
  - channel: contoso-pos-support
    url: https://example.com/contoso-pos/support
    tool: other
    scope: issues
    description: Fictitious vendor — the channel exists to show where it belongs.

authoritativeDefinitions:
  - url: https://github.com/calvinchengx/fabric-emulator/blob/main/examples/medallion/source_system.py
    type: implementation
    description: >-
      The vendor stub this contract describes. In a real engagement this would
      point at the vendor's OpenAPI document instead.

tags:
  - medallion
  - landing
  - inbound
