# ODCS v3.1.0 — the REFERENCE contract, and the only one here that is not
# about an operational system.
#
# The three inbound contracts describe systems that record what happened. This
# describes data published so that what happened can be COMPARED: rates that
# make two currencies one number, and a hierarchy that makes a product roll up.
#
# Its quality rules are the inverse of the others'. An operational feed is
# known-dirty and the contract says so. A reference feed is curated, so the
# contract can promise conformity and completeness — and the one thing it must
# NOT promise is a rate for every calendar day, because rates are published on
# business days only. Declaring that gap is more useful than pretending to fill
# it: it forces the consumer to choose a carry-forward rule deliberately.
apiVersion: v3.1.0
kind: DataContract
id: c5d97e10-4b6a-5f28-8d33-91ac4e7b0f52
name: contoso-reference
version: 1.0.0
status: draft
domain: sales
dataProduct: contoso-sales-analytics
tenant: fabric-emulator

description:
  purpose: >-
    Published master and reference data: daily FX rates against USD, and the
    product hierarchy above the flat category the operational catalog carries.
    Landed as Parquet under a date-partitioned path.
  usage: >-
    Read-only. Joined by silver and gold to convert amounts to the reporting
    currency and to roll products up. Owned by finance and merchandising, not
    by the pipeline team.
  limitations: >-
    Rates are published on BUSINESS DAYS ONLY. There is no row for a weekend or
    a holiday, so a consumer joining orders to rates on an equality of dates
    will silently lose every weekend order. The correct read is "the last rate
    published on or before this date", and choosing that rule is the consumer's
    decision to make explicitly. USD is published with a rate of exactly 1.0
    rather than omitted, so no consumer needs to special-case the reporting
    currency. The hierarchy covers exactly the products in the operational
    catalog; a product_id absent from it is a referential break upstream, not a
    gap here.

servers:
  - server: onelake-fx
    type: azure
    description: FX rates, Parquet.
    environment: dev
    location: abfs://${WORKSPACE_ID}@onelake.dfs.fabric.microsoft.com/${LAKEHOUSE_ID}/Files/landing/reference/{yyyy-MM-dd}/fx_rates.parquet
    format: parquet
  - server: onelake-hierarchy
    type: azure
    description: Product hierarchy, Parquet.
    environment: dev
    location: abfs://${WORKSPACE_ID}@onelake.dfs.fabric.microsoft.com/${LAKEHOUSE_ID}/Files/landing/reference/{yyyy-MM-dd}/product_hierarchy.parquet
    format: parquet

schema:
  - name: fx_rates
    logicalType: object
    physicalType: file
    physicalName: fx_rates.parquet
    businessName: FX rates to USD
    description: One row per (rate_date, currency).
    dataGranularityDescription: One row per currency per PUBLISHED day.
    quality:
      - type: library
        metric: rowCount
        mustBeGreaterThan: 0
        dimension: completeness
      - type: library
        metric: duplicateValues
        mustBe: 0
        unit: rows
        dimension: uniqueness
        arguments:
          columns: ["rate_date", "currency"]
        description: >-
          Two rates for one currency on one day would make conversion
          non-deterministic.
    properties:
      - name: rate_date
        logicalType: string
        required: true
        description: >-
          Business days only. Absent for weekends — carry the last published
          rate forward rather than dropping the row.
      - name: currency
        logicalType: string
        required: true
        examples: ["USD", "GBP", "SGD", "EUR"]
        quality:
          - type: library
            metric: invalidValues
            mustBe: 0
            unit: rows
            dimension: conformity
            arguments:
              validValues: ["USD", "GBP", "SGD", "EUR"]
      - name: rate_to_usd
        logicalType: number
        required: true
        criticalDataElement: true
        description: >-
          Multiply a native amount by this to get USD. Exactly 1.0 for USD, so
          the reporting currency needs no special case.

  - name: product_hierarchy
    logicalType: object
    physicalType: file
    physicalName: product_hierarchy.parquet
    businessName: Product hierarchy
    description: One row per product, with the levels above its flat category.
    dataGranularityDescription: One row per product_id.
    quality:
      - type: library
        metric: rowCount
        mustBeGreaterThan: 0
        dimension: completeness
    properties:
      - name: product_id
        logicalType: string
        required: true
        unique: true
        primaryKey: true
        primaryKeyPosition: 1
        criticalDataElement: true
        quality:
          - type: library
            metric: duplicateValues
            mustBe: 0
            unit: rows
            dimension: uniqueness
      - name: product_name
        logicalType: string
      - name: category
        logicalType: string
        description: The level the operational catalog already carries.
      - name: department
        logicalType: string
        description: Added here; the operational systems do not know it.
      - name: segment
        logicalType: string
      - name: list_price_usd
        logicalType: number
        description: >-
          Catalogue price. A line may be charged a different price, and the two
          are allowed to differ — do not use this to recompute revenue.

slaProperties:
  - property: frequency
    value: 1
    unit: d
    element: fx_rates
    driver: operational
    description: Published each business day.

support:
  - channel: contoso-reference-support
    url: https://example.com/contoso-reference/support
    tool: other
    scope: issues
    description: Fictitious publisher — the channel exists to show where it belongs.

authoritativeDefinitions:
  - url: https://github.com/calvinchengx/fabric-emulator/blob/main/examples/medallion/reference_data.py
    type: implementation
    description: The reference publisher stub this contract describes.

tags:
  - medallion
  - landing
  - reference
  - master-data
