name: contoso_gold
version: "1.0.0"
config-version: 2
profile: contoso_gold
model-paths: ["models"]
test-paths: ["tests"]

# Tables, using dbt-fabric's own `table` materialization — no emulator-shaped
# workaround. That materialization ships its DDL as
# `EXEC('CREATE TABLE … AS SELECT …')`: Fabric/Synapse CTAS, which vanilla SQL
# Server rejects. The emulator rewrites it to `SELECT … INTO` on the wire,
# inside the EXEC literal, so gold materialises here exactly as it would on
# Fabric. See docs/29-tsql-parity.md (T8).
models:
  contoso_gold:
    +materialized: table
