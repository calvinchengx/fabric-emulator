packages:
  - portal
  - website

# pnpm 10 blocks dependency build scripts by default; allow the ones Astro
# needs to compile native/optimized assets.
onlyBuiltDependencies:
  - esbuild
  - sharp

# Security floors for transitive deps (Dependabot). Each of these arrives through
# something else — Astro, Starlight, their remark/rehype chains — so there is no
# manifest to bump; the override is the only lever.
#
#   postcss  < 8.5.18  parsing vulnerability
#   js-yaml  < 4.3.1   CVE-2026-59870, quadratic CPU in `!!omap` resolution.
#                      Bounded `<5` deliberately: a bare `>=4.3.1` resolves to
#                      5.2.3 and hands Astro's remark chain a different major.
#                      The fix is a patch, so stay in the major that shipped it.
#   nanoid   < 3.3.17  GHSA-2v37-7h3g-55p8, a custom generator loops forever
#                      when `size` is zero. Arrives under postcss, which is
#                      itself transitive. Bounded `<4` for the js-yaml reason
#                      and then some: nanoid is at 6.x and went ESM-only after
#                      3.x, so a bare `>=3.3.17` would hand postcss a package it
#                      cannot require(). The fix shipped as 3.3.17, in the major
#                      that needs it.
overrides:
  postcss: ">=8.5.18"
  js-yaml: ">=4.3.1 <5"
  nanoid: ">=3.3.17 <4"
