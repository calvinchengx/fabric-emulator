packages:
  - portal
  - website

# pnpm 10 blocks dependency build scripts by default; allow the ones Astro
# needs to compile native/optimized assets.
onlyBuiltDependencies:
  - esbuild
  - sharp

# Security floor for transitive deps (Dependabot): postcss < 8.5.18 has a
# parsing vulnerability; nothing we use needs the old behavior.
overrides:
  postcss: ">=8.5.18"
