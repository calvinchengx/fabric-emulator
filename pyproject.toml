[project]
name = "fabric-emulator-python"
version = "0.1.0"
description = "Locked Python tooling and end-to-end witnesses for fabric-emulator"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
test = [
    "fabric-emulator-notebookutils",
    "fabric-target",
    "pytest>=8.3,<10",
]
adls-sdk = [
    "azure-storage-blob>=12.24,<13",
    "pyarrow>=18,<24",
]
delta-rs = [
    "deltalake>=0.23,<2",
    "pyarrow>=18,<24",
]
duckdb = [
    "deltalake>=0.23,<2",
    "duckdb>=1.1,<2",
    "pyarrow>=18,<24",
]
s3 = [
    "boto3>=1.35,<2",
    "requests>=2.32,<3",
]
fabric-cicd = ["fabric-cicd>=0.1"]
fabric-cli = ["ms-fabric-cli>=1.2"]
fabric-target = [
    "fabric-target[real,sessions]",
    "pytest>=8.3,<10",
]
governance = [
    "deltalake>=0.23,<2",
    "pyarrow>=18,<24",
    "requests>=2.32,<3",
]
great-expectations = [
    "great-expectations>=0.18,<1",
    "pandas>=2.2,<4",
]
runtime = []
# pyspark-client is pinned to what pysail 0.6.6 is built and tested against
# (its own `test` extra pins 4.1.1). This is not cosmetic: 4.2.0 added
# `runner_conf`/`eval_conf` to `pyspark.worker.read_udfs`, which Sail calls with
# the 3-argument form, so every Python UDF died with
#   TypeError: read_udfs() missing 2 required positional arguments
# The UDF runs inside the Sail server's embedded CPython, so the *server* image
# is what must match — but client and server are pinned together so the two
# never drift apart. Revisit when pysail supports a newer client.
sail = [
    "pysail==0.6.6",
    "pyspark-client==4.1.1",
]
# The Sail statement agent also runs Delta maintenance (OPTIMIZE/VACUUM/CDF)
# through delta-rs, since Sail's planner has no such commands — so the runtime
# that hosts the agent needs both the Connect client and deltalake. This IS the
# spark-agent image's group; the engine matrix's "Sail + delta-rs" column builds
# from it too, so that column measures the shipped runtime rather than a
# lookalike. requests for the same reason spark-connect carries it: user
# notebook code calls HTTP APIs, and the agent is where that code runs.
sail-delta = [
    "pyspark-client==4.1.1",
    "deltalake>=0.23,<2",
    "pandas>=2,<3",
    "pyarrow>=18,<24",
    "requests>=2.32,<3",
]
# requests: user notebook code (and libraries it imports) routinely calls HTTP
# APIs, and the statement agent is where that code executes.
spark-connect = ["pyspark-client==4.1.1", "requests>=2.32,<3"]
dbt-fabric = ["dbt-fabric>=1.9"]
dbt-fabricspark = ["dbt-fabricspark>=1.9"]
dbt-duckdb = [
    "dbt-duckdb>=1.9,<2",
    "deltalake>=0.23,<2",
    "pyarrow>=18,<24",
]
mlflow = ["mlflow>=3.1,<4"]
rti = [
    "azure-kusto-data>=5,<6",
    "requests>=2.32,<3",
]
data-science-loop = [
    "dbt-duckdb>=1.9,<2",
    "deltalake>=0.23,<2",
    "mlflow>=3.1,<4",
    "pyarrow>=18,<24",
    "pyspark-client==4.1.1",
]
# The end-to-end medallion tutorial (docs/28-tutorial-end-to-end.md): delta-rs
# writes the lakehouse layers, dbt-fabric builds gold over TDS via pyodbc +
# ODBC Driver 18, requests drives every REST surface.
medallion = [
    "dbt-fabric>=1.9",
    "deltalake>=0.23,<2",
    "pandas>=2.2,<4",
    "pyarrow>=18,<24",
    "requests>=2.32,<3",
]

[tool.uv]
package = false
conflicts = [
    [
        { group = "dbt-fabric" },
        { group = "dbt-fabricspark" },
    ],
    # medallion carries dbt-fabric, so it conflicts with the fabricspark adapter
    # for the same reason the group above does.
    [
        { group = "medallion" },
        { group = "dbt-fabricspark" },
    ],
]

[tool.uv.sources]
fabric-emulator-notebookutils = { workspace = true }
fabric-target = { workspace = true }

[tool.uv.workspace]
members = ["python", "python/fabric-target"]

[tool.pytest.ini_options]
testpaths = ["python/tests", "python/fabric-target/tests"]
markers = [
    "target: dual-target conformance runs against fabric-emulator or real Fabric per FABRIC_TARGET",
]
